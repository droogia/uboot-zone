/* =========================================================
   MATH HELPERS
   ========================================================= */
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const wrap360 = a => ((a % 360) + 360) % 360;
// Signed difference a - b in (-180, 180].
const angleDiff = (a, b) => {
  let d = wrap360(a - b);
  if (d > 180) d -= 360;
  return d;
};
const bearingTo = (x1, y1, x2, y2) => wrap360(Math.atan2(x2 - x1, y2 - y1) / DEG);
const dist2d = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const approach = (v, target, dt, tau) => v + (target - v) * (1 - Math.exp(-dt / tau));

// Small seeded PRNG (mulberry32) so a game can be replayed in tests.
function makeRng(seed) {
  let a = seed >>> 0;
  const rng = () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  rng.range = (lo, hi) => lo + rng() * (hi - lo);
  rng.gauss = () => {
    let u = 0, v = 0;
    while (u === 0) u = rng();
    while (v === 0) v = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
  };
  rng.pick = arr => arr[Math.floor(rng() * arr.length)];
  return rng;
}

// Course a torpedo at speed vt must steer from (sx, sy) to meet a target at
// (tx, ty) moving with velocity (tvx, tvy), all in m and m/s.
// Returns { course, time } or null if there is no interception.
function interceptCourse(sx, sy, tx, ty, tvx, tvy, vt) {
  const rx = tx - sx, ry = ty - sy;
  const a = tvx * tvx + tvy * tvy - vt * vt;
  const b = 2 * (rx * tvx + ry * tvy);
  const c = rx * rx + ry * ry;
  let t;
  if (Math.abs(a) < 1e-9) {
    if (Math.abs(b) < 1e-9) return null;
    t = -c / b;
  } else {
    const disc = b * b - 4 * a * c;
    if (disc < 0) return null;
    const sq = Math.sqrt(disc);
    const t1 = (-b - sq) / (2 * a), t2 = (-b + sq) / (2 * a);
    t = Math.min(t1, t2) > 0 ? Math.min(t1, t2) : Math.max(t1, t2);
  }
  if (!(t > 0)) return null;
  const ax = tx + tvx * t, ay = ty + tvy * t;
  return { course: bearingTo(sx, sy, ax, ay), time: t };
}

/* =========================================================
   WIREFRAME MODELS
   Local frame: z = towards the bow, x = starboard, y = up (metres).
   A model is a flat array of segments: x1, y1, z1, x2, y2, z2, ...
   ========================================================= */
function modelBuilder() {
  const e = [];
  const api = {
    edges: e,
    line(x1, y1, z1, x2, y2, z2) { e.push(x1, y1, z1, x2, y2, z2); },
    poly(pts, closed) {
      for (let i = 0; i < pts.length - (closed ? 0 : 1); i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        api.line(a[0], a[1], a[2], b[0], b[1], b[2]);
      }
    },
    box(x0, x1, y0, y1, z0, z1) {
      api.poly([[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]], true);
      api.poly([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], true);
      api.line(x0, y0, z0, x0, y1, z0); api.line(x1, y0, z0, x1, y1, z0);
      api.line(x1, y0, z1, x1, y1, z1); api.line(x0, y0, z1, x0, y1, z1);
    },
    // Raked funnel: an octagonal prism whose top is moved aft by `rake`.
    funnel(z, rx, rz, y0, y1, rake) {
      const n = 8, bottom = [], top = [];
      for (let i = 0; i < n; i++) {
        const a = (i / n) * TAU;
        bottom.push([Math.cos(a) * rx, y0, z + Math.sin(a) * rz]);
        top.push([Math.cos(a) * rx, y1, z - rake + Math.sin(a) * rz]);
      }
      api.poly(bottom, true);
      api.poly(top, true);
      for (let i = 0; i < n; i += 2) api.line(...bottom[i], ...top[i]);
    },
    // Hull above the waterline: deck edge, waterline, stem, transom and a few frames.
    hull(o) {
      const L = o.length, B = o.beam, half = L / 2;
      const zs = [];
      for (let i = 0; i <= 12; i++) zs.push(-half + (L * i) / 12);
      zs.push(half - o.bowLen * 0.5, half - o.bowLen * 0.2, half - o.bowLen * 0.05);
      zs.sort((a, b) => a - b);
      const halfBeam = z => {
        if (z > half - o.bowLen) return (B / 2) * Math.sqrt(Math.max(0, (half - z) / o.bowLen));
        if (z < -half + o.sternLen) {
          const t = (z + half) / o.sternLen;
          return (B / 2) * (o.sternWidth + (1 - o.sternWidth) * Math.sqrt(t));
        }
        return B / 2;
      };
      const deck = z => o.freeboard + (z > 0 ? o.sheerBow * (z / half) ** 2 : o.sheerStern * (z / half) ** 2);
      const wl = z => (z > 0 ? z * (half - o.rake) / half : z);
      const deckP = zs.map(z => [halfBeam(z), deck(z), z]);
      const wlP = zs.map(z => [halfBeam(z) * 0.97, 0, wl(z)]);
      api.poly(deckP.map(p => [p[0], p[1], p[2]]));
      api.poly(deckP.map(p => [-p[0], p[1], p[2]]));
      api.poly(wlP.map(p => [p[0], p[1], p[2]]));
      api.poly(wlP.map(p => [-p[0], p[1], p[2]]));
      const last = zs.length - 1;
      api.line(0, deck(zs[last]), zs[last], 0, 0, wl(zs[last]));                 // stem
      const s0 = deckP[0], w0 = wlP[0];
      api.line(-s0[0], s0[1], s0[2], s0[0], s0[1], s0[2]);                      // transom
      api.line(-w0[0], 0, w0[2], w0[0], 0, w0[2]);
      for (const side of [-1, 1]) {
        api.line(side * s0[0], s0[1], s0[2], side * w0[0], 0, w0[2]);
        for (const i of [3, 6, 9]) {
          const z = -half + (L * i) / 12;
          api.line(side * halfBeam(z), deck(z), z, side * halfBeam(z) * 0.97, 0, wl(z));
        }
      }
      return deck;
    },
  };
  return api;
}

function buildFreighter() {
  const m = modelBuilder();
  const deck = m.hull({ length: 125, beam: 17, freeboard: 7, sheerBow: 3, sheerStern: 1.5, bowLen: 22, sternLen: 14, sternWidth: 0.55, rake: 5 });
  m.box(-6.5, 6.5, 7.2, 10.5, -3, 12);                     // midships house
  m.box(-5, 5, 10.5, 13.5, -1, 10);
  m.box(-3, 3, 13.5, 16, 4, 9);                            // wheelhouse
  m.line(-8.5, 13.5, 8, 8.5, 13.5, 8);                     // bridge wings
  m.funnel(-8, 2.2, 2.6, 10.5, 22, 1.6);
  for (const z of [38, -38]) {                             // masts and derricks
    m.line(0, deck(z), z, 0, 30, z);
    m.line(-3.5, 26, z, 3.5, 26, z);
    m.line(0, 26, z, -3.5, deck(z), z);
    m.line(0, 26, z, 3.5, deck(z), z);
    const dz = z > 0 ? 1 : -1;
    m.line(0, deck(z) + 2, z, 0, deck(z) + 8, z + dz * 14);
    m.line(0, deck(z) + 2, z, 0, deck(z) + 8, z - dz * 14);
  }
  for (const [z0, z1] of [[46, 54], [22, 31], [-28, -19], [-50, -42]]) {
    const d = deck((z0 + z1) / 2);
    m.box(-4, 4, d, d + 1.4, z0, z1);                      // hatches
  }
  m.box(-6, 6, 7.8, 10.5, -60, -50);                       // poop house
  return m.edges;
}

  m.funnel(-61, 2.4, 3, 12.5, 21, 1.2);
  m.line(0, 7, -48, 0, 7, 18);                             // catwalk
  m.line(0, 7, 28, 0, 7, 62);
  for (let z = -40; z <= 60; z += 20) if (z < 18 || z > 28) m.line(0, deck(z), z, 0, 7, z);

}

function buildPlane(span, length, engines, flyingBoat) {
  const m = modelBuilder();
  const L = length / 2, fh = flyingBoat ? 2.6 : 1.5;
  m.poly([[0, 0, L + 1.5], [-fh, -fh * 0.6, L - 3], [-fh * 0.7, -fh * 0.3, -L], [fh * 0.7, -fh * 0.3, -L], [fh, -fh * 0.6, L - 3]], true);
  m.poly([[0, 0, L + 1.5], [0, fh, L - 4], [0, fh * 0.6, -L], [0, -fh * 0.3, -L]], false);
  m.line(-fh, -fh * 0.6, L - 3, -fh * 0.7, -fh * 0.3, -L);
  m.line(fh, -fh * 0.6, L - 3, fh * 0.7, -fh * 0.3, -L);
  const wy = flyingBoat ? fh : 0, wz = L * 0.25, chord = length * 0.2;
  m.poly([[-span / 2, wy, wz - chord * 0.3], [span / 2, wy, wz - chord * 0.3], [span / 2, wy, wz - chord], [-span / 2, wy, wz - chord]], true);
  m.poly([[-span * 0.17, fh * 0.4, -L + 2.5], [span * 0.17, fh * 0.4, -L + 2.5], [span * 0.17, fh * 0.4, -L], [-span * 0.17, fh * 0.4, -L]], true);
  m.poly([[0, fh * 0.6, -L + 3.5], [0, fh * 0.6 + 4.5, -L + 0.5], [0, fh * 0.6 + 4.5, -L], [0, fh * 0.6, -L]], false);
  const xs = engines === 4 ? [-9, -4.5, 4.5, 9] : [-4, 4];
  for (const x of xs) m.box(x - 0.7, x + 0.7, wy - 1.2, wy, wz - chord * 0.6, wz + 1.5);
  if (flyingBoat) for (const x of [-span * 0.42, span * 0.42]) m.line(x, wy, wz - chord * 0.6, x, wy - 3, wz - chord * 0.6);
  return m.edges;
}

/* =========================================================
   GAME STATE
   ========================================================= */
function createGame(opts = {}) {
  const seed = opts.seed !== undefined ? opts.seed : (Date.now() ^ 0x5bd1e995) >>> 0;
  const rng = makeRng(seed);
  const diffName = opts.difficulty && DIFFICULTY[opts.difficulty] ? opts.difficulty : 'normal';
  const g = {
    rng,
    difficulty: diffName,
    diff: Object.assign({}, DIFFICULTY[diffName], opts.diffOverrides || {}),
    state: 'playing',               // 'playing' | 'lost'
    lostReason: '',
    lostAt: 0,
    time: 0,                        // game seconds
    realTime: 0,
    nextId: 1,
    player: {
      x: 0, y: 0,
      heading: Math.floor(rng() * 360),
      speed: 3,
      telegraph: 3,
      turnRate: 0,
      rudder: 0,
      depth: PERISCOPE_DEPTH,
      orderedDepth: PERISCOPE_DEPTH,
      vz: 0,
      crashDive: false,
      periscopeUp: true,
      periscopeRaise: 1,
      scopeBearing: 0,              // relative to the bow
      zoom: 0,                      // 0 = low power, 1 = high power
      silent: false,
      battery: 100,
      air: 100,
      hull: 100,
      noise: 0,
      noiseSpike: 0,
      tubes: [0, 1, 2, 3, 4].map(() => ({ state: 'ready', t: 0 })),
      reserve: TORPEDO.maxReserve,
      selectedTube: 0,
      lock: null,
      cracks: [],
      alive: true,
    },
    ships: [],
    torpedoes: [],
    charges: [],
    shells: [],
    effects: [],
    planes: [],
    mines: [],
    convoy: null,
    area: null,                     // centre of the action when there is no convoy
    cond: makeConditions('day', 'moderate', false),
    mission: { type: 'convoy', name: MISSION_NAMES.convoy, timer: 0 },
    briefing: null,
    air: { on: false, nextT: 0 },
    warn: { torpedo: false, aircraft: false, mines: false },
    detected: false,
    asdicNear: 0,                   // real time of the last enemy ping heard close by
    sonar: { sweep: 0, blips: [], ping: null, pingReady: 0 },
    patrol: 0,
    patrolState: 'active',
    patrolTimer: 0,
    messages: [],
    events: [],
    stats: {
      fired: 0, hits: 0, duds: 0, misses: 0,
      sunk: { freighter: 0, tanker: 0, corvette: 0, destroyer: 0, tclass: 0 },
      tonnage: 0, bonus: 0, chargesNear: 0, damageTaken: 0, maxDepth: PERISCOPE_DEPTH,
      timeSubmerged: 0, pings: 0, patrolsDone: 0, missionsWon: 0,
      airAttacks: 0, torpedoesDodged: 0, torpedoHits: 0, minesHit: 0,
    },
  };
  if (!opts.noPatrol) startPatrol(g, opts.mission);
  return g;
}

function makeConditions(time, sea, fog) {
  const t = CONDITIONS.time[time], s = CONDITIONS.sea[sea];
  return {
    time, sea, fog,
    vis: t.vis * (fog ? 0.35 : 1) * (sea === 'storm' ? 0.8 : 1),
    wave: s.wave,
    hear: s.hear,
    airOps: time !== 'night' && sea !== 'storm' && !fog,
  };
}

function conditionsText(c) {
  return [CONDITIONS.time[c.time].name, CONDITIONS.sea[c.sea].name].concat(c.fog ? ['FOG'] : []).join(' · ');
}

function visualRange(g) {
  return VIEW.visualRange * g.cond.vis;
}

const score = g => g.stats.tonnage + g.stats.bonus;

function say(g, text, color) {
  g.messages.push({ text, color: color || 'green', t: g.realTime });
  if (g.messages.length > 6) g.messages.shift();
}

function emit(g, type, data) {
  g.events.push(Object.assign({ type }, data || {}));
  if (g.events.length > 200) g.events.shift();
}

function makeShip(g, kind, x, y, heading, speed) {
  const c = SHIP_CLASSES[kind];
  const grt = Math.round(g.rng.range(c.grt[0], c.grt[1]) / 10) * 10;
  const ship = {
    id: g.nextId++,
    kind,
    role: c.role,
    name: c.prefix + ' ' + g.rng.pick(SHIP_NAMES[kind]),
    cls: c.cls,
    x, y, heading, speed,
    targetSpeed: speed,
    length: c.length,
    beam: c.beam,
    grt,
    hp: kind === 'tanker' || (kind === 'freighter' && grt > 6200) ? 2 : 1,
    maxHp: 0,
    burning: false,
    sinking: null,
    station: { lat: 0, lon: 0 },
  };
  ship.maxHp = ship.hp;
  if (c.role === 'sub') {
    ship.depth = PERISCOPE_DEPTH;
    ship.ai = {
      state: 'patrol', contact: 0, hasContact: false, lastKnown: null, lastKnownT: -1e9, depthEst: 50,
      detT: g.rng(), salvoT: g.rng.range(20, 60), evadeT: 0, depthOrder: PERISCOPE_DEPTH, crash: false,
      wp: null, reactT: -1, heard: {},
    };
  }
  if (c.role === 'escort') {
    ship.ai = {
      state: 'escort', contact: 0, hasContact: false, lastKnown: null, lastKnownT: -1e9,
      depthEst: 50, detT: g.rng() * 1, pingT: g.rng() * 10, cooldown: 0, drops: [],
      runout: 0, charges: c.charges, gunT: 5, weave: g.rng() * TAU,
    };
  }
  g.ships.push(ship);
  return ship;
}

function startPatrol(g, type) {
  g.patrol++;
  const n = g.patrol, rng = g.rng, p = g.player;
  g.ships = [];
  g.charges = [];
  g.shells = [];
  g.planes = [];
  g.mines = [];
  g.torpedoes = [];
  g.sonar.blips = [];
  g.detected = false;
  g.convoy = null;
  g.area = null;
  p.lock = null;
  if (!type || !MISSION_NAMES[type]) {
    type = n <= MISSION_ORDER.length ? MISSION_ORDER[n - 1] : rng.pick(['convoy', 'convoy', 'duel', 'hunters', 'anchorage']);
  }
  if (n === 1) g.cond = makeConditions('day', 'moderate', false);
  else {
    const r1 = rng(), r2 = rng();
    const time = r1 < 0.45 ? 'day' : r1 < 0.7 ? 'dusk' : 'night';
    const sea = r2 < 0.3 ? 'calm' : r2 < 0.8 ? 'moderate' : 'storm';
    g.cond = makeConditions(time, sea, sea !== 'storm' && rng() < 0.15);
  }
  g.mission = { type, name: MISSION_NAMES[type], timer: 0 };
  const b = rng() * 360;
  const spawn = { convoy: spawnConvoy, duel: spawnDuel, hunters: spawnHunters, anchorage: spawnAnchorage }[type];
  const intel = spawn(g, n, b);
  g.air = { on: g.cond.airOps && (type === 'hunters' || type === 'anchorage' || (type === 'convoy' && n >= 2)), nextT: rng.range(150, 320) };
  g.patrolState = 'active';
  g.briefing = {
    title: `PATROL ${n} · ${g.mission.name}`,
    orders: intel.orders,
    intel: intel.intel,
    conditions: conditionsText(g.cond),
    air: g.air.on ? 'Enemy aircraft are patrolling the area.' : 'No enemy air cover expected.',
  };
  say(g, `PATROL ${n}: ${intel.short}`, 'yellow');
  emit(g, 'patrol', { n, mission: type });
}

const brg3 = b => String(Math.round(wrap360(b)) % 360).padStart(3, '0');

function spawnConvoy(g, n, b) {
  const rng = g.rng, p = g.player;
  const merchants = Math.min(3 + n, 10);
  const escorts = Math.min(1 + Math.floor(n / 2), 5);
  const speed = 7 + Math.min(n - 1, 4) * 0.6;
  const d = rng.range(9000, 11000);
  const cx = p.x + Math.sin(b * DEG) * d, cy = p.y + Math.cos(b * DEG) * d;
  const course = wrap360(b + 180 + rng.range(-35, 35));
  g.convoy = { x: cx, y: cy, course, baseCourse: course, speed, legT: rng.range(200, 400), alert: false };

  const cols = Math.ceil(merchants / 3);
  for (let i = 0; i < merchants; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const lat = (col - (cols - 1) / 2) * 650;
    const lon = -row * 550;
    const kind = i % 3 === 1 ? 'tanker' : 'freighter';
    const s = makeShip(g, kind, 0, 0, course, speed);
    s.station = { lat, lon };
    placeOnStation(g, s);
  }
  const rows = Math.ceil(merchants / cols);
  const halfWidth = ((cols - 1) / 2) * 650;
  const escortStations = [
    { lat: 0, lon: 1500 },
    { lat: -halfWidth - 1300, lon: -(rows - 1) * 275 },
    { lat: halfWidth + 1300, lon: -(rows - 1) * 275 },
    { lat: 0, lon: -(rows - 1) * 550 - 1300 },
    { lat: -halfWidth - 900, lon: 900 },
  ];
  for (let i = 0; i < escorts; i++) {
    const kind = (i + n) % 2 === 0 || n >= 4 ? 'destroyer' : 'corvette';
    const s = makeShip(g, i === 0 && n === 1 ? 'corvette' : kind, 0, 0, course, speed);
    s.station = escortStations[i];
    placeOnStation(g, s);
  }
  return {
    short: `CONVOY REPORTED BEARING ${brg3(b)}, RANGE ~${Math.round(d / 1000)} KM`,
    orders: 'Intercept the convoy and sink the merchant ships. The escorts are worth tonnage too, but they bite.',
    intel: `${merchants} merchants with ${escorts} escort${escorts > 1 ? 's' : ''}, bearing ${brg3(b)}, range about ${Math.round(d / 1000)} km, speed about ${Math.round(speed)} knots.`,
  };
}

function spawnDuel(g, n, b) {
  const rng = g.rng, p = g.player;
  const count = n >= 7 ? 2 : 1;
  const d = rng.range(6000, 8000);
  const x = p.x + Math.sin(b * DEG) * d, y = p.y + Math.cos(b * DEG) * d;
  g.area = { x, y, r: 2500 };
  for (let i = 0; i < count; i++) {
    const s = makeShip(g, 'tclass', x + rng.range(-800, 800), y + rng.range(-800, 800), rng() * 360, 4);
    if (g.cond.time === 'night') { s.depth = 0; s.ai.depthOrder = 0; }
    // It has been told roughly where we are, too.
    s.ai.state = 'stalk';
    setLastKnown(g, s, 1500);
  }
  return {
    short: `ENEMY SUBMARINE REPORTED BEARING ${brg3(b)}`,
    orders: `${count > 1 ? 'Two enemy submarines are' : 'An enemy submarine is'} hunting in this sector. Find ${count > 1 ? 'them' : 'it'} and sink ${count > 1 ? 'them' : 'it'} before ${count > 1 ? 'they sink' : 'it sinks'} you.`,
    intel: `Last reported bearing ${brg3(b)}, range about ${Math.round(d / 1000)} km. Our torpedoes only hit a submarine at periscope depth or surfaced. Its torpedoes run shallow: deeper than ${ENEMY_TORPEDO.hitDepth} m you are safe from them.`,
  };
}

function spawnHunters(g, n, b) {
  const rng = g.rng, p = g.player;
  const count = Math.min(3 + Math.floor(n / 8), 5);
  g.area = { x: p.x, y: p.y, r: 3000 };
  g.mission.timer = HUNT_TIME;
  for (let i = 0; i < count; i++) {
    const a = b + (i - (count - 1) / 2) * 50 + rng.range(-10, 10);
    const d = rng.range(3200, 4500);
    const kind = i === count - 1 && count > 3 ? 'corvette' : 'destroyer';
    const s = makeShip(g, kind, p.x + Math.sin(a * DEG) * d, p.y + Math.cos(a * DEG) * d, wrap360(a + 180), 14);
    s.ai.state = 'hunt';
    s.ai.contact = 0.3;
    setLastKnown(g, s, 700);
  }
  return {
    short: `HUNTER GROUP CLOSING IN! SURVIVE ${Math.round(HUNT_TIME / TIME_SCALE / 60)} MINUTES`,
    orders: `A hunter-killer group knows roughly where you are. Stay alive for ${Math.round(HUNT_TIME / TIME_SCALE / 60)} minutes, or sink them all. Survival is worth a ${HUNT_BONUS.toLocaleString('en-US')} point bonus.`,
    intel: `${count} escorts closing in from bearing ${brg3(b)}, range 3 to 5 km. Go deep, go quiet, use the thermocline.`,
  };
}

function spawnAnchorage(g, n, b) {
  const rng = g.rng, p = g.player;
  const d = rng.range(8000, 9000);
  const cx = p.x + Math.sin(b * DEG) * d, cy = p.y + Math.cos(b * DEG) * d;
  g.area = { x: cx, y: cy, r: 1500 };
  const count = Math.min(4 + Math.floor(n / 3), 7);
  const ride = rng.range(150, 190);
  for (let i = 0; i < count; i++) {
    const a = rng() * TAU, r = rng.range(150, 750);
    const s = makeShip(g, i % 3 === 1 ? 'tanker' : 'freighter', cx + Math.sin(a) * r, cy + Math.cos(a) * r, wrap360(ride + rng.range(-8, 8)), 0);
    s.anchored = true;
  }
  const guards = n >= 8 ? 3 : 2;
  for (let i = 0; i < guards; i++) {
    const a = (i / guards) * TAU;
    makeShip(g, i === 2 ? 'destroyer' : 'corvette', cx + Math.sin(a) * 1500, cy + Math.cos(a) * 1500, wrap360(a / DEG + 90), 8);
  }
  // Two rings of moored mines with one swept channel.
  const channel = rng() * 360;
  for (const R of MINE.rings) {
    const k = Math.round((TAU * R) / MINE.spacing);
    for (let i = 0; i < k; i++) {
      const a = (i / k) * 360 + rng.range(-0.6, 0.6);
      if (Math.abs(angleDiff(a, channel)) * DEG * R < MINE.channel / 2) continue;
      g.mines.push({ id: g.nextId++, x: cx + Math.sin(a * DEG) * R, y: cy + Math.cos(a * DEG) * R, depth: rng.range(4, 35) });
    }
  }
  return {
    short: `ANCHORAGE BEARING ${brg3(b)}, ~${Math.round(d / 1000)} KM · MINEFIELD AHEAD`,
    orders: 'Enemy merchants lie at anchor behind a minefield. Get through, sink them, get out.',
    intel: `${count} ships at anchor, bearing ${brg3(b)}, about ${Math.round(d / 1000)} km, guarded by ${guards} escorts. Mines are moored 4 to 35 m deep about 3 km out; a swept channel crosses them somewhere. An active ping shows the mines.`,
  };
}

function stationPoint(g, s) {
  const c = g.convoy;
  if (!c) return { x: s.x + Math.sin(s.heading * DEG) * 500, y: s.y + Math.cos(s.heading * DEG) * 500 };
  const h = c.course * DEG;
  return {
    x: c.x + Math.sin(h) * s.station.lon + Math.cos(h) * s.station.lat,
    y: c.y + Math.cos(h) * s.station.lon - Math.sin(h) * s.station.lat,
  };
}

function placeOnStation(g, s) {
  const pt = stationPoint(g, s);
  s.x = pt.x;
  s.y = pt.y;
}

/* =========================================================
   PLAYER COMMANDS
   ========================================================= */
function scopeAvailable(g) {
  const p = g.player;
  return p.alive && p.periscopeRaise > 0.9 && p.depth <= PERISCOPE_MAX;
}

function viewHeading(g) {
  return wrap360(g.player.heading + g.player.scopeBearing);
}

function command(g, cmd, arg) {
  const p = g.player;
  if (!p.alive) return;
  switch (cmd) {
    case 'engineUp':
      p.telegraph = Math.min(TELEGRAPH.length - 1, p.telegraph + 1);
      break;
    case 'engineDown':
      p.telegraph = Math.max(0, p.telegraph - 1);
      break;
    case 'depthUp': {
      const shallower = DEPTH_STEPS.filter(d => d < p.orderedDepth - 0.5);
      p.orderedDepth = shallower.length ? shallower[shallower.length - 1] : 0;
      p.crashDive = false;
      if (p.orderedDepth === 0) say(g, 'SURFACE! BLOW ALL TANKS');
      break;
    }
    case 'depthDown': {
      const deeper = DEPTH_STEPS.find(d => d > p.orderedDepth + 0.5);
      p.orderedDepth = deeper !== undefined ? deeper : DEPTH_STEPS[DEPTH_STEPS.length - 1];
      break;
    }
    case 'crashDive':
      p.crashDive = true;
      p.orderedDepth = Math.max(p.orderedDepth, CRASH_DIVE_DEPTH);
      p.telegraph = Math.max(p.telegraph, TELEGRAPH_FULL);
      p.periscopeUp = false;
      p.silent = false;
      say(g, 'ALARM! CRASH DIVE!', 'red');
      emit(g, 'klaxon');
      break;
    case 'periscope':
      p.periscopeUp = !p.periscopeUp;
      emit(g, 'periscope', { up: p.periscopeUp });
      break;
    case 'zoomIn': p.zoom = 1; break;
    case 'zoomOut': p.zoom = 0; break;
    case 'scopeToBow': p.scopeBearing = 0; break;
    case 'silent':
      p.silent = !p.silent;
      say(g, p.silent ? 'SILENT RUNNING' : 'SILENT RUNNING CANCELLED', p.silent ? 'blue' : 'green');
      break;
    case 'tube':
      if (arg >= 0 && arg < 5) p.selectedTube = arg;
      break;
    case 'fire': fireTorpedo(g); break;
    case 'lock': toggleLock(g); break;
    case 'ping': activePing(g); break;
  }
}

function toggleLock(g) {
  const p = g.player;
  if (!scopeAvailable(g)) {
    say(g, 'RAISE THE PERISCOPE TO LOCK A TARGET', 'yellow');
    return;
  }
  const fov = (p.zoom ? VIEW.highFov : VIEW.lowFov) / 2;
  const vh = viewHeading(g);
  let best = null, bestAng = fov * 0.4;
  for (const s of g.ships) {
    if (s.sinking) continue;
    const d = dist2d(p.x, p.y, s.x, s.y);
    if (d > visualRange(g)) continue;
    if (s.role === 'sub' && s.depth > PERISCOPE_MAX - 2) continue;
    const ang = Math.abs(angleDiff(bearingTo(p.x, p.y, s.x, s.y), vh));
    if (ang < bestAng) { bestAng = ang; best = s; }
  }
  if (!best) {
    if (p.lock) { p.lock = null; say(g, 'TARGET RELEASED'); }
    else say(g, 'NO TARGET IN THE CROSSHAIR', 'yellow');
    return;
  }
  if (p.lock && p.lock.id === best.id) {
    p.lock = null;
    say(g, 'TARGET RELEASED');
    return;
  }
  p.lock = {
    id: best.id,
    speedErr: 1 + (g.rng() * 2 - 1) * g.diff.speedErr,
    courseErr: (g.rng() * 2 - 1) * g.diff.speedErr * 40,
    rangeErr: 1 + (g.rng() * 2 - 1) * g.diff.rangeErr,
    obs: null,
  };
  updateLock(g);
  say(g, `TARGET: ${best.name} (${best.cls})`, 'yellow');
}

// Observed target data, refreshed only while the periscope sees the target.
function updateLock(g) {
  const p = g.player, lock = p.lock;
  if (!lock) return;
  const s = g.ships.find(x => x.id === lock.id);
  if (!s || s.sinking) {
    p.lock = null;
    return;
  }
  const d = dist2d(p.x, p.y, s.x, s.y);
  const visible = s.role !== 'sub' || s.depth <= PERISCOPE_MAX - 2;
  if (scopeAvailable(g) && d < visualRange(g) && visible) {
    const brg = bearingTo(p.x, p.y, s.x, s.y);
    lock.obs = {
      t: g.time,
      bearing: brg,
      range: d * lock.rangeErr,
      speed: Math.max(0, s.speed * lock.speedErr),
      course: wrap360(s.heading + lock.courseErr),
      aob: angleDiff(brg + 180, s.heading),
    };
  }
}

// Firing solution from the (possibly stale, possibly inexact) observation.
function firingSolution(g) {
  const p = g.player, lock = p.lock;
  if (!lock || !lock.obs) return null;
  const o = lock.obs;
  const age = g.time - o.t;
  const v = o.speed * KN;
  const tx0 = p.x + Math.sin(o.bearing * DEG) * o.range; // position when observed, relative to the current boat
  const ty0 = p.y + Math.cos(o.bearing * DEG) * o.range;
  const tx = tx0 + Math.sin(o.course * DEG) * v * age;
  const ty = ty0 + Math.cos(o.course * DEG) * v * age;
  const sol = interceptCourse(p.x, p.y, tx, ty, Math.sin(o.course * DEG) * v, Math.cos(o.course * DEG) * v, TORPEDO.speedKn * KN);
  if (!sol) return null;
  sol.stale = age > 1;
  sol.range = Math.hypot(tx - p.x, ty - p.y);
  return sol;
}

function fireTorpedo(g) {
  const p = g.player;
  const n = p.selectedTube;
  const tube = p.tubes[n];
  if (tube.state !== 'ready') {
    say(g, `TUBE ${n + 1} NOT READY`, 'yellow');
    return false;
  }
  if (p.depth > TUBE_MAX_DEPTH) {
    say(g, `TOO DEEP TO FIRE (MAX ${TUBE_MAX_DEPTH} M)`, 'yellow');
    return false;
  }
  let course = viewHeading(g);
  if (g.diff.autoSolution && p.lock) {
    const sol = firingSolution(g);
    if (sol) course = sol.course;
  }
  const stern = n === 4;
  const rel = angleDiff(course, p.heading);
  if (!stern && Math.abs(rel) > 90) {
    say(g, 'OUTSIDE BOW GYRO ARC: USE STERN TUBE 5', 'yellow');
    return false;
  }
  if (stern && Math.abs(rel) < 90) {
    say(g, 'OUTSIDE STERN GYRO ARC: USE A BOW TUBE', 'yellow');
    return false;
  }
  const launch = stern ? wrap360(p.heading + 180) : p.heading;
  const off = SUB.length / 2;
  g.torpedoes.push({
    id: g.nextId++,
    owner: 'player',
    tube: n + 1,
    x: p.x + Math.sin(launch * DEG) * off,
    y: p.y + Math.cos(launch * DEG) * off,
    heading: launch,
    course,
    run: 0,
    dud: g.rng() < g.diff.dudChance,
    trail: [],
    trailRun: 0,
  });
  tube.state = 'empty';
  p.noiseSpike += 0.35;
  g.stats.fired++;
  say(g, `TUBE ${n + 1}: TORPEDO LOS! GYRO ${String(Math.round(course)).padStart(3, '0')}`);
  emit(g, 'launch', { stern });
  // Next loaded tube becomes the selected one, bow tubes first.
  if (!stern) {
    for (let i = 1; i <= 3; i++) {
      const k = (n + i) % 4;
      if (p.tubes[k].state === 'ready') { p.selectedTube = k; break; }
    }
  }
  return true;
}

function activePing(g) {
  const p = g.player;
  if (g.realTime < g.sonar.pingReady) {
    say(g, 'ACTIVE SONAR RECHARGING', 'yellow');
    return;
  }
  g.sonar.ping = { r: 0 };
  g.sonar.pingReady = g.realTime + PING_COOLDOWN;
  p.noiseSpike += 0.5;
  g.stats.pings++;
  emit(g, 'ping');
  // Every escort in range now knows roughly where the boat is.
  for (const s of g.ships) {
    if (!s.ai || s.sinking) continue;
    const d = dist2d(p.x, p.y, s.x, s.y);
    if (d > 9000) continue;
    s.ai.contact = Math.min(1.5, s.ai.contact + 0.5);
    setLastKnown(g, s, d * 0.02 + 60);
    if (s.ai.state === 'escort') s.ai.state = 'hunt';
    if (s.ai.state === 'patrol') s.ai.state = 'stalk';
  }
}

/* =========================================================
   SIMULATION
   ========================================================= */
function step(g, realDt, input) {
  input = input || {};
  realDt = Math.min(Math.max(realDt, 0), 0.1);
  g.realTime += realDt;
  updateControls(g, realDt, input);
  let remaining = realDt * TIME_SCALE;
  while (remaining > 1e-6) {
    const dt = Math.min(remaining, 0.1);
    stepSim(g, dt);
    remaining -= dt;
  }
  updateEffects(g, realDt);
  updateSonar(g, realDt);
  updateLock(g);
}

function updateControls(g, dt, input) {
  const p = g.player;
  if (!p.alive) return;
  if (input.rudderLeft && !input.rudderRight) p.rudder = Math.max(-SUB.rudderMax, p.rudder - SUB.rudderRate * dt);
  else if (input.rudderRight && !input.rudderLeft) p.rudder = Math.min(SUB.rudderMax, p.rudder + SUB.rudderRate * dt);
  else p.rudder = p.rudder > 0 ? Math.max(0, p.rudder - SUB.rudderRate * 0.7 * dt) : Math.min(0, p.rudder + SUB.rudderRate * 0.7 * dt);
  const rate = SUB.scopeRate * (p.zoom ? 0.3 : 1) * (input.scopeFast ? 3 : 1);
  if (input.scopeLeft) p.scopeBearing = angleDiff(p.scopeBearing - rate * dt, 0);
  if (input.scopeRight) p.scopeBearing = angleDiff(p.scopeBearing + rate * dt, 0);
  p.periscopeRaise = clamp(p.periscopeRaise + (p.periscopeUp ? 1.2 : -1.6) * dt, 0, 1);
}

function stepSim(g, dt) {
  g.time += dt;
  if (g.player.alive) stepPlayer(g, dt);
  stepConvoy(g, dt);
  for (const s of g.ships) stepShip(g, s, dt);
  g.ships = g.ships.filter(s => !s.removed);
  stepAir(g, dt);
  stepTorpedoes(g, dt);
  stepCharges(g, dt);
  stepShells(g, dt);
  stepMines(g, dt);
  stepPatrol(g, dt);
}

function stepPlayer(g, dt) {
  const p = g.player, st = g.stats;
  const submerged = p.depth > SURFACED_DEPTH;
  const maxKn = submerged ? SUB.maxSubmerged : SUB.maxSurface;
  let target = TELEGRAPH[p.telegraph].frac * maxKn;
  if (p.silent) target = clamp(target, -SUB.silentMax, SUB.silentMax);
  if (submerged && p.battery <= 0) target = 0;
  p.speed = approach(p.speed, target, dt, SUB.speedTau);

  const ms = p.speed * KN;
  const targetTurn = (p.rudder / SUB.rudderMax) * (ms / SUB.turnRadius) / DEG;
  p.turnRate = approach(p.turnRate, targetTurn, dt, SUB.turnTau);
  p.heading = wrap360(p.heading + p.turnRate * dt);
  p.x += Math.sin(p.heading * DEG) * ms * dt;
  p.y += Math.cos(p.heading * DEG) * ms * dt;

  // Depth: dive planes need water flow, ballast works at any speed.
  let vmax = p.crashDive ? 2.6 : 0.45 + 0.14 * Math.abs(p.speed);
  if (p.orderedDepth < p.depth) vmax = Math.max(vmax, 0.7);
  const want = clamp((p.orderedDepth - p.depth) * 0.12, -vmax, vmax);
  p.vz = approach(p.vz, want, dt, 4);
  p.depth = Math.max(0, p.depth + p.vz * dt);
  if (p.depth === 0 && p.vz < 0) p.vz = 0;
  if (p.crashDive && p.depth >= p.orderedDepth - 3) {
    p.crashDive = false;
    say(g, `LEVELLING OFF AT ${Math.round(p.orderedDepth)} M`);
  }

  // Noise heard by the escorts' hydrophones.
  let n = 0.04 + Math.pow(Math.abs(p.speed) / SUB.maxSurface, 1.4) * 0.55;
  if (!submerged) n += 0.3;
  if (p.silent) n *= 0.45;
  if (p.crashDive) n += 0.3;
  p.noiseSpike *= Math.exp(-dt / 8);
  p.noise = clamp(n + p.noiseSpike, 0, 1.5);

  // Battery and air.
  if (submerged) {
    p.battery = Math.max(0, p.battery - (0.003 + 0.0012 * p.speed * p.speed) * dt);
    p.air = Math.max(0, p.air - 0.035 * dt);
    st.timeSubmerged += dt;
  } else {
    p.battery = Math.min(100, p.battery + (p.telegraph >= 6 ? 0.04 : 0.12) * dt);
    p.air = Math.min(100, p.air + 2 * dt);
  }
  if (p.air <= 0) damagePlayer(g, 0.12 * dt, 'THE CREW SUFFOCATED');

  // Depth limits.
  st.maxDepth = Math.max(st.maxDepth, p.depth);
  if (p.depth > SAFE_DEPTH) damagePlayer(g, (p.depth - SAFE_DEPTH) * 0.004 * dt, 'CRUSHED BY THE DEEP');
  if (p.depth > 150 && g.rng() < dt * 0.04 * (p.depth - 150) / 40) emit(g, 'creak', { depth: p.depth });
  if (p.depth >= CRUSH_DEPTH && p.alive) damagePlayer(g, 1000, 'CRUSHED BY THE DEEP');

  // Torpedo reloads.
  for (const t of p.tubes) {
    if (t.state === 'loading') {
      t.t -= dt;
      if (t.t <= 0) t.state = 'ready';
    } else if (t.state === 'empty' && p.reserve > 0) {
      t.state = 'loading';
      t.t = TORPEDO.reload;
      p.reserve--;
    }
  }
}

function damagePlayer(g, amount, reason) {
  const p = g.player;
  if (!p.alive || amount <= 0) return;
  amount = Math.min(amount, p.hull);
  p.hull -= amount;
  g.stats.damageTaken += amount;
  if (p.hull <= 0) {
    p.alive = false;
    g.state = 'lost';
    g.lostReason = reason || 'U-BOOT LOST';
    g.lostAt = g.realTime;
    p.lock = null;
    say(g, 'U-BOOT LOST', 'red');
    emit(g, 'destroyed');
  }
}

function stepConvoy(g, dt) {
  const c = g.convoy;
  if (!c) return;
  c.legT -= dt;
  if (c.legT <= 0) {
    c.course = wrap360(c.baseCourse + (g.rng() < 0.35 ? 0 : (g.rng() < 0.5 ? -1 : 1) * g.rng.range(20, 40)));
    c.legT = c.alert ? g.rng.range(120, 240) : g.rng.range(300, 600);
  }
  const ms = c.speed * KN;
  c.x += Math.sin(c.course * DEG) * ms * dt;
  c.y += Math.cos(c.course * DEG) * ms * dt;
}

function steer(s, desired, targetSpeed, dt, turnRate, tau) {
  const maxTurn = turnRate * clamp(Math.abs(s.speed) / 8, 0.3, 1.2) * dt;
  s.heading = wrap360(s.heading + clamp(angleDiff(desired, s.heading), -maxTurn, maxTurn));
  s.speed = approach(s.speed, targetSpeed, dt, tau);
}

function stepShip(g, s, dt) {
  const cls = SHIP_CLASSES[s.kind];
  if (s.sinking) {
    const k = s.sinking;
    k.t += dt;
    s.speed = approach(s.speed, 0, dt, 15);
    if (k.secondary && k.t > k.secondary) {
      k.secondary = 0;
      spawnExplosion(g, s.x, s.y, 2, true);
      emit(g, 'explosion', { dist: dist2d(g.player.x, g.player.y, s.x, s.y), big: true });
    }
    if (k.t > k.dur) s.removed = true;
  } else if (s.role === 'merchant') {
    if (s.hp < s.maxHp) {
      s.speed = approach(s.speed, 2.5, dt, 30);
    } else if (!g.convoy) {
      s.speed = approach(s.speed, s.targetSpeed, dt, 40);
    } else {
      const pt = stationPoint(g, s);
      const c = g.convoy, h = c.course * DEG;
      const dx = pt.x - s.x, dy = pt.y - s.y;
      const along = dx * Math.sin(h) + dy * Math.cos(h);
      const lat = dx * Math.cos(h) - dy * Math.sin(h);
      const desired = wrap360(c.course + clamp(lat * 0.08, -30, 30));
      steer(s, desired, clamp(c.speed + along * 0.01, 2, cls.maxSpeed), dt, cls.turnRate, 40);
    }
  } else if (s.role === 'sub') {
    stepSub(g, s, dt);
  } else {
    stepEscort(g, s, dt);
  }
  const ms = s.speed * KN;
  s.x += Math.sin(s.heading * DEG) * ms * dt;
  s.y += Math.cos(s.heading * DEG) * ms * dt;
}

function setLastKnown(g, s, err) {
  const p = g.player;
  const under = p.depth > THERMOCLINE;
  const e = err * (under ? 2 : 1);
  s.ai.lastKnown = { x: p.x + g.rng.gauss() * e, y: p.y + g.rng.gauss() * e };
  s.ai.depthEst = clamp(p.depth + g.rng.gauss() * (8 + (under ? 30 : 0) + err * 0.1), 15, 250);
  s.ai.lastKnownT = g.time;
}

function escortDetect(g, s, d) {
  const p = g.player;
  if (!p.alive) return 0;
  let pr = 0;
  const vis = g.cond.vis;
  if (p.depth < SURFACED_DEPTH) {
    const R = 5000 * vis;
    if (d < R) pr += 1.5 * (1 - d / R) + 0.2;
  } else if (p.periscopeRaise > 0.5 && p.depth <= PERISCOPE_MAX) {
    const R = (900 + 120 * Math.abs(p.speed)) * vis * (g.cond.sea === 'storm' ? 0.5 : 1);
    if (d < R) pr += 0.8 * (1 - d / R);
  }
  let hr = (300 + 3200 * p.noise) * g.cond.hear;
  if (s.speed > 20) hr *= 0.35;
  if (p.depth > THERMOCLINE) hr *= 0.55;
  if (d < hr) pr += 0.6 * (1 - d / hr);
  if (p.depth >= SURFACED_DEPTH) {
    let ar = 1800;
    if (p.depth > THERMOCLINE) ar *= 0.45;
    if (s.speed > 22) ar *= 0.4;
    if (d < ar) pr += 0.9 * (1 - d / ar);
  }
  return pr * g.diff.sense;
}

function stepEscort(g, s, dt) {
  const ai = s.ai, p = g.player, cls = SHIP_CLASSES[s.kind];
  const d = dist2d(p.x, p.y, s.x, s.y);

  // Detection, once per game second.
  ai.detT -= dt;
  if (ai.detT <= 0) {
    ai.detT += 1;
    const pr = escortDetect(g, s, d);
    ai.contact = clamp(ai.contact + pr * 0.6 - 0.12, 0, 1.5);
    if (pr > 0.15) setLastKnown(g, s, 25 + d * 0.03);
    if (!ai.hasContact && ai.contact > 0.6) {
      ai.hasContact = true;
      ai.state = 'attack';
      ai.runout = 0;
      // Nearby escorts join the hunt.
      for (const o of g.ships) {
        if (o === s || !o.ai || o.sinking) continue;
        if (o.ai.state === 'escort' && dist2d(o.x, o.y, s.x, s.y) < 4000) {
          o.ai.lastKnown = Object.assign({}, ai.lastKnown);
          o.ai.lastKnownT = g.time;
          o.ai.depthEst = ai.depthEst;
          o.ai.state = 'hunt';
        }
      }
    } else if (ai.hasContact && ai.contact < 0.3) {
      ai.hasContact = false;
      if (ai.state === 'attack') ai.state = 'hunt';
    }
  }

  // ASDIC pings, heard through the hull when close.
  ai.pingT -= dt;
  if (ai.pingT <= 0) {
    ai.pingT = ai.state === 'escort' ? g.rng.range(8, 14) : g.rng.range(4, 6);
    if (p.alive && d < 4000 && p.depth > SURFACED_DEPTH) {
      emit(g, 'enemyPing', { dist: d });
      if (d < 2500) g.asdicNear = g.realTime;
    }
  }

  // Pending depth-charge pattern.
  if (ai.drops.length) {
    ai.drops[0].t -= dt;
    if (ai.drops[0].t <= 0) {
      const dr = ai.drops.shift();
      const h = s.heading * DEG;
      const back = -s.length / 2;
      g.charges.push({
        id: g.nextId++,
        x: s.x + Math.sin(h) * back + Math.cos(h) * dr.lat,
        y: s.y + Math.cos(h) * back - Math.sin(h) * dr.lat,
        depth: 0,
        target: dr.depth,
      });
      spawnGeyser(g, s.x + Math.sin(h) * back + Math.cos(h) * dr.lat, s.y + Math.cos(h) * back - Math.sin(h) * dr.lat, 6, 1.2);
      ai.charges--;
    }
  }
  ai.cooldown = Math.max(0, ai.cooldown - dt);

  // Gunfire at a surfaced U-boat in sight.
  ai.gunT -= dt;
  if (p.alive && p.depth < SURFACED_DEPTH + 1 && ai.hasContact && d < 6000 && ai.gunT <= 0) {
    ai.gunT = g.rng.range(6, 9);
    const err = 30 + d * 0.03;
    const flight = 3 + d / 800;
    g.shells.push({
      x: p.x + Math.sin(p.heading * DEG) * p.speed * KN * flight + g.rng.gauss() * err,
      y: p.y + Math.cos(p.heading * DEG) * p.speed * KN * flight + g.rng.gauss() * err,
      t: flight,
    });
    g.effects.push({ type: 'flash', x: s.x, y: s.y, h: 8, t: 0, dur: 0.35 });
    emit(g, 'gun', { dist: d });
  }

  let tx, ty, spd;
  if (ai.state === 'attack' && ai.lastKnown) {
    const lk = ai.lastKnown;
    const dl = dist2d(s.x, s.y, lk.x, lk.y);
    if (ai.runout > 0) {
      ai.runout -= s.speed * KN * dt;
      tx = s.x + Math.sin(s.heading * DEG) * 500;
      ty = s.y + Math.cos(s.heading * DEG) * 500;
      spd = cls.attackSpeed;
    } else {
      tx = lk.x; ty = lk.y;
      spd = dl < 800 ? cls.attackSpeed * 0.8 : cls.attackSpeed;
      // Roll the pattern so that it straddles the target as the ship runs over it.
      const h = s.heading * DEG;
      const along = (lk.x - s.x) * Math.sin(h) + (lk.y - s.y) * Math.cos(h);
      const lat = (lk.x - s.x) * Math.cos(h) - (lk.y - s.y) * Math.sin(h);
      if (along < 50 && along > -40 && Math.abs(lat) < 70 && ai.cooldown <= 0 && ai.charges > 0 && p.depth > 8) {
        for (let i = 0; i < CHARGE.pattern; i++) {
          const lat = i === 1 ? -45 : i === 3 ? 45 : 0;
          ai.drops.push({ t: i === 0 ? 0 : CHARGE.interval, lat, depth: clamp(ai.depthEst + g.rng.gauss() * 10, 12, 260) });
        }
        ai.cooldown = 70;
        ai.runout = 700;
        emit(g, 'chargesAway');
        if (d < 2000) say(g, 'DEPTH CHARGES IN THE WATER!', 'yellow');
      }
    }
    if (!ai.hasContact && g.time - ai.lastKnownT > 60) ai.state = 'hunt';
  } else if (ai.state === 'hunt' && ai.lastKnown) {
    const lk = ai.lastKnown;
    const dl = dist2d(s.x, s.y, lk.x, lk.y);
    // Search pattern: circle the last known position.
    if (dl < 300) {
      const a = (g.time * 0.05 + s.id) % TAU;
      tx = lk.x + Math.sin(a) * 600; ty = lk.y + Math.cos(a) * 600;
    } else { tx = lk.x; ty = lk.y; }
    spd = Math.min(cls.maxSpeed, 16);
    if (ai.hasContact) ai.state = 'attack';
    else if (g.time - ai.lastKnownT > 300) ai.state = 'escort';
  } else {
    ai.state = 'escort';
    if (g.convoy) {
      const pt = stationPoint(g, s);
      const c = g.convoy, h = c.course * DEG;
      const weave = Math.sin(g.time / 90 + ai.weave) * 350;
      tx = pt.x + Math.cos(h) * weave; ty = pt.y - Math.sin(h) * weave;
      const dl = dist2d(s.x, s.y, tx, ty);
      spd = clamp(c.speed + 3 + dl * 0.004, 4, Math.min(cls.maxSpeed, 20));
    } else if (g.area) {
      // Guard patrol: circle the area, each ship at its own phase.
      const a = g.time * 0.004 + ai.weave;
      tx = g.area.x + Math.sin(a) * g.area.r; ty = g.area.y + Math.cos(a) * g.area.r;
      spd = 10;
    } else {
      tx = s.x + Math.sin(s.heading * DEG) * 500; ty = s.y + Math.cos(s.heading * DEG) * 500;
      spd = 8;
    }
  }
  steer(s, bearingTo(s.x, s.y, tx, ty), spd, dt, cls.turnRate, 15);
}

function shipHit(s, x, y) {
  const h = s.heading * DEG;
  const dx = x - s.x, dy = y - s.y;
  const lz = dx * Math.sin(h) + dy * Math.cos(h);
  const lx = dx * Math.cos(h) - dy * Math.sin(h);
  return Math.abs(lz) < s.length / 2 && Math.abs(lx) < s.beam / 2 * (1 - Math.max(0, lz / (s.length / 2) - 0.6));
}

function stepTorpedoes(g, dt) {
  const ms = TORPEDO.speedKn * KN;
  for (const t of g.torpedoes) {
    if (t.owner === 'enemy') { stepEnemyTorpedo(g, t, dt); continue; }
    const turn = TORPEDO.turnRate * dt;
    t.heading = wrap360(t.heading + clamp(angleDiff(t.course, t.heading), -turn, turn));
    t.x += Math.sin(t.heading * DEG) * ms * dt;
    t.y += Math.cos(t.heading * DEG) * ms * dt;
    t.run += ms * dt;
    t.trailRun += ms * dt;
    if (t.trailRun > 14) {
      t.trailRun = 0;
      t.trail.push({ x: t.x, y: t.y, t: g.time });
    }
    while (t.trail.length && g.time - t.trail[0].t > 60) t.trail.shift();
    if (t.run > TORPEDO.range) {
      t.done = true;
      g.stats.misses++;
      say(g, `TORPEDO FROM TUBE ${t.tube} RAN OUT: MISSED`, 'yellow');
      continue;
    }
    for (const s of g.ships) {
      if (s.sinking && s.sinking.t > 8) continue;
      if (s.role === 'sub' && s.depth > SUB_HIT_DEPTH) continue;   // runs over a deep submarine
      if (!shipHit(s, t.x, t.y)) continue;
      t.done = true;
      const d = dist2d(g.player.x, g.player.y, t.x, t.y);
      if (t.run < TORPEDO.armDistance) {
        g.stats.duds++;
        say(g, 'TORPEDO NOT ARMED YET: IT BOUNCED OFF', 'yellow');
        emit(g, 'dud', { dist: d });
      } else if (t.dud) {
        g.stats.duds++;
        say(g, `DUD! ${s.name} WAS HIT BUT NOTHING HAPPENED`, 'yellow');
        emit(g, 'dud', { dist: d });
        alertConvoy(g);
      } else {
        g.stats.hits++;
        s.hp--;
        s.burning = true;
        spawnExplosion(g, t.x, t.y, s.kind === 'tanker' ? 1.6 : 1, s.kind === 'tanker');
        emit(g, 'explosion', { dist: d, big: s.kind === 'tanker' });
        if (s.hp <= 0) sinkShip(g, s);
        else say(g, `HIT! ${s.name} DAMAGED`, 'yellow');
        alertConvoy(g);
      }
      break;
    }
  }
  g.torpedoes = g.torpedoes.filter(t => !t.done);
}

function sinkShip(g, s) {
  if (s.sinking) return;
  const modes = ['break', 'bow', 'stern', 'roll'];
  s.sinking = {
    t: 0,
    dur: g.rng.range(55, 85),
    mode: g.rng.pick(modes),
    side: g.rng() < 0.5 ? -1 : 1,
    secondary: s.kind === 'tanker' ? 6 : 0,
  };
  g.stats.sunk[s.kind]++;
  g.stats.tonnage += s.grt;
  const unit = s.role === 'merchant' ? 'GRT' : 'TONS';
  say(g, `${s.name} IS SINKING! +${s.grt.toLocaleString('en-US')} ${unit}`, 'green');
  emit(g, 'sunk', { dist: dist2d(g.player.x, g.player.y, s.x, s.y), kind: s.kind });
  if (g.player.lock && g.player.lock.id === s.id) g.player.lock = null;
}

function alertConvoy(g) {
  const c = g.convoy, p = g.player;
  if (c && !c.alert) {
    c.alert = true;
    c.speed += 1.5;
    c.legT = Math.min(c.legT, 60);
  }
  for (const s of g.ships) {
    if (s.role !== 'escort' || s.sinking) continue;
    s.ai.contact = Math.min(1.5, s.ai.contact + 0.15);
    if (s.ai.state === 'escort' || !s.ai.lastKnown) {
      setLastKnown(g, s, 250 + dist2d(p.x, p.y, s.x, s.y) * 0.05);
      s.ai.state = 'hunt';
    }
  }
}

function stepCharges(g, dt) {
  const p = g.player;
  for (const c of g.charges) {
    c.depth += CHARGE.sinkRate * dt;
    if (c.depth < c.target) continue;
    c.done = true;
    const d = Math.hypot(c.x - p.x, c.y - p.y, c.depth - p.depth);
    const k = c.aerial ? AIR_CHARGE : CHARGE;
    let dmg = 0;
    if (p.alive && d < k.radius) dmg = k.maxDamage * (1 - d / k.radius) ** 2 * g.diff.damage;
    if (p.alive && d < 250) g.stats.chargesNear++;
    spawnGeyser(g, c.x, c.y, clamp(45 * (1 - c.depth / 90), 4, 45), 3.5);
    emit(g, 'charge', { dist: d, damage: dmg });
    if (dmg > 0.5) {
      if (dmg > 12) addCrack(g, dmg);
      say(g, `DEPTH CHARGE! HULL DAMAGE ${Math.round(dmg)}%`, 'red');
      damagePlayer(g, dmg, 'SUNK BY DEPTH CHARGES');
    }
  }
  g.charges = g.charges.filter(c => !c.done);
}

function stepShells(g, dt) {
  const p = g.player;
  for (const s of g.shells) {
    s.t -= dt;
    if (s.t > 0) continue;
    s.done = true;
    const d = dist2d(s.x, s.y, p.x, p.y);
    spawnGeyser(g, s.x, s.y, 14, 1.8);
    emit(g, 'splash', { dist: d });
    if (p.alive && d < 14 && p.depth < SURFACED_DEPTH + 1) {
      const dmg = 10 * g.diff.damage;
      addCrack(g, dmg);
      say(g, 'SHELL HIT! DIVE!', 'red');
      emit(g, 'shellHit', { damage: dmg });
      damagePlayer(g, dmg, 'SUNK BY GUNFIRE');
    }
  }
  g.shells = g.shells.filter(s => !s.done);
}

function addCrack(g, dmg) {
  const p = g.player;
  if (p.cracks.length > 6) return;
  const rng = g.rng;
  const pts = [[rng.range(-0.8, 0.8), rng.range(-0.6, 0.6)]];
  const segs = 4 + Math.floor(dmg / 6);
  let a = rng() * TAU;
  for (let i = 0; i < segs; i++) {
    a += rng.range(-0.8, 0.8);
    const last = pts[pts.length - 1];
    pts.push([last[0] + Math.cos(a) * rng.range(0.05, 0.15), last[1] + Math.sin(a) * rng.range(0.05, 0.15)]);
  }
  p.cracks.push(pts);
}

function endPatrol(g, won, text) {
  g.patrolState = 'ending';
  g.patrolTimer = 30;
  if (won) g.stats.missionsWon++;
  say(g, text, won ? 'green' : 'yellow');
  emit(g, 'patrolEnd', { won });
}

function stepPatrol(g, dt) {
  if (g.state !== 'playing') return;
  const p = g.player;
  if (g.patrolState === 'active') {
    const m = g.mission;
    const alive = role => g.ships.filter(s => s.role === role && !s.sinking);
    if (m.type === 'convoy') {
      const merchants = alive('merchant');
      if (!merchants.length) endPatrol(g, true, 'CONVOY DESTROYED! RETURNING TO PATROL LINE');
      else if (merchants.every(s => dist2d(p.x, p.y, s.x, s.y) > 15000)) endPatrol(g, false, 'THE CONVOY ESCAPED');
    } else if (m.type === 'duel') {
      const subs = alive('sub');
      if (!subs.length) endPatrol(g, true, 'ENEMY SUBMARINE SUNK! THE SECTOR IS OURS');
      else if (subs.every(s => dist2d(p.x, p.y, s.x, s.y) > 20000)) endPatrol(g, false, 'CONTACT LOST: THE SUBMARINE GOT AWAY');
    } else if (m.type === 'hunters') {
      m.timer = Math.max(0, m.timer - dt);
      if (!alive('escort').length) endPatrol(g, true, 'HUNTER GROUP DESTROYED!');
      else if (m.timer <= 0) {
        g.stats.bonus += HUNT_BONUS;
        endPatrol(g, true, `THE HUNTERS GAVE UP! +${HUNT_BONUS.toLocaleString('en-US')} BONUS`);
      }
    } else if (m.type === 'anchorage') {
      const merchants = alive('merchant');
      if (!merchants.length) endPatrol(g, true, 'ANCHORAGE DESTROYED! GET OUT THROUGH THE MINES');
      else if (dist2d(p.x, p.y, g.area.x, g.area.y) > 16000) endPatrol(g, false, 'WITHDRAWN FROM THE ANCHORAGE');
    }
  } else if (g.patrolState === 'ending') {
    g.patrolTimer -= dt;
    if (g.patrolTimer <= 0) {
      g.stats.patrolsDone++;
      p.reserve = Math.min(TORPEDO.maxReserve, p.reserve + 7);
      p.hull = Math.min(100, p.hull + 25);
      p.cracks = [];
      say(g, 'RESUPPLIED: TORPEDOES RELOADED, HULL PATCHED', 'blue');
      startPatrol(g);
    }
  }
}

function missionStatus(g) {
  if (g.patrolState === 'ending') return 'PATROL COMPLETE · STAND BY';
  const m = g.mission;
  const left = role => g.ships.filter(s => s.role === role && !s.sinking).length;
  if (m.type === 'convoy') return `SINK THE CONVOY · ${left('merchant')} MERCHANTS LEFT`;
  if (m.type === 'duel') return `SINK THE SUBMARINE · ${left('sub')} LEFT`;
  if (m.type === 'hunters') {
    const t = Math.ceil(m.timer / TIME_SCALE);
    return `SURVIVE ${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')} · ${left('escort')} HUNTERS`;
  }
  return `RAID THE ANCHORAGE · ${left('merchant')} SHIPS LEFT`;
}

/* =========================================================
   ENEMY SUBMARINES, AIRCRAFT, MINES
   ========================================================= */
function subDetect(g, s, d) {
  const p = g.player;
  if (!p.alive) return 0;
  let pr = 0;
  let hr = (600 + 6000 * p.noise) * g.cond.hear;           // submarines have good hydrophones
  if (s.depth < SURFACED_DEPTH) hr *= 0.6;                 // its own diesels
  if (d < hr) pr += 0.6 * (1 - d / hr);
  if (s.depth <= SUB_HIT_DEPTH) {
    let R = 0;
    if (p.depth < SURFACED_DEPTH) R = 4500;
    else if (p.depth <= PERISCOPE_MAX && p.periscopeRaise > 0.5) R = 900 + 120 * Math.abs(p.speed);
    R *= g.cond.vis;
    if (d < R) pr += 1.2 * (1 - d / R);
  }
  return pr * g.diff.sense;
}

function stepSub(g, s, dt) {
  const ai = s.ai, p = g.player, cls = SHIP_CLASSES[s.kind], rng = g.rng;
  const d = dist2d(p.x, p.y, s.x, s.y);
  const rate = ai.crash ? 1.6 : 0.8;
  s.depth = Math.max(0, s.depth + clamp(ai.depthOrder - s.depth, -rate * dt, rate * dt));

  ai.detT -= dt;
  if (ai.detT <= 0) {
    ai.detT += 1;
    const pr = subDetect(g, s, d);
    ai.contact = clamp(ai.contact + pr * 0.6 - 0.1, 0, 1.5);
    if (pr > 0.15) setLastKnown(g, s, 30 + d * 0.04);
    if (!ai.hasContact && ai.contact > 0.6) {
      ai.hasContact = true;
      if (ai.state === 'patrol') ai.state = 'stalk';
    } else if (ai.hasContact && ai.contact < 0.3) ai.hasContact = false;
  }

  // It may hear our torpedoes coming and go deep, after a short delay.
  if (ai.reactT > 0) {
    ai.reactT -= dt;
    if (ai.reactT <= 0) {
      ai.depthOrder = 60;
      ai.crash = true;
      ai.state = 'evade';
      ai.evadeT = 90;
    }
  } else {
    for (const t of g.torpedoes) {
      if (t.owner !== 'player' || ai.heard[t.id]) continue;
      if (dist2d(t.x, t.y, s.x, s.y) > 1200) continue;
      ai.heard[t.id] = true;
      if (rng() < 0.45) ai.reactT = 6;
    }
  }
  ai.salvoT = Math.max(0, ai.salvoT - dt);

  let tx, ty, spd;
  if (ai.state === 'evade') {
    ai.evadeT -= dt;
    const away = bearingTo(p.x, p.y, s.x, s.y) * DEG;
    tx = s.x + Math.sin(away) * 1000; ty = s.y + Math.cos(away) * 1000;
    spd = 7;
    if (ai.evadeT <= 0) {
      ai.crash = false;
      ai.depthOrder = PERISCOPE_DEPTH;
      ai.state = ai.hasContact ? 'stalk' : 'patrol';
    }
  } else if (ai.state !== 'patrol' && ai.lastKnown) {
    ai.state = 'stalk';
    ai.depthOrder = PERISCOPE_DEPTH;
    const lk = ai.lastKnown, pv = p.speed * KN;
    const dl = dist2d(s.x, s.y, lk.x, lk.y);
    const sol = interceptCourse(s.x, s.y, lk.x, lk.y, Math.sin(p.heading * DEG) * pv, Math.cos(p.heading * DEG) * pv, ENEMY_TORPEDO.speedKn * KN);
    if (dl > 2600 || !sol) {
      tx = lk.x; ty = lk.y; spd = 8;
    } else {
      tx = s.x + Math.sin(sol.course * DEG) * 1000; ty = s.y + Math.cos(sol.course * DEG) * 1000;
      spd = 4;
      if (ai.hasContact && ai.salvoT <= 0 && Math.abs(angleDiff(sol.course, s.heading)) < 20 && s.depth <= SUB_HIT_DEPTH + 5) {
        fireEnemySalvo(g, s, wrap360(sol.course + rng.gauss() * 2));
      }
    }
    if (!ai.hasContact && g.time - ai.lastKnownT > 400) ai.state = 'patrol';
  } else {
    ai.state = 'patrol';
    // In a duel it keeps getting rough fixes on us (radio direction finding) and resumes the hunt.
    if (g.mission.type === 'duel' && g.time - ai.lastKnownT > 400) {
      setLastKnown(g, s, 900);
      ai.state = 'stalk';
    }
    const night = g.cond.time === 'night';
    ai.depthOrder = night ? 0 : PERISCOPE_DEPTH;
    if (!ai.wp || dist2d(s.x, s.y, ai.wp.x, ai.wp.y) < 200) {
      const c = g.area || { x: s.x, y: s.y, r: 2000 };
      const a = rng() * TAU, r = rng() * c.r;
      ai.wp = { x: c.x + Math.sin(a) * r, y: c.y + Math.cos(a) * r };
    }
    tx = ai.wp.x; ty = ai.wp.y;
    spd = night ? 9 : 4;
  }
  const max = s.depth < SURFACED_DEPTH ? cls.maxSpeed : cls.subSpeed;
  steer(s, bearingTo(s.x, s.y, tx, ty), Math.min(spd, max), dt, cls.turnRate, 20);
}

function fireEnemySalvo(g, s, course) {
  const n = ENEMY_TORPEDO.salvo, p = g.player;
  for (let i = 0; i < n; i++) {
    const c = wrap360(course + (i - (n - 1) / 2) * ENEMY_TORPEDO.spread);
    g.torpedoes.push({
      id: g.nextId++, owner: 'enemy',
      x: s.x + Math.sin(s.heading * DEG) * s.length / 2, y: s.y + Math.cos(s.heading * DEG) * s.length / 2,
      heading: c, course: c, run: 0, trail: [], trailRun: 0, closest: 1e9,
    });
  }
  s.ai.salvoT = ENEMY_TORPEDO.reload;
  s.ai.state = 'evade';
  s.ai.evadeT = 60;
  s.ai.depthOrder = 50;
  const d = dist2d(p.x, p.y, s.x, s.y);
  if (p.alive && d < 5000) {
    say(g, `TORPEDOES IN THE WATER! BEARING ${brg3(bearingTo(p.x, p.y, s.x, s.y))}`, 'red');
    emit(g, 'enemyLaunch', { dist: d });
  }
}

function playerHit(p, x, y) {
  const h = p.heading * DEG;
  const dx = x - p.x, dy = y - p.y;
  const lz = dx * Math.sin(h) + dy * Math.cos(h);
  const lx = dx * Math.cos(h) - dy * Math.sin(h);
  return Math.abs(lz) < SUB.length / 2 && Math.abs(lx) < 4;
}

function stepEnemyTorpedo(g, t, dt) {
  const p = g.player, ms = ENEMY_TORPEDO.speedKn * KN;
  t.x += Math.sin(t.heading * DEG) * ms * dt;
  t.y += Math.cos(t.heading * DEG) * ms * dt;
  t.run += ms * dt;
  t.trailRun += ms * dt;
  if (t.trailRun > 14) {
    t.trailRun = 0;
    t.trail.push({ x: t.x, y: t.y, t: g.time });
  }
  while (t.trail.length && g.time - t.trail[0].t > 60) t.trail.shift();
  const d = dist2d(p.x, p.y, t.x, t.y);
  t.closest = Math.min(t.closest, d);
  if (p.alive && p.depth < ENEMY_TORPEDO.hitDepth && playerHit(p, t.x, t.y)) {
    t.done = true;
    const dmg = ENEMY_TORPEDO.damage * g.diff.damage;
    g.stats.torpedoHits++;
    spawnExplosion(g, t.x, t.y, 1, false);
    addCrack(g, 30);
    addCrack(g, 20);
    say(g, `TORPEDO HIT! HULL DAMAGE ${Math.round(Math.min(dmg, p.hull))}%`, 'red');
    emit(g, 'torpedoHit', { damage: dmg });
    damagePlayer(g, dmg, 'SUNK BY A TORPEDO');
    return;
  }
  if (t.run > ENEMY_TORPEDO.range) {
    t.done = true;
    if (t.closest < 800 && p.alive) {
      g.stats.torpedoesDodged++;
      say(g, 'ENEMY TORPEDO RAN OUT', 'green');
    }
  }
}

function spawnPlane(g) {
  const rng = g.rng, p = g.player;
  const kind = rng() < 0.5 ? 'sunderland' : 'hudson';
  const c = PLANE_CLASSES[kind];
  const b = rng() * 360, d = 9000;
  const x = p.x + Math.sin(b * DEG) * d, y = p.y + Math.cos(b * DEG) * d;
  g.planes.push({
    id: g.nextId++, kind, role: 'plane', cls: c.cls, name: c.cls,
    x, y, alt: 300, heading: wrap360(b + 180 + rng.range(-30, 30)), speed: c.speedKn,
    length: c.length, beam: c.length, state: 'patrol', contact: 0, detT: 0,
    charges: c.charges, reported: false, target: null, run: 0, sinking: null,
  });
}

function stepAir(g, dt) {
  const air = g.air, p = g.player, rng = g.rng;
  if (air.on && g.patrolState === 'active' && p.alive) {
    air.nextT -= dt;
    if (air.nextT <= 0) {
      spawnPlane(g);
      air.nextT = rng.range(300, 520);
    }
  }
  for (const pl of g.planes) {
    const ms = pl.speed * KN;
    const d = dist2d(p.x, p.y, pl.x, pl.y);
    if (pl.state === 'patrol') {
      pl.detT -= dt;
      if (pl.detT <= 0 && p.alive) {
        pl.detT += 1;
        let R = 0;
        if (p.depth < SURFACED_DEPTH) R = 6000;
        else if (p.depth <= PERISCOPE_MAX && p.periscopeRaise > 0.5) R = 300 + 150 * Math.abs(p.speed);
        else if (p.depth < 25 && g.cond.time === 'day' && g.cond.sea !== 'storm') R = 250;
        R *= g.cond.vis;
        if (d < R) pl.contact += 1.5 * (1 - d / R) * g.diff.sense;
        else pl.contact = Math.max(0, pl.contact - 0.1);
        if (pl.contact > 0.6) {
          pl.state = 'attack';
          const err = p.depth > SURFACED_DEPTH ? 40 : 10;
          pl.target = { x: p.x + rng.gauss() * err, y: p.y + rng.gauss() * err };
          g.stats.airAttacks++;
          emit(g, 'planeAttack', { dist: d });
        }
      }
      if (!pl.reported && p.alive && p.depth < SURFACED_DEPTH + 0.5 && d < 7000 * g.cond.vis) {
        pl.reported = true;
        say(g, `AIRCRAFT BEARING ${brg3(bearingTo(p.x, p.y, pl.x, pl.y))}! DIVE!`, 'red');
        emit(g, 'aircraft');
      }
      pl.alt = approach(pl.alt, 300, dt, 8);
    } else if (pl.state === 'attack') {
      // While the boat is in sight the pilot keeps adjusting the run; otherwise he aims at the swirl.
      if (p.alive && (p.depth < SURFACED_DEPTH || (p.depth <= PERISCOPE_MAX && p.periscopeRaise > 0.5))) {
        const lead = Math.min(d / ms, 40);
        pl.target = { x: p.x + Math.sin(p.heading * DEG) * p.speed * KN * lead, y: p.y + Math.cos(p.heading * DEG) * p.speed * KN * lead };
      }
      const tg = pl.target;
      const turn = 6 * dt;
      pl.heading = wrap360(pl.heading + clamp(angleDiff(bearingTo(pl.x, pl.y, tg.x, tg.y), pl.heading), -turn, turn));
      pl.alt = approach(pl.alt, 40, dt, 5);
      if (dist2d(pl.x, pl.y, tg.x, tg.y) < 50) {
        const k = pl.charges, h = pl.heading * DEG;
        for (let i = 0; i < k; i++) {
          const off = (i - (k - 1) / 2) * 30;
          const cx = tg.x + Math.sin(h) * off, cy = tg.y + Math.cos(h) * off;
          g.charges.push({ id: g.nextId++, x: cx, y: cy, depth: 0, target: rng.range(AIR_DC_DEPTH[0], AIR_DC_DEPTH[1]), aerial: true });
          spawnGeyser(g, cx, cy, 8, 1.2);
        }
        pl.state = 'leave';
        emit(g, 'planeDrop', { dist: d });
        if (d < 1500) say(g, 'AIRCRAFT DEPTH CHARGES!', 'yellow');
        for (const s of g.ships) {
          if (s.role !== 'escort' || s.sinking) continue;
          if (dist2d(s.x, s.y, tg.x, tg.y) > 12000) continue;
          s.ai.lastKnown = { x: tg.x, y: tg.y };
          s.ai.lastKnownT = g.time;
          if (s.ai.state === 'escort') s.ai.state = 'hunt';
        }
      }
    } else {
      pl.alt = approach(pl.alt, 300, dt, 8);
    }
    pl.x += Math.sin(pl.heading * DEG) * ms * dt;
    pl.y += Math.cos(pl.heading * DEG) * ms * dt;
    pl.run += ms * dt;
    if (pl.run > 4000 && d > 13000) pl.gone = true;
  }
  g.planes = g.planes.filter(pl => !pl.gone);
}

function stepMines(g, dt) {
  const p = g.player;
  if (!p.alive || !g.mines.length) return;
  for (const m of g.mines) {
    if (Math.abs(m.x - p.x) > MINE.radius + 40 || Math.abs(m.y - p.y) > MINE.radius + 40) continue;
    if (!playerHit(p, m.x, m.y) && dist2d(m.x, m.y, p.x, p.y) > MINE.radius) continue;
    if (Math.abs(p.depth - m.depth) > MINE.depthWindow) continue;
    m.done = true;
    const dmg = MINE.damage * g.diff.damage;
    g.stats.minesHit++;
    spawnGeyser(g, m.x, m.y, 35, 3.5);
    addCrack(g, 30);
    say(g, `MINE! HULL DAMAGE ${Math.round(Math.min(dmg, p.hull))}%`, 'red');
    emit(g, 'mine', { damage: dmg });
    damagePlayer(g, dmg, 'SUNK BY A MINE');
  }
  g.mines = g.mines.filter(m => !m.done);
}

/* =========================================================
   EFFECTS (debris, water columns, flashes) - real time
   ========================================================= */
function spawnGeyser(g, x, y, height, dur) {
  g.effects.push({ type: 'geyser', x, y, height, dur, t: 0, seed: g.rng() * 1000 });
}

function spawnExplosion(g, x, y, size, fire) {
  const rng = g.rng;
  spawnGeyser(g, x, y, 55 * size, 4);
  g.effects.push({ type: 'flash', x, y, h: 10, t: 0, dur: 0.6 * size, big: true });
  const frags = [];
  const n = Math.round(14 * size);
  for (let i = 0; i < n; i++) {
    const pts = [];
    const k = 3 + Math.floor(rng() * 3);
    const r = rng.range(2, 6) * size;
    for (let j = 0; j < k; j++) {
      const a = (j / k) * TAU + rng.range(-0.3, 0.3);
      pts.push([Math.cos(a) * r * rng.range(0.6, 1.2), Math.sin(a) * r * rng.range(0.6, 1.2)]);
    }
    const a = rng() * TAU, sp = rng.range(8, 30) * size;
    frags.push({
      x, y, h: 4,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vh: rng.range(18, 45) * size,
      rot: rng() * TAU, vrot: rng.range(-4, 4), pts,
      fire: fire && rng() < 0.5,
    });
  }
  g.effects.push({ type: 'debris', frags, t: 0, dur: 7 });
}

function updateEffects(g, dt) {
  for (const e of g.effects) {
    e.t += dt;
    if (e.type === 'debris') {
      for (const f of e.frags) {
        if (f.h < -5) continue;
        f.vh -= 9.8 * dt;
        f.x += f.vx * dt; f.y += f.vy * dt; f.h += f.vh * dt;
        f.rot += f.vrot * dt;
      }
    }
  }
  g.effects = g.effects.filter(e => e.t < e.dur);
}

/* =========================================================
   SONAR
   ========================================================= */
function sonarSources(g) {
  const out = [];
  for (const s of g.ships) {
    const cls = SHIP_CLASSES[s.kind];
    const submerged = s.role === 'sub' && s.depth > 2;
    const base = s.role === 'sub' && !submerged ? 0.6 : cls.loud;
    const loud = s.sinking ? 0.7 : base * (0.5 + s.speed / cls.maxSpeed);
    out.push({ id: s.id, x: s.x, y: s.y, type: submerged && !s.sinking ? 'sub' : 'surface', loud });
  }
  for (const t of g.torpedoes) out.push({ id: t.id, x: t.x, y: t.y, type: 'torpedo', loud: 0.5 });
  for (const c of g.charges) out.push({ id: c.id, x: c.x, y: c.y, type: 'charge', loud: 0.4 });
  for (const m of g.mines) out.push({ id: m.id, x: m.x, y: m.y, type: 'mine', loud: 0.034 }); // silent: heard only very close
  return out;
}

function updateSonar(g, dt) {
  const so = g.sonar, p = g.player;
  const prev = so.sweep;
  so.sweep = wrap360(so.sweep + SONAR_SWEEP * dt);
  const swept = wrap360(so.sweep - prev);
  const sources = sonarSources(g);
  let hearing = 12000 * g.cond.hear;
  if (Math.abs(p.speed) > 6) hearing *= 0.6;
  if (p.depth < SURFACED_DEPTH) hearing *= 0.6;
  for (const src of sources) {
    const b = bearingTo(p.x, p.y, src.x, src.y);
    if (wrap360(b - prev) > swept) continue;
    const r = dist2d(p.x, p.y, src.x, src.y);
    if (r > Math.min(src.loud * hearing, SONAR_RANGE * 1.3)) continue;
    const rErr = 1 + g.rng.gauss() * (0.04 + r / SONAR_RANGE * 0.1);
    const bErr = g.rng.gauss() * 2;
    const bb = (b + bErr) * DEG;
    so.blips = so.blips.filter(x => !(x.id === src.id && !x.active));
    so.blips.push({ id: src.id, x: p.x + Math.sin(bb) * r * rErr, y: p.y + Math.cos(bb) * r * rErr, type: src.type, t: g.realTime, active: false, fuzz: r * 0.08 });
  }
  if (so.ping) {
    const r0 = so.ping.r;
    so.ping.r += (SONAR_RANGE / 1.5) * dt;
    for (const src of sources) {
      const r = dist2d(p.x, p.y, src.x, src.y);
      if (r < r0 || r >= so.ping.r) continue;
      if (src.type === 'mine' && r > 3000) continue;
      so.blips = so.blips.filter(x => x.id !== src.id || !x.active);
      so.blips.push({ id: src.id, x: src.x, y: src.y, type: src.type, t: g.realTime, active: true, fuzz: 0 });
      if (src.type === 'surface') emit(g, 'echo', { dist: r });
    }
    if (so.ping.r > SONAR_RANGE) so.ping = null;
  }
  so.blips = so.blips.filter(b => g.realTime - b.t < (b.active ? ACTIVE_TTL : PASSIVE_TTL));

  // Warning lamps.
  const pv = { x: Math.sin(p.heading * DEG) * p.speed * KN, y: Math.cos(p.heading * DEG) * p.speed * KN };
  g.warn.torpedo = p.alive && g.torpedoes.some(t => {
    if (t.owner !== 'enemy') return false;
    const dx = p.x - t.x, dy = p.y - t.y, d = Math.hypot(dx, dy);
    const vx = Math.sin(t.heading * DEG) - pv.x / 23, vy = Math.cos(t.heading * DEG) - pv.y / 23;
    return d < 3000 && dx * vx + dy * vy > 0;
  });
  g.warn.aircraft = p.alive && p.depth <= PERISCOPE_MAX && g.planes.some(pl => dist2d(p.x, p.y, pl.x, pl.y) < 6000);
  g.warn.mines = p.alive && g.mines.some(m => Math.abs(m.x - p.x) < 600 && Math.abs(m.y - p.y) < 600);

  const was = g.detected;
  g.detected = g.player.alive && g.ships.some(s => s.ai && !s.sinking && s.ai.hasContact);
  if (g.detected && !was) {
    say(g, 'WE HAVE BEEN DETECTED!', 'red');
    emit(g, 'detected');
  }
}

/* =========================================================
   UI WIRING
   ========================================================= */
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const scene = document.createElement('canvas');
const sctx = scene.getContext('2d');
const glow = document.createElement('canvas');
const gctx = glow.getContext('2d');

const C = {
  green: '#39ff14', red: '#ff3b30', yellow: '#ffe14a', blue: '#3aa8ff',
  orange: '#ff9a2a', white: '#eaffdf',
};
const RGB = {
  green: '57,255,20', red: '255,59,48', yellow: '255,225,74', blue: '58,168,255',
  orange: '255,154,42', white: '234,255,223',
};
const rgba = (name, a) => `rgba(${RGB[name] || name},${a})`;

let W = 0, H = 0, DPR = 1, FS = 14, LW = 1.5, LAYOUT = null;
let INK = 'green';                                  // turns red in an emergency
let mode = 'title';                                 // 'title' | 'play' | 'over'
let overlay = null;                                 // null | 'help' | 'stats' | 'pause'
let titleDifficulty = 'normal';
let effectsOn = true;
let effectsChosen = false;                          // set once the player toggles G
const perf = { ema: 1 / 60, t: 0 };
let game = null;
let lastFrame = 0;
let titleTime = 0;
let scanPattern = null;
const input = { rudderLeft: false, rudderRight: false, scopeLeft: false, scopeRight: false, scopeFast: false };
const FX = { shakes: [], flash: 0, flashColor: '255,255,255', shakeX: 0, shakeY: 0, shakeRot: 0 };

/* ---------- layout ---------- */
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  for (const cv of [canvas, scene]) {
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
  }
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  glow.width = Math.max(1, Math.round(W / 4));        // bloom is computed at quarter resolution
  glow.height = Math.max(1, Math.round(H / 4));
  FS = Math.round(clamp(H / 64, 10, 17));
  LW = Math.max(1, H / 720);
  const m = Math.round(Math.max(6, H * 0.008));
  const cmdH = Math.round(clamp(H * 0.03, 16, 28));
  const rw = Math.round(clamp(W * 0.22, 240, 440));
  const bh = Math.round(clamp(H * 0.17, 120, 200));
  const view = { x: m, y: m, w: W - rw - 3 * m, h: H - bh - cmdH - 4 * m };
  const bottom = { x: m, y: view.y + view.h + m, w: view.w, h: bh };
  const right = { x: view.x + view.w + m, y: m, w: rw, h: bottom.y + bh - m };
  const cmd = { x: m, y: bottom.y + bh + m, w: W - 2 * m, h: cmdH };
  LAYOUT = { m, view, bottom, right, cmd };
  const pc = document.createElement('canvas');
  pc.width = 1; pc.height = 3;
  const pctx = pc.getContext('2d');
  if (pctx) {
    pctx.fillStyle = 'rgba(0,0,0,0.35)';
    pctx.fillRect(0, 2, 1, 1);
    scanPattern = ctx.createPattern(pc, 'repeat');
  }
}

/* ---------- drawing helpers ---------- */
function font(size, bold) {
  return `${bold ? 'bold ' : ''}${Math.round(size)}px "Courier New", monospace`;
}

function text(c, str, x, y, color, size, align, baseline) {
  c.font = font(size || FS, true);
  c.fillStyle = color || C[INK];
  c.textAlign = align || 'left';
  c.textBaseline = baseline || 'middle';
  c.fillText(str, x, y);
}

function line(c, x1, y1, x2, y2) {
  c.moveTo(x1, y1);
  c.lineTo(x2, y2);
}

function stroke(c, color, width, alpha) {
  c.globalAlpha = alpha === undefined ? 1 : alpha;
  c.strokeStyle = color;
  c.lineWidth = width || LW;
  c.stroke();
  c.globalAlpha = 1;
}

function hash3(i, j, k) {
  let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(k, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

const pad3 = v => String(Math.round(wrap360(v)) % 360).padStart(3, '0');
const fmtInt = v => Math.round(v).toLocaleString('en-US');

/* ---------- background: coastline, moon, stars ---------- */
const BG = (() => {
  const rng = makeRng(1940);
  const ranges = [];
  for (const center of [18, 92, 158, 233, 301]) {
    const width = rng.range(10, 26);
    const pts = [];
    let b = center - width / 2;
    pts.push([b, 0]);
    while (b < center + width / 2) {
      b += rng.range(1.2, 3.5);
      pts.push([b, rng.range(0.3, 2.4)]);
    }
    pts.push([b + 1.5, 0]);
    ranges.push(pts);
  }
  const stars = [];
  for (let i = 0; i < 110; i++) stars.push([rng() * 360, rng.range(1.5, 30), rng()]);
  return { ranges, stars, moon: { b: 128, e: 13, r: 1.3 } };
})();

/* ---------- 3D camera ---------- */
const P = { x: 0, y: 0, z: 0 };
function makeCamera(x, y, h, yawDeg, F, cx, cy) {
  const yaw = yawDeg * DEG;
  return { x, y, h, yawDeg, S: Math.sin(yaw), Co: Math.cos(yaw), F, cx, cy };
}

function project(cam, wx, wy, wh) {
  const dx = wx - cam.x, dy = wy - cam.y;
  const z = dx * cam.S + dy * cam.Co;
  if (z < 3) return false;
  const x = dx * cam.Co - dy * cam.S;
  P.x = cam.cx + (x / z) * cam.F;
  P.y = cam.cy - ((wh - cam.h) / z) * cam.F;
  P.z = z;
  return true;
}

function seg3(c, cam, ax, ay, ah, bx, by, bh, seaClip) {
  if (seaClip) {
    if (ah < 0 && bh < 0) return;
    if (ah < 0) {
      const t = ah / (ah - bh);
      ax += (bx - ax) * t; ay += (by - ay) * t; ah = 0;
    } else if (bh < 0) {
      const t = bh / (bh - ah);
      bx += (ax - bx) * t; by += (ay - by) * t; bh = 0;
    }
  }
  let dx = ax - cam.x, dy = ay - cam.y;
  let za = dx * cam.S + dy * cam.Co, xa = dx * cam.Co - dy * cam.S, ya = ah - cam.h;
  dx = bx - cam.x; dy = by - cam.y;
  let zb = dx * cam.S + dy * cam.Co, xb = dx * cam.Co - dy * cam.S, yb = bh - cam.h;
  const NEAR = 3;
  if (za < NEAR && zb < NEAR) return;
  if (za < NEAR) {
    const t = (NEAR - za) / (zb - za);
    xa += (xb - xa) * t; ya += (yb - ya) * t; za = NEAR;
  } else if (zb < NEAR) {
    const t = (NEAR - zb) / (za - zb);
    xb += (xa - xb) * t; yb += (ya - yb) * t; zb = NEAR;
  }
  c.moveTo(cam.cx + (xa / za) * cam.F, cam.cy - (ya / za) * cam.F);
  c.lineTo(cam.cx + (xb / zb) * cam.F, cam.cy - (yb / zb) * cam.F);
}

const TV = [0, 0, 0];
let g_sea = null;                                   // sea state of the game being drawn (ships roll more in a storm)
function drawShipModel(c, cam, s, color, alpha, width) {
  const model = MODELS[s.kind];
  const h = s.heading * DEG, sh = Math.sin(h), ch = Math.cos(h);
  const k = s.sinking;
  let sinkY = 0, pitch = 0, roll = 0, split = 0, brk = false;
  if (s.role === 'sub') sinkY = s.depth * 0.8;              // at periscope depth only the periscope shows
  else if (s.role === 'plane') { sinkY = -s.alt; roll = clamp(s.turn || 0, -0.6, 0.6); pitch = s.state === 'attack' && s.alt > 60 ? -0.15 : 0; }
  else if (g_sea && !k) roll = Math.sin(performance.now() / 1000 * 0.8 + s.id) * 0.02 * g_sea.wave;
  if (k) {
    const f = clamp(k.t / k.dur, 0, 1), e = f * f;
    if (k.mode === 'break') { brk = true; pitch = e * 0.7 + f * 0.1; sinkY += e * s.length * 0.4 + f * 4; split = f * 8; }
    else if (k.mode === 'bow') { pitch = -(e * 1.0 + f * 0.08); sinkY += e * s.length * 0.45 + f * 3; }
    else if (k.mode === 'stern') { pitch = e * 1.0 + f * 0.08; sinkY += e * s.length * 0.45 + f * 3; }
    else { roll = k.side * (e * 1.6 + f * 0.2); sinkY += e * 25 + f * 3; }
  } else if (s.hp < s.maxHp) roll = 0.07;
  const cp = Math.cos(pitch), sp = Math.sin(pitch), cr = Math.cos(roll), sr = Math.sin(roll);
  const tv = (lx, ly, lz) => {
    let x = lx, y = ly, z = lz;
    if (roll) { const nx = x * cr - y * sr; y = x * sr + y * cr; x = nx; }
    let ps = sp;
    if (brk) { if (z < 0) ps = -sp; z += z >= 0 ? split : -split; }
    if (pitch) { const ny = y * cp + z * ps; z = z * cp - y * ps; y = ny; }
    TV[0] = s.x + z * sh + x * ch;
    TV[1] = s.y + z * ch - x * sh;
    TV[2] = y - sinkY;
  };
  c.beginPath();
  for (let i = 0; i < model.length; i += 6) {
    tv(model[i], model[i + 1], model[i + 2]);
    const ax = TV[0], ay = TV[1], ah = TV[2];
    tv(model[i + 3], model[i + 4], model[i + 5]);
    seg3(c, cam, ax, ay, ah, TV[0], TV[1], TV[2], true);
  }
  stroke(c, color, width || LW * 1.3, alpha);

  if (s.role === 'sub' && !k && s.depth > 2) {             // periscope feather
    if (s.depth < PERISCOPE_MAX && s.speed > 1.5) {
      const wl = clamp(s.speed * 6, 10, 60);
      c.beginPath();
      for (const side of [-1, 1]) {
        tv(0, 0, 8.5); const ax = TV[0], ay = TV[1];
        tv(side * wl * 0.3, 0, 8.5 - wl);
        seg3(c, cam, ax, ay, 0, TV[0], TV[1], 0, false);
      }
      stroke(c, C.white, LW, alpha * 0.6);
    }
    return;
  }
  if (!k && s.speed > 1 && s.role !== 'plane') {             // bow wave and wake
    const L = s.length / 2, B = s.beam / 2, wl = clamp(s.speed * 11, 20, 320);
    c.beginPath();
    for (const side of [-1, 1]) {
      tv(0, 0, -L); const ax = TV[0], ay = TV[1];
      tv(side * (B + wl * 0.3), 0, -L - wl);
      seg3(c, cam, ax, ay, 0, TV[0], TV[1], 0, false);
      tv(0, 0, L - 2); const bx = TV[0], by = TV[1];
      tv(side * (B + 4), 0, L - 14);
      seg3(c, cam, bx, by, 0, TV[0], TV[1], 0, false);
    }
    stroke(c, color, LW, alpha * 0.4);
  }
  if (s.burning && (!k || k.t < k.dur * 0.75)) {             // fire on deck
    c.beginPath();
    for (let i = 0; i < 7; i++) {
      const lx = (Math.random() - 0.5) * s.beam * 0.8, lz = (Math.random() - 0.5) * s.length * 0.5;
      tv(lx, 6, lz); const ax = TV[0], ay = TV[1], ah = TV[2];
      tv(lx + (Math.random() - 0.5) * 3, 9 + Math.random() * 14, lz);
      seg3(c, cam, ax, ay, ah, TV[0], TV[1], TV[2], true);
    }
    stroke(c, Math.random() < 0.5 ? C.orange : C.yellow, LW * 1.2, alpha);
  }
}

/* ---------- sky: sun by day, low sun at dusk, moon and stars at night ---------- */
function dirToScreen(cam, b, e) {
  const rb = angleDiff(b, cam.yawDeg);
  if (Math.abs(rb) > 80) return null;
  return [cam.cx + Math.tan(rb * DEG) * cam.F, cam.cy - Math.tan(e * DEG) * cam.F / Math.cos(rb * DEG)];
}

function drawSky(c, cam, t, cond) {
  const starShare = cond.time === 'night' ? 1 : cond.time === 'dusk' ? 0.3 : 0;
  if (starShare && !cond.fog) {
    c.beginPath();
    const n = Math.floor(BG.stars.length * starShare);
    for (let i = 0; i < n; i++) {
      const [b, e, tw] = BG.stars[i];
      const pt = dirToScreen(cam, b, e);
      if (!pt) continue;
      const s = 0.8 + (Math.sin(t * 2 + tw * 50) > 0.6 ? 0.8 : 0);
      c.rect(pt[0], pt[1], s, s);
    }
    c.fillStyle = rgba('white', 0.7);
    c.fill();
  }
  if (cond.time === 'night') {
    const pt = dirToScreen(cam, BG.moon.b, BG.moon.e);
    if (pt) {
      const [mx, my] = pt, mr = Math.tan(BG.moon.r * DEG) * cam.F;
      c.beginPath();
      c.arc(mx, my, mr, 0, TAU);
      c.moveTo(mx + mr * 0.15, my - mr * 0.97);
      c.arc(mx - mr * 0.35, my, mr * 0.95, -1.4, 1.4, false);
      c.moveTo(mx - mr * 0.3 + mr * 0.12, my - mr * 0.35);
      c.arc(mx - mr * 0.3, my - mr * 0.35, mr * 0.12, 0, TAU);
      stroke(c, C.white, LW, cond.fog ? 0.3 : 0.85);
    }
  } else {
    const dusk = cond.time === 'dusk';
    const pt = dirToScreen(cam, dusk ? 262 : 205, dusk ? 2.2 : 16);
    if (pt) {
      const [sx, sy] = pt, sr = Math.tan(1.6 * DEG) * cam.F;
      c.beginPath();
      c.arc(sx, sy, sr, 0, TAU);
      if (!dusk) {
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * TAU + t * 0.05;
          line(c, sx + Math.cos(a) * sr * 1.4, sy + Math.sin(a) * sr * 1.4, sx + Math.cos(a) * sr * 2.1, sy + Math.sin(a) * sr * 2.1);
        }
      }
      stroke(c, dusk ? C.orange : C.yellow, LW * 1.2, cond.fog ? 0.3 : 0.8);
    }
  }
  if (cond.fog) {                                           // haze bands near the horizon
    c.beginPath();
    for (let i = 1; i <= 6; i++) {
      const y = cam.cy - i * cam.F * Math.tan(0.6 * DEG);
      const off = Math.sin(t * 0.2 + i) * 40;
      for (let x = cam.cx - cam.F; x < cam.cx + cam.F; x += 90) line(c, x + off, y, x + off + 50, y);
    }
    stroke(c, C.white, LW, 0.12);
  }
}

/* ---------- periscope ---------- */
function periscopeCamera(g, r) {
  const p = g.player, t = g.realTime;
  const amp = g.cond.wave;
  const wave = amp * (0.55 * Math.sin(t * 0.9) + 0.3 * Math.sin(t * 2.13 + 1.3) + 0.15 * Math.sin(t * 3.7));
  let eye;
  if (p.depth <= SURFACED_DEPTH) eye = 5.5 + wave * 0.4;
  else if (p.depth <= PERISCOPE_DEPTH) eye = 1.2 + (PERISCOPE_DEPTH - p.depth) * 0.35 + wave * 0.6;
  else eye = 1.2 - (p.depth - PERISCOPE_DEPTH) + wave * 0.6;
  if (p.depth > SURFACED_DEPTH) eye -= (1 - p.periscopeRaise) * 6;
  const fov = p.zoom ? VIEW.highFov : VIEW.lowFov;
  const F = (r.w / 2) / Math.tan((fov / 2) * DEG);
  const cx = r.x + r.w / 2;
  let cy = r.y + r.h / 2 + Math.sin(t * 1.1) * 0.25 * DEG * F;
  let jx = 0;
  if (p.depth > SURFACED_DEPTH && Math.abs(p.speed) > 4.5) {
    const v = (Math.abs(p.speed) - 4.5) * 0.9;
    jx = (Math.random() - 0.5) * v;
    cy += (Math.random() - 0.5) * v;
  }
  const cam = makeCamera(p.x, p.y, eye, viewHeading(g), F, cx + jx, cy);
  cam.fov = fov;
  cam.eye = eye;
  cam.roll = (p.depth <= SURFACED_DEPTH ? 1.8 : 0.7) * amp * Math.sin(t * 0.7) * DEG;
  return cam;
}

function drawSea(c, g, r, cam) {
  const t = g.realTime, p = g.player;
  const R = r.w;
  c.save();
  c.translate(cam.cx, cam.cy);
  c.rotate(cam.roll);
  c.translate(-cam.cx, -cam.cy);

  const cond = g.cond;
  g_sea = cond;
  drawSky(c, cam, t, cond);

  // coastline silhouettes on the horizon
  c.beginPath();
  for (const pts of BG.ranges) {
    for (let i = 0; i < pts.length - 1; i++) {
      const a = angleDiff(pts[i][0], cam.yawDeg), b = angleDiff(pts[i + 1][0], cam.yawDeg);
      if (Math.abs(a) > 80 || Math.abs(b) > 80 || Math.abs(a - b) > 20) continue;
      c.moveTo(cam.cx + Math.tan(a * DEG) * cam.F, cam.cy - Math.tan(pts[i][1] * DEG) * cam.F);
      c.lineTo(cam.cx + Math.tan(b * DEG) * cam.F, cam.cy - Math.tan(pts[i + 1][1] * DEG) * cam.F);
    }
  }
  stroke(c, C[INK], LW, cond.fog ? 0.12 : cond.time === 'night' ? 0.4 : 0.75);

  // horizon
  c.beginPath();
  line(c, cam.cx - R, cam.cy, cam.cx + R, cam.cy);
  stroke(c, C[INK], LW * 1.3, 0.95);

  // wave marks, world-anchored so they stream past as the boat moves
  const CELL = 70, RANGE = 1500;
  const gx0 = Math.floor((cam.x - RANGE) / CELL), gx1 = Math.floor((cam.x + RANGE) / CELL);
  const gy0 = Math.floor((cam.y - RANGE) / CELL), gy1 = Math.floor((cam.y + RANGE) / CELL);
  const tanHalf = Math.tan((cam.fov / 2 + 4) * DEG);
  const crest = 160 * DEG, cdx = Math.sin(crest), cdy = Math.cos(crest);
  const bands = [[], [], []];
  for (let gx = gx0; gx <= gx1; gx++) {
    for (let gy = gy0; gy <= gy1; gy++) {
      const h1 = hash3(gx, gy, 1), h2 = hash3(gx, gy, 2), h3 = hash3(gx, gy, 3);
      const px = (gx + h1) * CELL, py = (gy + h2) * CELL;
      const dx = px - cam.x, dy = py - cam.y;
      const z = dx * cam.S + dy * cam.Co;
      if (z < 40 || z > RANGE) continue;
      const x = dx * cam.Co - dy * cam.S;
      if (Math.abs(x) > z * tanHalf + 20) continue;
      const bob = Math.sin(t * 1.4 + h1 * 20);
      if (bob < -0.3) continue;
      const len = (5 + h3 * 10) * (0.6 + bob * 0.4) * (0.5 + cond.wave * 0.5);
      bands[z < 250 ? 0 : z < 700 ? 1 : 2].push(px - cdx * len / 2, py - cdy * len / 2, px + cdx * len / 2, py + cdy * len / 2, 0.2 * bob * cond.wave);
    }
  }
  const bandAlpha = [0.55, 0.35, 0.2];
  for (let b = 0; b < 3; b++) {
    const arr = bands[b];
    if (!arr.length) continue;
    c.beginPath();
    for (let i = 0; i < arr.length; i += 5) seg3(c, cam, arr[i], arr[i + 1], arr[i + 4], arr[i + 2], arr[i + 3], arr[i + 4], false);
    stroke(c, C[INK], LW, bandAlpha[b] * (cond.time === 'night' ? 0.6 : 1));
  }
  if (cond.sea === 'storm') {                               // wind-blown spray
    c.beginPath();
    for (let i = 0; i < 40; i++) {
