    const bands = [[], [], []];
    for (let q = 0; q < puffs.length; q += 5) {
      const a = puffs[q + 4];
      if (a < 0.02 || !project(cam, puffs[q], puffs[q + 1], puffs[q + 2])) continue;
      const rr = puffs[q + 3] * cam.F / P.z;
      if (rr < 0.8) continue;
      bands[a > 0.3 ? 0 : a > 0.12 ? 1 : 2].push(P.x, P.y, rr);
    }
    const bandA = [0.6, 0.34, 0.14];
    for (let b = 0; b < 3; b++) {
      const arr = bands[b];
      if (!arr.length) continue;
      c.beginPath();
      for (let q = 0; q < arr.length; q += 3) {
        // a lumpy vector circle
        for (let v = 0; v <= 9; v++) {
          const an = (v / 9) * TAU, rr = arr[q + 2] * (1 + 0.12 * Math.sin(an * 3 + q));
          const x = arr[q] + Math.cos(an) * rr, y = arr[q + 1] + Math.sin(an) * rr * 0.8;
          if (v === 0) c.moveTo(x, y); else c.lineTo(x, y);
        }
      }
      stroke(c, SMOKE_COLOR, LW, bandA[b] * alpha * night);
    }
  }
}

// Stylised torpedo, drawn in world space at height h (just under the surface in the periscope).
function drawTorpedoModel(c, cam, tp, hgt, color, alpha) {
  const hd = tp.heading * DEG, sh = Math.sin(hd), ch = Math.cos(hd);
  const m = TORPEDO_MODEL;
  const w = (x, y, z) => { TV[0] = tp.x + z * sh + x * ch; TV[1] = tp.y + z * ch - x * sh; TV[2] = hgt + y; };
  c.beginPath();
  for (let i = 0; i < m.length; i += 6) {
    w(m[i], m[i + 1], m[i + 2]);
    const ax = TV[0], ay = TV[1], ah = TV[2];
    w(m[i + 3], m[i + 4], m[i + 5]);
    seg3(c, cam, ax, ay, ah, TV[0], TV[1], TV[2], false);
  }
  // two contra-rotating propellers
  for (const [pz, dir] of [[-6.6, 1], [-7.1, -1]]) {
    const a0 = g_now * 25 * dir;
    for (let b = 0; b < 4; b++) {
      const a = a0 + (b / 4) * TAU;
      w(0, 0, pz);
      const ax = TV[0], ay = TV[1], ah = TV[2];
      w(Math.cos(a) * 0.95, Math.sin(a) * 0.95, pz);
      seg3(c, cam, ax, ay, ah, TV[0], TV[1], TV[2], false);
    }
  }
  stroke(c, color, LW * 1.15, alpha);
}

/* ---------- sky: sun by day, low sun at dusk, moon and stars at night ---------- */
function dirToScreen(cam, b, e) {
  const rb = angleDiff(b, cam.yawDeg);
  if (Math.abs(rb) > 80) return null;
  return [cam.cx + Math.tan(rb * DEG) * cam.F, cam.cy - Math.tan(e * DEG) * cam.F / Math.cos(rb * DEG)];
}

// The moon with its phase: a faint full disc, the lit limb and the terminator.
function drawMoonDisc(c, x, y, R, frac, waxing, alpha) {
  c.beginPath();
  c.arc(x, y, R, 0, TAU);
  stroke(c, C.white, LW, alpha * 0.25);
  if (frac < 0.02) return;                                   // new moon: only the faint disc
  const side = waxing ? 1 : -1;                               // lit on the right when waxing (northern sky)
  const tx = R * Math.abs(1 - 2 * frac);                      // half-width of the terminator ellipse
  c.beginPath();
  c.ellipse(x, y, R, R, 0, -Math.PI / 2, Math.PI / 2, side < 0);
  // terminator: bulges towards the lit limb for a crescent, away from it past half
  const toLit = frac < 0.5;
  c.ellipse(x, y, Math.max(0.5, tx), R, 0, Math.PI / 2, -Math.PI / 2, side > 0 ? toLit : !toLit);
  stroke(c, C.white, LW * 1.2, alpha);
}

function drawSky(c, cam, t, cond) {
  const starShare = cond.time === 'night' ? 1 : cond.time === 'dusk' ? 0.3 : 0;
  if (starShare && !cond.fog) {
    c.beginPath();
    const n = Math.floor(BG.stars.length * starShare);
    for (let i = 0; i < n; i++) {
      const [b, e, tw] = BG.stars[i];
      const pt = dirToScreen(cam, b, e);
      if (!pt) continue;
      const s = 0.8 + (Math.sin(t * 2 + tw * 50) > 0.6 ? 0.8 : 0);
      c.rect(pt[0], pt[1], s, s);
    }
    c.fillStyle = rgba('white', 0.7);
    c.fill();
  }
  const sky = g_sky;
  if (sky) {
    // the sun and the moon where the almanac puts them for this date, time and place
    const sun = sky.sun, moon = sky.moon;
    if (moon.alt > -1) {
      const pt = dirToScreen(cam, moon.az, moon.alt);
      if (pt) drawMoonDisc(c, pt[0], pt[1], Math.tan(0.9 * DEG) * cam.F, sky.frac, sky.waxing, (cond.fog ? 0.3 : 0.9) * (sun.alt > 0 ? 0.45 : 1));
    }
    if (sun.alt > -1.2) {
      const pt = dirToScreen(cam, sun.az, sun.alt);
      if (pt) {
        const [sx, sy] = pt, sr = Math.tan(1.1 * DEG) * cam.F, low = sun.alt < 6;
        c.beginPath();
        c.arc(sx, sy, sr, 0, TAU);
        if (!low) {
          for (let i = 0; i < 12; i++) {
            const a = (i / 12) * TAU + t * 0.05;
            line(c, sx + Math.cos(a) * sr * 1.4, sy + Math.sin(a) * sr * 1.4, sx + Math.cos(a) * sr * 2.1, sy + Math.sin(a) * sr * 2.1);
          }
        }
        stroke(c, low ? C.orange : C.yellow, LW * 1.2, cond.fog ? 0.3 : 0.85);
      }
    }
  } else if (cond.time === 'night') {
    const pt = dirToScreen(cam, BG.moon.b, BG.moon.e);
    if (pt) drawMoonDisc(c, pt[0], pt[1], Math.tan(BG.moon.r * DEG) * cam.F, 0.3, true, cond.fog ? 0.3 : 0.85);
  } else {
    const dusk = cond.time === 'dusk';
    const pt = dirToScreen(cam, dusk ? 262 : 205, dusk ? 2.2 : 16);
    if (pt) {
      const [sx, sy] = pt, sr = Math.tan(1.6 * DEG) * cam.F;
      c.beginPath();
      c.arc(sx, sy, sr, 0, TAU);
      if (!dusk) {
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * TAU + t * 0.05;
          line(c, sx + Math.cos(a) * sr * 1.4, sy + Math.sin(a) * sr * 1.4, sx + Math.cos(a) * sr * 2.1, sy + Math.sin(a) * sr * 2.1);
        }
      }
      stroke(c, dusk ? C.orange : C.yellow, LW * 1.2, cond.fog ? 0.3 : 0.8);
    }
  }
  if (cond.fog) {                                           // haze bands near the horizon
    c.beginPath();
    for (let i = 1; i <= 6; i++) {
      const y = cam.cy - i * cam.F * Math.tan(0.6 * DEG);
      const off = Math.sin(t * 0.2 + i) * 40;
      for (let x = cam.cx - cam.F; x < cam.cx + cam.F; x += 90) line(c, x + off, y, x + off + 50, y);
    }
    stroke(c, C.white, LW, 0.12);
  }
}

/* ---------- periscope ---------- */
function periscopeCamera(g, r) {
  const p = g.player, t = g.realTime;
  const amp = g.cond.wave;
  const wave = amp * (0.55 * Math.sin(t * 0.9) + 0.3 * Math.sin(t * 2.13 + 1.3) + 0.15 * Math.sin(t * 3.7));
  let eye;
  if (p.depth <= SURFACED_DEPTH) eye = 5.5 + wave * 0.4;
  else if (p.depth <= PERISCOPE_DEPTH) eye = 1.2 + (PERISCOPE_DEPTH - p.depth) * 0.35 + wave * 0.6;
  else eye = 1.2 - (p.depth - PERISCOPE_DEPTH) + wave * 0.6;
  if (p.depth > SURFACED_DEPTH) eye -= (1 - p.periscopeRaise) * 6;
  const fov = p.zoom ? VIEW.highFov : VIEW.lowFov;
  const F = (r.w / 2) / Math.tan((fov / 2) * DEG);
  const cx = r.x + r.w / 2;
  let cy = r.y + r.h / 2 + Math.sin(t * 1.1) * 0.25 * DEG * F;
  let jx = 0;
  if (p.depth > SURFACED_DEPTH && Math.abs(p.speed) > 4.5) {
    const v = (Math.abs(p.speed) - 4.5) * 0.9;
    jx = (Math.random() - 0.5) * v;
    cy += (Math.random() - 0.5) * v;
  }
  const cam = makeCamera(p.x, p.y, eye, viewHeading(g), F, cx + jx, cy);
  cam.fov = fov;
  cam.eye = eye;
  cam.roll = (p.depth <= SURFACED_DEPTH ? 1.8 : 0.7) * amp * Math.sin(t * 0.7) * DEG;
  return cam;
}

function drawSea(c, g, r, cam) {
  const t = g.realTime, p = g.player;
  const R = r.w;
  c.save();
  c.translate(cam.cx, cam.cy);
  c.rotate(cam.roll);
  c.translate(-cam.cx, -cam.cy);

  const cond = g.cond;
  g_sea = cond;
  g_now = g.realTime;
  g_sky = skyNow(g);
  drawSky(c, cam, t, cond);

  // coastline silhouettes on the horizon: a far range, the near range and its ridges
  const coast = (list, alpha) => {
    c.beginPath();
    for (const pts of list) {
      for (let i = 0; i < pts.length - 1; i++) {
        const a = angleDiff(pts[i][0], cam.yawDeg), b = angleDiff(pts[i + 1][0], cam.yawDeg);
        if (Math.abs(a) > 80 || Math.abs(b) > 80 || Math.abs(a - b) > 20) continue;
        c.moveTo(cam.cx + Math.tan(a * DEG) * cam.F, cam.cy - Math.tan(pts[i][1] * DEG) * cam.F);
        c.lineTo(cam.cx + Math.tan(b * DEG) * cam.F, cam.cy - Math.tan(pts[i + 1][1] * DEG) * cam.F);
      }
    }
    stroke(c, C[INK], LW, alpha);
  };
  const ca = cond.fog ? 0.12 : cond.time === 'night' ? 0.4 : 0.75;
  coast(BG.far, ca * 0.35);
  coast(BG.ridges, ca * 0.5);
  coast(BG.ranges, ca);

  // horizon
  c.beginPath();
  line(c, cam.cx - R, cam.cy, cam.cx + R, cam.cy);
  stroke(c, C[INK], LW * 1.3, 0.95);

  // wave marks, world-anchored so they stream past as the boat moves
  const CELL = 55, RANGE = 1500;
  const gx0 = Math.floor((cam.x - RANGE) / CELL), gx1 = Math.floor((cam.x + RANGE) / CELL);
  const gy0 = Math.floor((cam.y - RANGE) / CELL), gy1 = Math.floor((cam.y + RANGE) / CELL);
  const tanHalf = Math.tan((cam.fov / 2 + 4) * DEG);
  const crest = 160 * DEG, cdx = Math.sin(crest), cdy = Math.cos(crest);
  const bands = [[], [], []];
  for (let gx = gx0; gx <= gx1; gx++) {
    for (let gy = gy0; gy <= gy1; gy++) {
      const h1 = hash3(gx, gy, 1), h2 = hash3(gx, gy, 2), h3 = hash3(gx, gy, 3);
      const px = (gx + h1) * CELL, py = (gy + h2) * CELL;
      const dx = px - cam.x, dy = py - cam.y;
      const z = dx * cam.S + dy * cam.Co;
      if (z < 40 || z > RANGE) continue;
      const x = dx * cam.Co - dy * cam.S;
      if (Math.abs(x) > z * tanHalf + 20) continue;
      const bob = Math.sin(t * 1.4 + h1 * 20);
      if (bob < -0.3) continue;
      const len = (5 + h3 * 10) * (0.6 + bob * 0.4) * (0.5 + cond.wave * 0.5);
      bands[z < 250 ? 0 : z < 700 ? 1 : 2].push(px - cdx * len / 2, py - cdy * len / 2, px + cdx * len / 2, py + cdy * len / 2, 0.2 * bob * cond.wave);
    }
  }
  const bandAlpha = [0.55, 0.35, 0.2];
  for (let b = 0; b < 3; b++) {
    const arr = bands[b];
    if (!arr.length) continue;
    c.beginPath();
    for (let i = 0; i < arr.length; i += 5) seg3(c, cam, arr[i], arr[i + 1], arr[i + 4], arr[i + 2], arr[i + 3], arr[i + 4], false);
    stroke(c, C[INK], LW, bandAlpha[b] * (cond.time === 'night' ? 0.6 : 1));
  }
  // swell: rows of crests across the view, close together near the boat, thinning out towards the horizon
  {
    const amp = 0.25 + cond.wave * 0.55, wl = 38 + cond.wave * 14, spd = 1.1;
    const rows = [12, 16, 21, 27, 35, 45, 58, 75, 100, 130, 170, 220, 290, 380, 500, 660, 880, 1180, 1600, 2200];
    const fx = cam.S, fy = cam.Co, rx = cam.Co, ry = -cam.S;
    const step = Math.max(6, r.w / 150);
    const bandsS = [[], [], []];
    for (let ri = 0; ri < rows.length; ri++) {
      const D = rows[ri] * (1 + 0.04 * Math.sin(t * 0.3 + ri));
      // At high power the foreground rows are short, flat crest dashes: crossing undulations would flicker like a helix.
      const calmFg = cam.fov < 20 && D < 160;
      const band = D < 200 ? 0 : D < 700 ? 1 : 2;
      const near = D < 50;
      let drawing = false;
      const arr = bandsS[band];
      for (let sx = -r.w * 0.6; sx <= r.w * 0.6; sx += step) {
        const ta = sx / cam.F;
        const wx = cam.x + fx * D + rx * ta * D, wy = cam.y + fy * D + ry * ta * D;
        const ph = (wx * cdx + wy * cdy) / wl * TAU - t * spd + hash3(ri, 0, 7) * 6;
        const lat = wx * cdy - wy * cdx;
        const zk = 700 / cam.F;                               // keeps the pattern's size on screen the same at either power
        const h = amp * (D < 50 ? 0.6 : 1) * (calmFg ? 0.5 * Math.sin(ph) : Math.sin(ph) + 0.35 * Math.sin(lat / (D * 0.035 * zk) + t * 0.7 + ri));
        // only the crests are drawn, broken up by a second, slower pattern
        // broken into crests of about the same length on screen, whatever the distance and power
        const gate = D * 0.05 * zk;
        const crest = Math.sin(ph) > (calmFg ? 0.8 : near ? 0.55 : 0.35) && Math.sin(lat / gate + ri * 1.7 + t * 0.2) > (calmFg ? 0.4 : near ? 0.1 : -0.2);
        const y = cam.cy - (h - cam.h) / D * cam.F;
        if (crest) { arr.push(drawing ? 1 : 0, cam.cx + sx, y); drawing = true; }
        else drawing = false;
      }
    }
    const aS = [0.28, 0.24, 0.14];
    for (let b = 0; b < 3; b++) {
      const arr = bandsS[b];
      if (!arr.length) continue;
      c.beginPath();
      for (let i = 0; i < arr.length; i += 3) { if (arr[i]) c.lineTo(arr[i + 1], arr[i + 2]); else c.moveTo(arr[i + 1], arr[i + 2]); }
      stroke(c, C[INK], LW * (b === 0 ? 1.1 : 1), aS[b] * (cond.time === 'night' ? 0.55 : 1) * (cond.fog ? 0.6 : 1));
    }
  }
  // whitecaps when a sea is running
  if (cond.wave > 1.2) {
    c.beginPath();
    const n = cond.sea === 'storm' ? 90 : 45;
    for (let i = 0; i < n; i++) {
      const life = (t * 0.5 + hash3(i, 3, 3)) % 1;
      if (life > 0.4) continue;
      const cell = Math.floor(t * 0.5 + hash3(i, 3, 3));
      const D = 60 + hash3(i, cell, 1) ** 1.6 * 900;
      const sx = (hash3(i, cell, 2) - 0.5) * r.w * 1.1;
      const y = cam.cy - (0.6 * cond.wave - cam.h) / D * cam.F;
      const w = clamp(cam.F / D * 2.5, 2, 18) * (1 - life / 0.4);
      line(c, cam.cx + sx - w, y, cam.cx + sx, y - w * 0.35);
      line(c, cam.cx + sx, y - w * 0.35, cam.cx + sx + w, y);
    }
    stroke(c, C.white, LW, 0.4 * (cond.time === 'night' ? 0.5 : 1));
  }
  // moonlight glitter on the water under the moon
  const moonUp = g_sky ? g_sky.moon.alt > 1 && g_sky.sun.alt < -4 && g_sky.frac > 0.15 : cond.time === 'night';
  if (moonUp && !cond.fog) {
    const a = angleDiff(g_sky ? g_sky.moon.az : BG.moon.b, cam.yawDeg);
    if (Math.abs(a) < cam.fov / 2 + 5) {
      const mx = cam.cx + Math.tan(a * DEG) * cam.F;
      c.beginPath();
      for (let i = 0; i < 70; i++) {
        const k = hash3(i, Math.floor(t * 4 + hash3(i, 1, 1) * 4), 8);
        if (k > 0.55) continue;
        const d = hash3(i, 2, 8) ** 2;                       // nearer glints lower in the view
        const y = cam.cy + 2 + d * r.h * 0.45;
        const spread = (10 + d * r.w * 0.2) * (0.5 + cond.wave * 0.4);
        const x = mx + (hash3(i, 3, 8) - 0.5) * 2 * spread;
        const w = 2 + d * 10;
        line(c, x - w, y, x + w, y);
      }
      stroke(c, C.white, LW, 0.35);
    }
  }
  drawDolphins(c, g, cam);
  if (cond.sea === 'storm') {                               // wind-blown spray
    c.beginPath();
    for (let i = 0; i < 40; i++) {
      const x = cam.cx + (hash3(i, Math.floor(t * 3), 5) - 0.5) * cam.F * 1.6;
      const y = cam.cy + hash3(i, Math.floor(t * 3), 6) * cam.F * 0.3;
      line(c, x, y, x + 14, y - 3);
    }
    stroke(c, C.white, LW, 0.35);
  }

  // torpedo tracks
  for (const tp of g.torpedoes) {
    c.beginPath();
    for (const pt of tp.trail) {
      if (!project(cam, pt.x, pt.y, 0)) continue;
      const age = (g.time - pt.t) / 60;
      if (age > 1) continue;
      const s = clamp(cam.F / P.z * 1.5, 0.8, 4);
      c.rect(P.x - s / 2, P.y - s / 4, s, s / 2);
    }
    const enemy = tp.owner === 'enemy';
    c.fillStyle = enemy ? rgba('red', 0.8) : rgba('white', 0.55);
    c.fill();
    if (project(cam, tp.x, tp.y, 0)) {
      if (P.z < 1500 && cam.F / P.z * 13 > 10) {
        // close enough to make out the torpedo itself, just under the surface
        drawTorpedoModel(c, cam, tp, -0.9, enemy ? C.red : C.white, clamp(1.2 - P.z / 1500, 0.35, 0.9));
      } else {
        c.beginPath();
        c.arc(P.x, P.y, clamp(cam.F / P.z * 2, 1, 5), 0, TAU);
        c.fillStyle = enemy ? C.red : C.white;
        c.fill();
      }
    }
  }

  // ships, far to near
  const vr = visualRange(g);
  const ships = g.ships.concat(g.planes)
    .map(s => ({ s, d: dist2d(cam.x, cam.y, s.x, s.y) }))
    .filter(o => o.d < (o.s.role === 'plane' ? Math.max(vr, 3000) : vr) && Math.abs(angleDiff(bearingTo(cam.x, cam.y, o.s.x, o.s.y), cam.yawDeg)) < cam.fov / 2 + Math.atan2(o.s.length, o.d) / DEG + 3)
    .sort((a, b) => b.d - a.d);
  for (const { s, d } of ships) {
    const near = Math.min(3000, vr * 0.4);
    const alpha = d < near ? 1 : lerp(1, 0.25, (d - near) / Math.max(1, vr - near));
    const hostile = s.ai ? s.ai.hasContact && !s.sinking : s.role === 'plane' && s.state === 'attack';
    drawShipModel(c, cam, s, hostile ? C.red : C[INK], alpha);
  }

  // searchlights: escorts that have us, after dark
  if (cond.time !== 'day') {
    for (const s of g.ships) {
      if (s.role !== 'escort' || s.sinking || !s.ai.hasContact) continue;
      const d = dist2d(s.x, s.y, p.x, p.y);
      if (d > 4000) continue;
      const sweep = Math.sin(t * 0.7 + s.id) * 120;
      const b = bearingTo(s.x, s.y, p.x, p.y) * DEG;
      if (!project(cam, s.x, s.y, 10)) continue;
      const sx = P.x, sy = P.y;
      // The beam ends on the water near us; when that point is behind the periscope, end it short.
      let a1 = null, a2 = null;
      for (const f of [1, 0.85, 0.7, 0.5]) {
        const tx = s.x + (p.x + Math.cos(b) * sweep - s.x) * f, ty = s.y + (p.y - Math.sin(b) * sweep - s.y) * f;
        const w = 40 * f, lx = Math.cos(b) * w, ly = -Math.sin(b) * w;
        a1 = project(cam, tx - lx, ty - ly, 0) ? [P.x, P.y] : null;
        a2 = project(cam, tx + lx, ty + ly, 0) ? [P.x, P.y] : null;
        if (a1 && a2) break;
      }
      if (!a1 || !a2) continue;
      c.beginPath();
      c.moveTo(sx, sy); c.lineTo(a1[0], a1[1]); c.lineTo(a2[0], a2[1]); c.closePath();
      c.fillStyle = rgba('yellow', 0.08);
      c.fill();
      stroke(c, C.yellow, LW, 0.5);
    }
  }

  drawEffects(c, g, cam);
  c.restore();

  // lock bracket and lead marker (scope-fixed, not rolled)
  const lock = p.lock;
  if (lock) {
    const s = g.ships.find(x => x.id === lock.id);
    if (s && project(cam, s.x, s.y, 8)) {
      const half = Math.max(14, (s.length / 2) / P.z * cam.F * 0.8);
      const hy = Math.max(10, 14 / P.z * cam.F);
      const x0 = P.x - half, x1 = P.x + half, y0 = P.y - hy, y1 = P.y + hy, k = 8;
      c.beginPath();
      line(c, x0, y0 + k, x0, y0); line(c, x0, y0, x0 + k, y0);
      line(c, x1 - k, y0, x1, y0); line(c, x1, y0, x1, y0 + k);
      line(c, x0, y1 - k, x0, y1); line(c, x0, y1, x0 + k, y1);
      line(c, x1 - k, y1, x1, y1); line(c, x1, y1, x1, y1 - k);
      stroke(c, C.yellow, LW * 1.5);
      text(c, s.name.toUpperCase(), P.x, y0 - FS * 0.8, C.yellow, FS * 0.85, 'center');
    }
    const sol = firingSolution(g);
    if (sol && g.diff.leadMarker) {
      const rb = angleDiff(sol.course, cam.yawDeg);
      if (Math.abs(rb) < cam.fov / 2) {
        const x = cam.cx + Math.tan(rb * DEG) * cam.F, y = cam.cy, k = FS * 0.6;
        c.beginPath();
        c.moveTo(x, y - k); c.lineTo(x + k, y); c.lineTo(x, y + k); c.lineTo(x - k, y); c.closePath();
        line(c, x, y + k, x, y + k * 3);
        stroke(c, C.yellow, LW * 1.6);
        text(c, 'LEAD', x, y + k * 4, C.yellow, FS * 0.8, 'center');
      }
    }
  }

  // periscope dipping under a wave
  if (cam.eye < 0.35) {
    const a = clamp((0.35 - cam.eye) / 0.8, 0, 1);
    c.fillStyle = `rgba(0,25,55,${0.75 * a})`;
    c.fillRect(r.x, r.y, r.w, r.h);
    c.beginPath();
    for (let i = 0; i < 9; i++) {
      const y = r.y + r.h * (1 - a) + i * r.h * 0.11;
      for (let x = r.x; x < r.x + r.w; x += 30) {
        const yy = y + Math.sin(x * 0.02 + t * 6 + i) * 8;
        if (x === r.x) c.moveTo(x, yy); else c.lineTo(x, yy);
      }
    }
    stroke(c, C.blue, LW, 0.6 * a);
  }
}

function drawEffects(c, g, cam) {
  for (const e of g.effects) {
    const f = e.t / e.dur;
    if (e.type === 'geyser') {
      const rise = f < 0.25 ? f / 0.25 : 1 - (f - 0.25) / 0.75 * 0.85;
      const hgt = e.height * rise;
      const rad = 2 + e.height * 0.18 * (0.5 + f);
      c.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * TAU + e.seed;
        const bx = e.x + Math.cos(a) * rad * 0.5, by = e.y + Math.sin(a) * rad * 0.5;
        const top = hgt * (0.65 + 0.35 * Math.sin(e.seed * 3 + i * 1.7));
        seg3(c, cam, bx, by, 0, e.x + Math.cos(a) * rad, e.y + Math.sin(a) * rad, top, true);
      }
      stroke(c, C.white, LW, 0.9 * (1 - f * 0.6));
    } else if (e.type === 'flash') {
      if (!project(cam, e.x, e.y, e.h)) continue;
      const k = (e.big ? 60 : 25) / P.z * cam.F * (0.4 + f);
      const s = clamp(k, 4, 260);
      c.beginPath();
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * TAU + f;
        const r0 = s * 0.2, r1 = s * (0.6 + 0.4 * ((i * 7) % 3) / 2);
        line(c, P.x + Math.cos(a) * r0, P.y + Math.sin(a) * r0, P.x + Math.cos(a) * r1, P.y + Math.sin(a) * r1);
      }
      stroke(c, f < 0.4 ? C.white : C.orange, LW * 1.6, 1 - f);
    } else if (e.type === 'debris') {
      for (const fr of e.frags) {
        if (fr.h < 0) continue;
        if (!project(cam, fr.x, fr.y, fr.h)) continue;
        const sc = cam.F / P.z;
        const cs = Math.cos(fr.rot), sn = Math.sin(fr.rot);
        c.beginPath();
        fr.pts.forEach((pt, i) => {
          const x = P.x + (pt[0] * cs - pt[1] * sn) * sc, y = P.y + (pt[0] * sn + pt[1] * cs) * sc;
          if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
        });
        c.closePath();
        stroke(c, fr.fire ? C.orange : C[INK], LW * 1.2, 1 - f * 0.7);
      }
    }
  }
}

/* ---------- sea life: schools of fish below, dolphins above ---------- */
// Schools live on a world grid; each swims round its own circle at its own depth.
function drawFish(c, g, cam2) {
  const p = g.player, t = g.realTime;
  const CELL = 450;
  const gx0 = Math.floor((p.x - 500) / CELL), gx1 = Math.floor((p.x + 500) / CELL);
  const gy0 = Math.floor((p.y - 500) / CELL), gy1 = Math.floor((p.y + 500) / CELL);
  const near = [], far = [];
  for (let gx = gx0; gx <= gx1; gx++) for (let gy = gy0; gy <= gy1; gy++) {
    if (hash3(gx, gy, 41) > 0.6) continue;
    const depth = 8 + hash3(gx, gy, 42) * 130;
    if (Math.abs(depth - p.depth) > 70) continue;
    const R = 50 + hash3(gx, gy, 43) * 90;
    const dirn = hash3(gx, gy, 44) < 0.5 ? -1 : 1;
    const w = dirn * (0.035 + hash3(gx, gy, 45) * 0.04);
    const ang = t * w + hash3(gx, gy, 46) * TAU;
    const cx = (gx + 0.5) * CELL + Math.cos(ang) * R, cy = (gy + 0.5) * CELL + Math.sin(ang) * R;
    if (dist2d(cx, cy, p.x, p.y) > 320) continue;
    // swimming direction: along the circle
    const hx = -Math.sin(ang) * dirn, hy = Math.cos(ang) * dirn;
    const n = 12 + Math.floor(hash3(gx, gy, 47) * 26);
    const size = 0.5 + hash3(gx, gy, 48) * 0.8;
    for (let i = 0; i < n; i++) {
      const al = (hash3(gx * 7 + i, gy, 51) - 0.5) * 20, ac = (hash3(gx, gy * 7 + i, 52) - 0.5) * 14;
      let fx = cx + hx * al + hy * ac + Math.sin(t * 0.9 + i) * 0.8;
      let fy = cy + hy * al - hx * ac + Math.cos(t * 0.7 + i * 1.3) * 0.8;
      let fh = -depth + (hash3(gx, i, 53) - 0.5) * 7 + Math.sin(t * 0.6 + i * 2.1) * 0.6;
      let dx = hx, dy = hy;
      // the boat frightens them: they dart away from the hull
      const bd = Math.hypot(fx - p.x, fy - p.y, fh + p.depth);
      if (bd < 45) {
        const k = (45 - bd) / 45 * 14;
        const ux = (fx - p.x) / (bd || 1), uy = (fy - p.y) / (bd || 1);
        fx += ux * k; fy += uy * k; fh += ((fh + p.depth) / (bd || 1)) * k;
        dx = lerp(hx, ux, 0.7); dy = lerp(hy, uy, 0.7);
        const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
      }
      const L = size * 0.6;
      if (!project(cam2, fx + dx * L, fy + dy * L, fh)) continue;
      const ax = P.x, ay = P.y, z = P.z;
      if (!project(cam2, fx - dx * L, fy - dy * L, fh)) continue;
      (z < 90 ? near : far).push(ax, ay, P.x, P.y, z, t * 9 + i);
    }
  }
  for (const [arr, alpha] of [[far, 0.4], [near, 0.85]]) {
    if (!arr.length) continue;
    c.beginPath();
    for (let i = 0; i < arr.length; i += 6) {
      const hx = arr[i], hy = arr[i + 1], tx = arr[i + 2], ty = arr[i + 3];
      let vx = tx - hx, vy = ty - hy;
      const len = Math.hypot(vx, vy);
      if (len < 2.5) { c.rect(hx, hy, 1.5, 1.5); continue; }
      vx /= len; vy /= len;
      const nx = -vy, ny = vx, wdt = len * 0.22, wag = Math.sin(arr[i + 5]) * len * 0.12;
      // spindle body
      c.moveTo(hx, hy);
      c.lineTo(hx + vx * len * 0.45 + nx * wdt, hy + vy * len * 0.45 + ny * wdt);
      c.lineTo(tx, ty);
      c.lineTo(hx + vx * len * 0.45 - nx * wdt, hy + vy * len * 0.45 - ny * wdt);
      c.closePath();
      // tail
      const ex = tx + vx * len * 0.35 + nx * wag, ey = ty + vy * len * 0.35 + ny * wag;
      c.moveTo(tx, ty); c.lineTo(ex + nx * wdt * 1.1, ey + ny * wdt * 1.1);
      c.moveTo(tx, ty); c.lineTo(ex - nx * wdt * 1.1, ey - ny * wdt * 1.1);
    }
    stroke(c, C.blue, LW, alpha);
  }
}

// Pods of dolphins leaping near the boat, by day in a calm or moderate sea.
function drawDolphins(c, g, cam) {
  const cond = g.cond, t = g.realTime;
  if (cond.time === 'night' || cond.sea === 'storm' || cond.fog) return;
  const CELL = 1400;
  const gx0 = Math.floor((cam.x - 1200) / CELL), gx1 = Math.floor((cam.x + 1200) / CELL);
  const gy0 = Math.floor((cam.y - 1200) / CELL), gy1 = Math.floor((cam.y + 1200) / CELL);
  const segs = [], splash = [];
  const S = (x, y, h) => segs.push(x, y, h);
  for (let gx = gx0; gx <= gx1; gx++) for (let gy = gy0; gy <= gy1; gy++) {
    if (hash3(gx, gy, 61) > 0.35) continue;
    const hd = hash3(gx, gy, 62) * TAU, hx = Math.sin(hd), hy = Math.cos(hd);
    const run = ((t * 6 + hash3(gx, gy, 63) * 1400) % 1400) - 700;     // the pod swims across its cell
    const px = (gx + 0.5) * CELL + hx * run, py = (gy + 0.5) * CELL + hy * run;
    const d = dist2d(px, py, cam.x, cam.y);
    if (d > 1100 || d < 40) continue;
    const n = 4 + Math.floor(hash3(gx, gy, 64) * 6);
    for (let i = 0; i < n; i++) {
      const ox = (hash3(gx, gy * 3 + i, 65) - 0.5) * 30, oa = (hash3(gx * 3 + i, gy, 66) - 0.5) * 24;
      const bx = px + hx * oa + hy * ox, by = py + hy * oa - hx * ox;
      const ph = (t / 2.6 + hash3(gx + i, gy, 67)) % 1;
      const arc = s => [bx + hx * (s - 0.5) * 7, by + hy * (s - 0.5) * 7, Math.sin(s * Math.PI) * 2.3 - 0.3];
      if (ph < 0.34) {
        const s = ph / 0.34;
        const nose = arc(Math.min(1, s + 0.09)), mid = arc(s), tail = arc(Math.max(0, s - 0.09));
        const up = 0.35;
        S(...nose); S(mid[0], mid[1], mid[2] + up);
        S(mid[0], mid[1], mid[2] + up); S(...tail);
        S(...nose); S(mid[0], mid[1], mid[2] - up * 0.6);
        S(mid[0], mid[1], mid[2] - up * 0.6); S(...tail);
        S(mid[0], mid[1], mid[2] + up); S(mid[0] - hx * 0.4, mid[1] - hy * 0.4, mid[2] + up + 0.5);   // dorsal fin
        S(tail[0], tail[1], tail[2]); S(tail[0] - hx * 0.5 + hy * 0.5, tail[1] - hy * 0.5 - hx * 0.5, tail[2] + 0.2);   // flukes
        S(tail[0], tail[1], tail[2]); S(tail[0] - hx * 0.5 - hy * 0.5, tail[1] - hy * 0.5 + hx * 0.5, tail[2] + 0.2);
      } else if (ph < 0.42) {
        splash.push(...arc(1), (ph - 0.34) / 0.08);
      } else if (ph > 0.6 && ph < 0.72) {
        // breathing: just the fin cutting the water
        const s = (ph - 0.6) / 0.12, fx = bx + hx * (s - 0.5) * 5, fy = by + hy * (s - 0.5) * 5;
        S(fx, fy, 0); S(fx - hx * 0.3, fy - hy * 0.3, 0.55);
        S(fx - hx * 0.3, fy - hy * 0.3, 0.55); S(fx - hx * 0.8, fy - hy * 0.8, 0);
      }
    }
  }
  if (segs.length) {
    c.beginPath();
    for (let i = 0; i < segs.length; i += 6) seg3(c, cam, segs[i], segs[i + 1], segs[i + 2], segs[i + 3], segs[i + 4], segs[i + 5], true);
    stroke(c, C[INK], LW * 1.1, 0.85);
  }
  for (let i = 0; i < splash.length; i += 4) {
    if (!project(cam, splash[i], splash[i + 1], 0)) continue;
    const k = splash[i + 3], rr = cam.F / P.z * (0.6 + k * 1.6);
    c.beginPath();
    c.ellipse(P.x, P.y, rr, rr * 0.25, 0, 0, TAU);
    for (let j = 0; j < 5; j++) { const a = Math.PI + (j / 4) * Math.PI; line(c, P.x + Math.cos(a) * rr * 0.4, P.y, P.x + Math.cos(a) * rr * 0.6, P.y - Math.abs(Math.sin(a)) * rr * (1 - k)); }
    stroke(c, C.white, LW, 0.6 * (1 - k));
  }
}

function drawUnderwater(c, g, r, cam) {
  const p = g.player, t = g.realTime;
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  c.fillStyle = 'rgba(0,18,40,0.55)';
  c.fillRect(r.x, r.y, r.w, r.h);
  // the surface overhead: its ripples are fixed to the compass, so they turn with the view
  const brgAt = x => cam.yawDeg + Math.atan((x - cx) / cam.F) / DEG;
  if (p.depth < 60) {
    const k = 1 - (p.depth - 10) / 50;
    const ys = r.y + r.h * 0.42 * k;
    c.beginPath();
    for (let x = r.x; x <= r.x + r.w; x += 12) {
      const b = brgAt(x) * DEG;
      const y = ys + Math.sin(b * 14 + t * 1.5) * 6 + Math.sin(b * 37 - t) * 3;
      if (x === r.x) c.moveTo(x, y); else c.lineTo(x, y);
    }
    stroke(c, C.blue, LW * 1.4, 0.8 * k);
    const cond = g.cond;
    const sky = skyNow(g);
    if (sky ? sky.sun.alt > -2 : cond.time !== 'night') {
      // caustics: the shimmering net of light just under the waves
      c.beginPath();
      for (let i = 0; i < 70; i++) {
        const b0 = Math.floor(cam.yawDeg) - 40 + hash3(i, 1, 21) * 80;
        const a = angleDiff(b0, cam.yawDeg);
        const x = cx + Math.tan(a * DEG) * cam.F, y = ys + 8 + hash3(i, 2, 21) * r.h * 0.12;
        const w = 10 + hash3(i, 3, 21) * 26, ph = t * 1.7 + i;
        line(c, x - w / 2, y + Math.sin(ph) * 3, x, y + Math.sin(ph + 1.5) * 3);
        line(c, x, y + Math.sin(ph + 1.5) * 3, x + w / 2, y + Math.sin(ph + 3) * 3);
      }
      stroke(c, C.blue, LW, 0.22 * k * (cond.time === 'dusk' ? 0.5 : 1));
      // shafts of sunlight: fixed bearings, leaning away from the sun, fading with depth
      const sunAz = sky ? sky.sun.az : cond.time === 'dusk' ? 262 : 205;
      const lean = Math.sin(angleDiff(sunAz, cam.yawDeg) * DEG) * -0.45;
      const len = r.h * (0.35 + 0.35 * k);
      for (let i = 0; i < 36; i++) {
        const b = i * 10 + hash3(i, 4, 21) * 6;
        const a = angleDiff(b, cam.yawDeg);
        if (Math.abs(a) > cam.fov / 2 + 8) continue;
        const x = cx + Math.tan(a * DEG) * cam.F;
        const flick = 0.55 + 0.45 * Math.sin(t * (0.4 + hash3(i, 5, 21) * 0.5) + i);
        const wdt = (4 + hash3(i, 6, 21) * 10) * (cam.F / 700);
        for (let sgm = 0; sgm < 4; sgm++) {
          const f0 = sgm / 4, f1 = (sgm + 1) / 4;
          c.beginPath();
          c.moveTo(x - wdt / 2 + lean * len * f0, ys + len * f0);
          c.lineTo(x - wdt / 2 + lean * len * f1 - wdt * 0.3 * f1, ys + len * f1);
          c.moveTo(x + wdt / 2 + lean * len * f0, ys + len * f0);
          c.lineTo(x + wdt / 2 + lean * len * f1 + wdt * 0.3 * f1, ys + len * f1);
          stroke(c, C.blue, LW, 0.16 * k * flick * (1 - f0) * (cond.time === 'dusk' ? 0.5 : 1) * (cond.fog ? 0.5 : 1));
        }
      }
    }
  }
  // thermocline layer
  if (Math.abs(p.depth - THERMOCLINE) < 45) {
    const y = cy + (THERMOCLINE - p.depth) * (r.h / 90);
    c.beginPath();
    for (let x = r.x; x <= r.x + r.w; x += 20) {
      const yy = y + Math.sin(x * 0.01 + t * 0.5) * 5;
      if (x === r.x) c.moveTo(x, yy); else c.lineTo(x, yy);
    }
    c.setLineDash([10, 8]);
    stroke(c, C.blue, LW * 1.2, 0.8);
    c.setLineDash([]);
    text(c, 'THERMOCLINE', cx + r.w * 0.25, y - FS, C.blue, FS * 0.85, 'center');
  }
  // marine snow, world-anchored
  const cam2 = makeCamera(p.x, p.y, -p.depth, cam.yawDeg, cam.F, cx, cy);
  c.beginPath();
  for (let i = 0; i < 180; i++) {
    const box = 120;
    const px = p.x + ((((hash3(i, 1, 9) * box - p.x) % box) + box) % box) - box / 2;
    const py = p.y + ((((hash3(i, 2, 9) * box - p.y) % box) + box) % box) - box / 2;
    const ph = -p.depth + ((((hash3(i, 3, 9) * 60 + p.depth + t * 0.3) % 60) + 60) % 60) - 30;
    if (!project(cam2, px, py, ph)) continue;
    const s = clamp(cam.F / P.z * 0.25, 0.6, 3);
    c.rect(P.x, P.y, s, s);
  }
  c.fillStyle = rgba('green', 0.5);
  c.fill();
  drawFish(c, g, cam2);
  // moored mines: a sphere with horns on a cable
  for (const m of g.mines) {
    if (Math.abs(m.x - p.x) > 300 || Math.abs(m.y - p.y) > 300) continue;
    if (!project(cam2, m.x, m.y, -m.depth)) continue;
    const s = clamp(cam.F / P.z * 1.2, 2, 40);
    c.beginPath();
    c.arc(P.x, P.y, s, 0, TAU);
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU;
      line(c, P.x + Math.cos(a) * s, P.y + Math.sin(a) * s, P.x + Math.cos(a) * s * 1.45, P.y + Math.sin(a) * s * 1.45);
    }
    const mx = P.x, my = P.y;
    if (project(cam2, m.x, m.y, -m.depth - 60)) line(c, mx, my + s, P.x, P.y);
    stroke(c, C.orange, LW * 1.3, clamp(1.3 - P.z / 300, 0.2, 1));
  }
  // torpedoes running shallow overhead: ours in white, the enemy's in red
  for (const tp of g.torpedoes) {
    if (!project(cam2, tp.x, tp.y, -4)) continue;
    if (P.z > 600) continue;
    drawTorpedoModel(c, cam2, tp, -4, tp.owner === 'enemy' ? C.red : C.white, clamp(1.3 - P.z / 600, 0.3, 1));
  }
  // depth charges sinking nearby: a very bad sign
  for (const ch of g.charges) {
    if (!project(cam2, ch.x, ch.y, -ch.depth)) continue;
    if (P.z > 400) continue;
    const s = clamp(cam.F / P.z * 0.8, 3, 30);
    c.beginPath();
    c.rect(P.x - s / 2, P.y - s * 0.7, s, s * 1.4);
    line(c, P.x - s / 2, P.y - s * 0.3, P.x + s / 2, P.y - s * 0.3);
    line(c, P.x - s / 2, P.y + s * 0.3, P.x + s / 2, P.y + s * 0.3);
    stroke(c, C.yellow, LW * 1.4);
  }
  const why = !p.alive ? 'NO SIGNAL' : p.depth > PERISCOPE_MAX ? 'TOO DEEP FOR THE PERISCOPE' : 'PERISCOPE DOWN';
  text(c, why, cx, cy - FS * 1.2, rgba(INK, 0.55), FS * 1.8, 'center');
  if (p.alive) text(c, `DEPTH ${Math.round(p.depth)} M  ·  USE THE SONAR`, cx, cy + FS * 1.2, rgba(INK, 0.45), FS, 'center');
}

function drawReticle(c, g, r, cam) {
  const cx = r.x + r.w / 2, cy = cam.cy;
  const gap = FS * 1.2;
  const p = g.player;
  c.beginPath();
  line(c, r.x, cy, cx - gap, cy);
  line(c, cx + gap, cy, r.x + r.w, cy);
  line(c, cx, r.y + FS * 4.2, cx, cy - gap);
  line(c, cx, cy + gap, cx, r.y + r.h);
  const stepDeg = p.zoom ? 1 : 5;
  const half = cam.fov / 2;
  for (let d = stepDeg; d < half; d += stepDeg) {
    const dx = Math.tan(d * DEG) * cam.F;
    const big = p.zoom ? d % 5 === 0 : d % 10 === 0;
    const k = big ? FS * 0.9 : FS * 0.45;
    line(c, cx + dx, cy - k, cx + dx, cy);
    line(c, cx - dx, cy - k, cx - dx, cy);
  }
  // stadimeter ticks on the vertical line
  const sd = p.zoom ? 0.5 : 2;
  for (let i = 1; i <= 4; i++) {
    const dy = Math.tan(i * sd * DEG) * cam.F;
    line(c, cx - FS * 0.4, cy + dy, cx + FS * 0.4, cy + dy);
  }
  c.moveTo(cx + 3, cy);
  c.arc(cx, cy, 3, 0, TAU);
  stroke(c, C[INK], LW, 0.75);

  // compass tape
  const ty = r.y + FS * 2.4;
  c.beginPath();
  const tapeHalf = Math.min(r.w * 0.36, Math.tan(half * DEG) * cam.F);
  line(c, cx - tapeHalf, ty, cx + tapeHalf, ty);
  const tick = p.zoom ? 1 : 5, labelEvery = p.zoom ? 5 : 15;
  const start = Math.ceil((cam.yawDeg - half) / tick) * tick;
  for (let b = start; b <= cam.yawDeg + half; b += tick) {
    const x = cx + Math.tan(angleDiff(b, cam.yawDeg) * DEG) * cam.F;
    if (Math.abs(x - cx) > tapeHalf) continue;
    const major = wrap360(b) % labelEvery === 0;
    line(c, x, ty, x, ty - (major ? FS * 0.7 : FS * 0.35));
    if (major) text(c, pad3(b), x, ty - FS * 1.3, rgba(INK, 0.9), FS * 0.8, 'center');
  }
  c.moveTo(cx, ty + 2); c.lineTo(cx - 6, ty + 10); c.lineTo(cx + 6, ty + 10); c.closePath();
  stroke(c, C[INK], LW, 0.9);
  text(c, `TRUE ${pad3(cam.yawDeg)}°   REL ${p.scopeBearing >= 0 ? '+' : '-'}${String(Math.round(Math.abs(p.scopeBearing))).padStart(3, '0')}°   ${p.zoom ? 'HIGH POWER 6×' : 'LOW POWER 1.5×'}`,
    cx, ty + FS * 1.6, rgba(INK, 0.85), FS * 0.85, 'center');
}

function drawPeriscope(c, g, r) {
  const p = g.player;
  if (chartOn) {
    drawChart(c, g, r);
    c.save();
    c.beginPath(); c.rect(r.x, r.y, r.w, r.h); c.clip();
    drawMessages(c, g, r);
    drawAiCaption(c, g, r);
    c.restore();
    return;
  }
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  const R = Math.max(r.w, r.h) / 2;
  const cam = periscopeCamera(g, r);
  c.save();
  c.beginPath(); c.rect(r.x, r.y, r.w, r.h); c.clip();
  c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.clip();
  const seeing = scopeAvailable(g) && cam.eye > -0.6;
  if (seeing) drawSea(c, g, r, cam);
  else drawUnderwater(c, g, r, cam);
  if (!p.alive) {                                   // dead periscope: static
    c.beginPath();
    for (let i = 0; i < 60; i++) {
      const y = r.y + Math.random() * r.h;
      line(c, r.x, y, r.x + r.w, y + (Math.random() - 0.5) * 6);
    }
    stroke(c, C.red, LW, 0.25);
  }
  // cracks in the glass
  if (p.cracks.length) {
    c.beginPath();
    for (const crack of p.cracks) {
      crack.forEach((pt, i) => {
        const x = cx + pt[0] * r.w / 2, y = cy + pt[1] * r.h / 2;
        if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
      });
    }
    stroke(c, C.white, LW * 1.2, 0.6);
  }
  if (seeing) drawReticle(c, g, r, cam);
  drawMessages(c, g, r);
  drawAiCaption(c, g, r);
  c.restore();

  // periscope frame
  c.save();
  c.beginPath(); c.rect(r.x - 2, r.y - 2, r.w + 4, r.h + 4); c.clip();
  c.beginPath(); c.arc(cx, cy, R, 0, TAU);
  stroke(c, C[INK], LW * 2.5, 0.9);
  c.restore();
  c.save();
  c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.clip();
  c.beginPath();
  line(c, r.x, r.y, r.x + r.w, r.y);
  line(c, r.x, r.y + r.h, r.x + r.w, r.y + r.h);
  stroke(c, C[INK], LW * 2.5, 0.9);
  c.restore();
}

function drawMessages(c, g, r) {
  const cx = r.x + r.w / 2;
  const msgs = g.messages.filter(m => g.realTime - m.t < 6).slice(-4);
  let y = r.y + r.h - FS * 1.6;
  for (let i = msgs.length - 1; i >= 0; i--) {
    const m = msgs[i];
    const age = g.realTime - m.t;
    const a = age > 5 ? 6 - age : 1;
    text(c, m.text, cx, y, rgba(m.color === 'green' ? INK : m.color, a), FS * 1.05, 'center');
    y -= FS * 1.5;
  }
  if (g.patrolState === 'ending' && g.state === 'playing') {
    text(c, `PATROL ${g.patrol} COMPLETE · NEXT CONVOY SOON`, cx, r.y + r.h * 0.3, rgba('yellow', 0.6 + 0.4 * Math.sin(g.realTime * 4)), FS * 1.4, 'center');
  }
}

/* ---------- navigation chart (L) ---------- */
const CHART_SCALES = [2000, 4000, 8000, 16000];        // half the chart's height, in m
let chartOn = false;
let chartScale = 2;

function drawChart(c, g, r) {
  const p = g.player, pl = g.plot;
  const half = CHART_SCALES[chartScale];
  const k = (r.h / 2) / half;
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  const X = x => cx + (x - p.x) * k, Y = y => cy - (y - p.y) * k;
  const now = g.time;
  c.save();
  c.beginPath(); c.rect(r.x, r.y, r.w, r.h); c.clip();
  c.fillStyle = '#00060f';
  c.fillRect(r.x, r.y, r.w, r.h);

  // grid, labelled in km from the patrol's starting point
  const step = half <= 4000 ? 1000 : half <= 8000 ? 2000 : 4000;
  const x0 = p.x - r.w / 2 / k, x1 = p.x + r.w / 2 / k, y0 = p.y - half, y1 = p.y + half;
  c.beginPath();
  for (let x = Math.ceil(x0 / step) * step; x <= x1; x += step) line(c, X(x), r.y, X(x), r.y + r.h);
  for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) line(c, r.x, Y(y), r.x + r.w, Y(y));
  stroke(c, C.blue, LW * 0.7, 0.18);
  for (let x = Math.ceil(x0 / step) * step; x <= x1; x += step) text(c, `${Math.round(x / 1000)}`, X(x) + 3, r.y + r.h - FS * 0.7, rgba('blue', 0.55), FS * 0.6);
  for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) text(c, `${Math.round(y / 1000)}`, r.x + 4, Y(y) - FS * 0.45, rgba('blue', 0.55), FS * 0.6);

  // range rings round the boat
  const ring = (rad, col, a, label) => {
    c.beginPath(); c.arc(cx, cy, rad * k, 0, TAU);
    c.setLineDash([4, 6]); stroke(c, C[col], LW, a); c.setLineDash([]);
    text(c, label, cx + rad * k * 0.71 + 4, cy - rad * k * 0.71, rgba(col, a + 0.2), FS * 0.6);
  };
  ring(SONAR_RANGE, INK, 0.3, 'SONAR 6 KM');
  if (p.depth <= SURFACED_DEPTH) ring(GUN.range, 'yellow', 0.35, 'GUN 4 KM');

  // intelligence from U-boat command
  const it = pl.intel;
  if (it) {
    c.beginPath(); c.arc(X(it.x), Y(it.y), Math.max(6, it.r * k), 0, TAU);
    c.setLineDash([10, 6]); stroke(c, C.yellow, LW * 1.2, 0.6); c.setLineDash([]);
    text(c, it.label, X(it.x), Y(it.y) - Math.max(6, it.r * k) - FS * 0.6, rgba('yellow', 0.8), FS * 0.65, 'center');
    if (it.course !== undefined) {
      const a = it.course * DEG, L = 2500;
      c.beginPath();
      line(c, X(it.x), Y(it.y), X(it.x + Math.sin(a) * L), Y(it.y + Math.cos(a) * L));
      stroke(c, C.yellow, LW, 0.5);
    }
    if (it.mines) {
      c.beginPath();
      for (const R of it.mines) { c.moveTo(X(it.x) + R * k, Y(it.y)); c.arc(X(it.x), Y(it.y), R * k, 0, TAU); }
      c.setLineDash([2, 5]); stroke(c, C.orange, LW * 1.4, 0.55); c.setLineDash([]);
      text(c, 'MINEFIELD REPORTED', X(it.x), Y(it.y) + it.mines[1] * k + FS * 0.8, rgba('orange', 0.8), FS * 0.65, 'center');
    }
  }
  // mines found by pinging
  c.beginPath();
  for (const id in pl.mines) {
    const m = pl.mines[id], s = Math.max(2, FS * 0.2);
    line(c, X(m.x) - s, Y(m.y) - s, X(m.x) + s, Y(m.y) + s); line(c, X(m.x) - s, Y(m.y) + s, X(m.x) + s, Y(m.y) - s);
  }
  stroke(c, C.orange, LW, 0.8);
  // depth-charge explosions
  for (const b of pl.blasts) {
    const a = clamp(1 - (now - b.t) / 240, 0, 1), s = FS * 0.35;
    c.beginPath();
    for (let i = 0; i < 4; i++) { const an = i * Math.PI / 4; line(c, X(b.x) - Math.cos(an) * s, Y(b.y) - Math.sin(an) * s, X(b.x) + Math.cos(an) * s, Y(b.y) + Math.sin(an) * s); }
    stroke(c, C.yellow, LW, a);
  }
  // own track
  c.beginPath();
  pl.track.forEach((q, i) => { if (i === 0) c.moveTo(X(q.x), Y(q.y)); else c.lineTo(X(q.x), Y(q.y)); });
  c.lineTo(cx, cy);
  c.setLineDash([2, 4]); stroke(c, C[INK], LW, 0.55); c.setLineDash([]);
  // own torpedoes (we know where we sent them)
  for (const t of g.torpedoes) {
    if (t.owner !== 'player') continue;
    c.beginPath();
    t.trail.forEach((q, i) => { if (i === 0) c.moveTo(X(q.x), Y(q.y)); else c.lineTo(X(q.x), Y(q.y)); });
    c.lineTo(X(t.x), Y(t.y));
    stroke(c, C.white, LW, 0.7);
    c.beginPath(); c.arc(X(t.x), Y(t.y), Math.max(2, LW * 1.5), 0, TAU); c.fillStyle = C.white; c.fill();
  }

  // contacts: last fix, estimated course and speed
  const lockId = p.lock ? p.lock.id : null;
  for (const id in pl.contacts) {
    const ct = pl.contacts[id];
    const last = ct.pts[ct.pts.length - 1];
    if (!last) continue;
    const age = now - ct.lastT, a = clamp(1 - age / 600, 0.25, 1);
    const est = ct.sunk ? null : plotEstimate(ct);
    const px = X(last.x), py = Y(last.y);
    const escort = ct.name && /corvette|destroyer/i.test(ct.name);
    const col = ct.type === 'torpedo' ? 'red' : ct.type === 'sub' ? 'blue' : escort ? 'red' : INK;
    const s = FS * 0.45;
    c.beginPath();
    if (ct.sunk) { line(c, px - s, py - s, px + s, py + s); line(c, px - s, py + s, px + s, py - s); }
    else if (ct.type === 'sub') { c.moveTo(px + s, py); c.arc(px, py, s, 0, Math.PI, true); c.closePath(); }
    else if (ct.type === 'torpedo') { c.arc(px, py, s * 0.4, 0, TAU); }
    else { c.moveTo(px, py - s); c.lineTo(px + s, py); c.lineTo(px, py + s); c.lineTo(px - s, py); c.closePath(); }
    stroke(c, C[col], LW * 1.3, a);
    if (est) {
      // where it will be in three minutes, with an arrowhead
      const ex = X(last.x + est.vx * 180), ey = Y(last.y + est.vy * 180);
      c.beginPath();
      line(c, px, py, ex, ey);
      const an = Math.atan2(ey - py, ex - px), h = FS * 0.4;
      line(c, ex, ey, ex - Math.cos(an - 0.4) * h, ey - Math.sin(an - 0.4) * h);
      line(c, ex, ey, ex - Math.cos(an + 0.4) * h, ey - Math.sin(an + 0.4) * h);
      stroke(c, C[col], LW, a * 0.8);
    }
    const name = ct.sunk ? 'SUNK' : (ct.name ? ct.name.toUpperCase().replace('-CLASS', '') : ct.type === 'torpedo' ? 'TORPEDO' : `CONTACT ${ct.n}`);
    const info = est && ct.type !== 'torpedo' ? ` · ${pad3(est.course)}° ${est.speed.toFixed(0)} KN` : '';
    text(c, name + info, px + s * 1.6, py - s * 1.2, rgba(col, a * 0.9), FS * 0.6);
    if (Number(id) === lockId) { c.beginPath(); c.arc(px, py, s * 2, 0, TAU); stroke(c, C.yellow, LW * 1.2, 1); }
  }

  // the TDC's firing solution: gyro course to the intercept point
  const sol = firingSolution(g);
  if (sol) {
    const vt = TORPEDO.speedKn * KN, dist = vt * sol.time;
    const ix = p.x + Math.sin(sol.course * DEG) * dist, iy = p.y + Math.cos(sol.course * DEG) * dist;
    c.beginPath(); line(c, cx, cy, X(ix), Y(iy));
    c.setLineDash([6, 4]); stroke(c, C.yellow, LW * 1.2, 0.8); c.setLineDash([]);
    c.beginPath(); c.arc(X(ix), Y(iy), FS * 0.4, 0, TAU);
    line(c, X(ix) - FS * 0.6, Y(iy), X(ix) + FS * 0.6, Y(iy)); line(c, X(ix), Y(iy) - FS * 0.6, X(ix), Y(iy) + FS * 0.6);
    stroke(c, C.yellow, LW * 1.2, 0.9);
    text(c, `INTERCEPT · GYRO ${pad3(sol.course)}° · ${Math.round(sol.time / TIME_SCALE)} S`, X(ix) + FS * 0.8, Y(iy) + FS * 0.9, C.yellow, FS * 0.6);
  }
  // the AI's intended course and aim point
  const plan = g.ai.mode !== 'off' && g.ai.plan;
  if (plan && plan.heading !== null) {
    const a = plan.heading * DEG, L = half * 0.6;
    c.beginPath(); line(c, cx, cy, X(p.x + Math.sin(a) * L), Y(p.y + Math.cos(a) * L));
    c.setLineDash([10, 6]); stroke(c, C.blue, LW * 1.4, 0.8); c.setLineDash([]);
  }
  if (plan && plan.aim) {
    c.beginPath(); c.arc(X(plan.aim.x), Y(plan.aim.y), FS * 0.6, 0, TAU);
    stroke(c, C.blue, LW * 1.4, 0.9);
    text(c, 'AIM POINT', X(plan.aim.x) + FS * 0.9, Y(plan.aim.y), C.blue, FS * 0.6);
  }
  // the boat: heading triangle and the periscope bearing
  const hh = p.heading * DEG, s = FS * 0.7;
  const pt = (ang, rad) => [cx + Math.sin(ang) * rad, cy - Math.cos(ang) * rad];
  c.beginPath();
  const t0 = pt(hh, s * 1.4), t1 = pt(hh + 2.5, s), t2 = pt(hh - 2.5, s);
  c.moveTo(...t0); c.lineTo(...t1); c.lineTo(...t2); c.closePath();
  c.fillStyle = rgba('white', 0.9); c.fill();
  const vh = viewHeading(g) * DEG;
  c.beginPath(); line(c, cx, cy, ...pt(vh, s * 5));
  c.setLineDash([2, 4]); stroke(c, C.yellow, LW, 0.7); c.setLineDash([]);

  // header, scale bar, legend
  text(c, `CHART · NORTH UP · ${(half * 2 / 1000).toFixed(0)} KM TOP TO BOTTOM · GRID ${step / 1000} KM · ↑/↓ SCALE · L PERISCOPE`, r.x + FS * 0.8, r.y + FS * 1.1, rgba(INK, 0.85), FS * 0.7);
  text(c, `DEPTH ${Math.round(p.depth)} M · ${pad3(p.heading)}° · ${p.speed.toFixed(1)} KN`, r.x + FS * 0.8, r.y + FS * 2.3, C.white, FS * 0.7);
  const legend = [['◇ SHIP', INK], ['◇ ESCORT', 'red'], ['◡ SUBMARINE', 'blue'], ['× MINE', 'orange'], ['✱ DEPTH CHARGE', 'yellow'], ['— TORPEDO', 'white'], ['- - AI COURSE', 'blue']];
  let ly = r.y + r.h - FS * 1.2 * legend.length - FS * 0.8;
  for (const [l, col] of legend) { text(c, l, r.x + r.w - FS * 0.8, ly, rgba(col, 0.75), FS * 0.6, 'right'); ly += FS * 1.2; }
  const bar = step * k;
  c.beginPath(); line(c, r.x + FS, r.y + r.h - FS * 2.2, r.x + FS + bar, r.y + r.h - FS * 2.2);
  line(c, r.x + FS, r.y + r.h - FS * 2.5, r.x + FS, r.y + r.h - FS * 1.9); line(c, r.x + FS + bar, r.y + r.h - FS * 2.5, r.x + FS + bar, r.y + r.h - FS * 1.9);
  stroke(c, C[INK], LW, 0.8);
  text(c, `${step / 1000} KM`, r.x + FS + bar / 2, r.y + r.h - FS * 2.9, rgba(INK, 0.8), FS * 0.6, 'center');
  c.restore();
  c.beginPath(); c.rect(r.x, r.y, r.w, r.h);
  stroke(c, C[INK], LW * 2, 0.9);
}

/* ---------- instruments ---------- */
function dial(c, cx, cy, R, o) {
  const ang = v => ((o.a0 + (clamp(v, o.min, o.max) - o.min) / (o.max - o.min) * (o.a1 - o.a0)) - 90) * DEG;
  c.beginPath();
  c.arc(cx, cy, R, ang(o.min), ang(o.max));
  stroke(c, C[INK], LW * 1.3);
  for (const z of o.zones || []) {
    c.beginPath();
    c.arc(cx, cy, R * 0.9, ang(z.from), ang(z.to));
    stroke(c, C[z.color], LW * 4, 0.85);
  }
  c.beginPath();
  for (let v = o.min; v <= o.max + 1e-6; v += o.minor) {
    const a = ang(v), major = Math.abs(v / o.major - Math.round(v / o.major)) < 1e-6;
    const r0 = major ? R * 0.78 : R * 0.87;
    line(c, cx + Math.cos(a) * r0, cy + Math.sin(a) * r0, cx + Math.cos(a) * R, cy + Math.sin(a) * R);
  }
  stroke(c, C[INK], LW, 0.8);
  for (let v = o.min; v <= o.max + 1e-6; v += o.labelEvery) {
    const a = ang(v);
    text(c, String(v), cx + Math.cos(a) * R * 0.6, cy + Math.sin(a) * R * 0.6, rgba(INK, 0.75), FS * 0.65, 'center');
  }
  for (const n of o.needles) {
    const a = ang(n.v);
    c.beginPath();
    line(c, cx - Math.cos(a) * R * 0.12, cy - Math.sin(a) * R * 0.12, cx + Math.cos(a) * R * n.len, cy + Math.sin(a) * R * n.len);
    stroke(c, C[n.color], n.width || LW * 2);
  }
  c.beginPath();
  c.arc(cx, cy, Math.max(2, R * 0.05), 0, TAU);
  c.fillStyle = C[INK];
  c.fill();
}

function slotTitle(c, s, title, value, valueColor) {
  text(c, title, s.x + s.w / 2, s.y + FS * 0.7, rgba(INK, 0.8), FS * 0.8, 'center');
  if (value !== undefined) text(c, value, s.x + s.w / 2, s.y + s.h - FS * 0.7, valueColor || C[INK], FS, 'center');
}

function hbar(c, x, y, w, v, min, max, color, marker) {
  c.beginPath();
  c.rect(x, y - FS * 0.35, w, FS * 0.7);
  line(c, x + w * (0 - min) / (max - min), y - FS * 0.55, x + w * (0 - min) / (max - min), y + FS * 0.55);
  stroke(c, C[INK], LW, 0.7);
  const px = x + w * (clamp(v, min, max) - min) / (max - min);
  const zx = x + w * (clamp(0, min, max) - min) / (max - min);
  c.fillStyle = rgba(color, 0.6);
  c.fillRect(Math.min(zx, px), y - FS * 0.3, Math.abs(px - zx), FS * 0.6);
  if (marker !== undefined) {
    const mx = x + w * (clamp(marker, min, max) - min) / (max - min);
    c.beginPath();
    line(c, mx, y - FS * 0.6, mx, y + FS * 0.6);
    stroke(c, C.yellow, LW * 1.6);
  }
}

function vbar(c, x, y, w, h, frac, label) {
  const color = frac < 0.2 ? 'red' : frac < 0.4 ? 'yellow' : INK;
  c.beginPath();
  c.rect(x, y, w, h);
  stroke(c, C[INK], LW, 0.8);
  c.fillStyle = rgba(color, 0.65);
  c.fillRect(x + 2, y + h - (h - 4) * clamp(frac, 0, 1) - 2, w - 4, (h - 4) * clamp(frac, 0, 1));
  c.beginPath();
  for (let i = 1; i < 10; i++) line(c, x, y + h * i / 10, x + w * 0.25, y + h * i / 10);
  stroke(c, C[INK], LW, 0.5);
  text(c, label, x + w / 2, y - FS * 0.55, rgba(INK, 0.8), FS * 0.72, 'center');
  text(c, `${Math.round(frac * 100)}`, x + w / 2, y + h + FS * 0.6, C[color], FS * 0.8, 'center');
}

function drawBottom(c, g, r) {
  const p = g.player;
  c.beginPath();
  c.rect(r.x, r.y, r.w, r.h);
  stroke(c, C[INK], LW, 0.5);
  const weights = [1, 1, 1.15, 1, 1.2, 1.25];
  const total = weights.reduce((a, b) => a + b, 0);
  let x = r.x;
  const slots = weights.map(wt => {
    const s = { x, y: r.y, w: (r.w * wt) / total, h: r.h };
    x += s.w;
    return s;
  });
  c.beginPath();
  for (let i = 1; i < slots.length; i++) line(c, slots[i].x, r.y + 6, slots[i].x, r.y + r.h - 6);
  stroke(c, C[INK], LW, 0.25);
  const dialR = s => Math.min(s.w * 0.4, (s.h - FS * 3.2) / 2);
  const dcy = s => s.y + FS * 1.4 + dialR(s) + (s.h - FS * 2.8 - 2 * dialR(s)) / 2;

  // depth
  let s = slots[0];
  dial(c, s.x + s.w / 2, dcy(s), dialR(s), {
    min: 0, max: 300, a0: -135, a1: 135, major: 50, minor: 10, labelEvery: 100,
    zones: [{ from: SAFE_DEPTH, to: CRUSH_DEPTH, color: 'red' }, { from: CRUSH_DEPTH, to: 300, color: 'red' }, { from: THERMOCLINE - 3, to: THERMOCLINE + 3, color: 'blue' }],
    needles: [{ v: p.orderedDepth, color: 'yellow', len: 0.95, width: LW * 1.2 }, { v: p.depth, color: p.depth > SAFE_DEPTH ? 'red' : INK, len: 0.85 }],
  });
  slotTitle(c, s, 'DEPTH M', `${Math.round(p.depth)} / ${Math.round(p.orderedDepth)}`, p.depth > SAFE_DEPTH ? C.red : undefined);

  // speed
  s = slots[1];
  dial(c, s.x + s.w / 2, dcy(s), dialR(s), {
    min: -8, max: 20, a0: -135, a1: 135, major: 4, minor: 1, labelEvery: 4,
    zones: [{ from: -8, to: 0, color: 'yellow' }],
    needles: [{ v: p.speed, color: INK, len: 0.85 }],
  });
  slotTitle(c, s, 'SPEED KN', `${p.speed.toFixed(1)}`);

  // engine telegraph
  s = slots[2];
  {
    const R = Math.min(s.w * 0.44, s.h - FS * 3.4);
    const cx = s.x + s.w / 2, cy = s.y + FS * 1.6 + R;
    const n = TELEGRAPH.length;
    for (let i = 0; i < n; i++) {
      const a0 = Math.PI + (i / n) * Math.PI, a1 = Math.PI + ((i + 1) / n) * Math.PI;
      const on = i === p.telegraph;
      c.beginPath();
      c.moveTo(cx + Math.cos(a0) * R * 0.35, cy + Math.sin(a0) * R * 0.35);
      c.arc(cx, cy, R, a0, a1);
      c.lineTo(cx + Math.cos(a1) * R * 0.35, cy + Math.sin(a1) * R * 0.35);
      c.arc(cx, cy, R * 0.35, a1, a0, true);
      if (on) { c.fillStyle = rgba(i < TELEGRAPH_STOP ? 'yellow' : INK, 0.35); c.fill(); }
      stroke(c, on ? C[i < TELEGRAPH_STOP ? 'yellow' : INK] : C[INK], on ? LW * 1.8 : LW, on ? 1 : 0.45);
      const am = (a0 + a1) / 2;
      c.save();
      c.translate(cx + Math.cos(am) * R * 0.68, cy + Math.sin(am) * R * 0.68);
      c.rotate(am + Math.PI / 2);
      text(c, TELEGRAPH[i].short, 0, 0, on ? C.white : rgba(INK, 0.7), FS * 0.55, 'center');
      c.restore();
    }
    const maxKn = p.depth > SURFACED_DEPTH ? SUB.maxSubmerged : SUB.maxSurface;
    const frac = clamp(p.speed / maxKn, -0.5, 1);
    const idx = frac < 0 ? 2 + frac / 0.25 : frac <= 0.5 ? 2 + frac / 0.25 : frac <= 0.8 ? 4 + (frac - 0.5) / 0.3 : 5 + (frac - 0.8) / 0.2;
    const a = Math.PI + ((idx + 0.5) / n) * Math.PI;
    c.beginPath();
    line(c, cx, cy, cx + Math.cos(a) * R * 1.02, cy + Math.sin(a) * R * 1.02);
    stroke(c, C.white, LW * 1.4, 0.8);
  }
  slotTitle(c, s, 'ENGINE TELEGRAPH', `${TELEGRAPH[p.telegraph].name}${p.depth > SURFACED_DEPTH ? ' · E-MOTOR' : ' · DIESEL'}`, p.telegraph < TELEGRAPH_STOP ? C.yellow : undefined);

  // compass
  s = slots[3];
  {
    const R = dialR(s), cx = s.x + s.w / 2, cy = dcy(s);
    c.beginPath();
    c.arc(cx, cy, R, 0, TAU);
    for (let b = 0; b < 360; b += 10) {
      const a = (b - 90) * DEG, r0 = b % 30 === 0 ? R * 0.82 : R * 0.9;
      line(c, cx + Math.cos(a) * r0, cy + Math.sin(a) * r0, cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    }
    stroke(c, C[INK], LW, 0.8);
    for (const [lbl, b] of [['N', 0], ['E', 90], ['S', 180], ['W', 270]]) {
      const a = (b - 90) * DEG;
      text(c, lbl, cx + Math.cos(a) * R * 0.66, cy + Math.sin(a) * R * 0.66, lbl === 'N' ? C.red : rgba(INK, 0.8), FS * 0.75, 'center');
    }
    const ph = (viewHeading(g) - 90) * DEG;
    c.beginPath();
    line(c, cx, cy, cx + Math.cos(ph) * R * 0.95, cy + Math.sin(ph) * R * 0.95);
    c.setLineDash([3, 3]);
    stroke(c, C.yellow, LW * 1.3);
    c.setLineDash([]);
    const hh = (p.heading - 90) * DEG;
    const tip = [cx + Math.cos(hh) * R * 0.85, cy + Math.sin(hh) * R * 0.85];
    c.beginPath();
    c.moveTo(tip[0], tip[1]);
    c.lineTo(cx + Math.cos(hh + 2.8) * R * 0.3, cy + Math.sin(hh + 2.8) * R * 0.3);
    c.lineTo(cx + Math.cos(hh - 2.8) * R * 0.3, cy + Math.sin(hh - 2.8) * R * 0.3);
    c.closePath();
    stroke(c, C[INK], LW * 1.6);
  }
  slotTitle(c, s, 'HEADING', `${pad3(p.heading)}°`);

  // helm: rudder and planes
  s = slots[4];
  {
    const bx = s.x + s.w * 0.12, bw = s.w * 0.76;
    const y1 = s.y + s.h * 0.36, y2 = s.y + s.h * 0.66;
    text(c, `RUDDER ${p.rudder < -0.5 ? 'PORT' : p.rudder > 0.5 ? 'STBD' : 'MIDSHIPS'} ${Math.abs(Math.round(p.rudder))}°`, s.x + s.w / 2, y1 - FS * 1.05, rgba(INK, 0.85), FS * 0.72, 'center');
    hbar(c, bx, y1, bw, p.rudder, -SUB.rudderMax, SUB.rudderMax, INK);
    const vzText = Math.abs(p.vz) < 0.08 ? 'LEVEL' : p.vz > 0 ? `DIVING ${p.vz.toFixed(1)}` : `RISING ${(-p.vz).toFixed(1)}`;
    text(c, `PLANES ${vzText} M/S`, s.x + s.w / 2, y2 - FS * 1.05, p.crashDive ? C.red : rgba(INK, 0.85), FS * 0.72, 'center');
    hbar(c, bx, y2, bw, p.vz, -3, 3, p.vz > 0 ? 'blue' : INK);
  }
  slotTitle(c, s, 'HELM', p.helmOrder !== null ? `AUTO HELM ${pad3(p.helmOrder)}°` : `TURN ${p.turnRate >= 0 ? '+' : ''}${p.turnRate.toFixed(1)}°/S`, p.helmOrder !== null ? C.blue : undefined);

  // power: battery, air, hull
  s = slots[5];
  {
    const bw = Math.min(s.w * 0.16, FS * 2.2), gapW = (s.w - 3 * bw) / 4;
    const by = s.y + FS * 2.2, bh = s.h - FS * 3.8;
    vbar(c, s.x + gapW, by, bw, bh, p.battery / 100, 'BATT');
    vbar(c, s.x + gapW * 2 + bw, by, bw, bh, p.air / 100, 'AIR');
    vbar(c, s.x + gapW * 3 + bw * 2, by, bw, bh, p.hull / 100, 'HULL');
  }
}

function lamp(c, x, y, w, h, label, on, color, blink) {
  const lit = on && (!blink || Math.sin(performance.now() / 120) > -0.2);
  c.beginPath();
  c.rect(x, y, w, h);
  if (lit) { c.fillStyle = rgba(color, 0.8); c.fill(); }
  stroke(c, lit ? C[color] : C[INK], lit ? LW * 1.5 : LW, lit ? 1 : 0.3);
  c.font = font(FS * 0.68, true);
  const tw = c.measureText(label).width;
  const size = tw > w - 4 ? FS * 0.68 * (w - 4) / tw : FS * 0.68;
  text(c, label, x + w / 2, y + h / 2 + 1, lit ? '#000' : rgba(INK, 0.3), size, 'center');
}

function drawSonar(c, g, cx, cy, R) {
  const p = g.player, so = g.sonar;
  const k = R / SONAR_RANGE;
  const toScreen = (x, y) => [cx + (x - p.x) * k, cy - (y - p.y) * k];
  c.beginPath();
  c.arc(cx, cy, R, 0, TAU);
  stroke(c, C[INK], LW * 1.6);
  c.beginPath();
  for (let i = 1; i < 6; i++) { c.moveTo(cx + R * i / 6, cy); c.arc(cx, cy, R * i / 6, 0, TAU); }
  line(c, cx - R, cy, cx + R, cy);
  line(c, cx, cy - R, cx, cy + R);
  stroke(c, C[INK], LW, 0.2);
  c.beginPath();
  for (let b = 0; b < 360; b += 5) {
    const a = (b - 90) * DEG, r0 = b % 30 === 0 ? R * 0.92 : b % 10 === 0 ? R * 0.955 : R * 0.975;
    line(c, cx + Math.cos(a) * r0, cy + Math.sin(a) * r0, cx + Math.cos(a) * R, cy + Math.sin(a) * R);
  }
  stroke(c, C[INK], LW, 0.6);
  // bearing scale round the rim
  for (let b = 0; b < 360; b += 30) {
    const a = (b - 90) * DEG, rl = R + FS * 0.75;
    if (b === 0) text(c, 'N', cx, cy - rl, C.red, FS * 0.8, 'center');
    else text(c, pad3(b), cx + Math.cos(a) * rl, cy + Math.sin(a) * rl, rgba(INK, 0.8), FS * 0.6, 'center');
  }
  // own heading: a white marker outside the rim
  {
    const a = (p.heading - 90) * DEG, k0 = R * 1.01, k1 = R * 1.01 + FS * 0.45;
    c.beginPath();
    c.moveTo(cx + Math.cos(a) * k0, cy + Math.sin(a) * k0);
    c.lineTo(cx + Math.cos(a + 0.06) * k1, cy + Math.sin(a + 0.06) * k1);
    c.lineTo(cx + Math.cos(a - 0.06) * k1, cy + Math.sin(a - 0.06) * k1);
    c.closePath();
    c.fillStyle = C.white;
    c.fill();
  }
  c.save();
  c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.clip();
  // sweep beam with a fading trail
  for (let i = 0; i < 14; i++) {
    const a = (so.sweep - i * 2.2 - 90) * DEG;
    c.beginPath();
    line(c, cx, cy, cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    stroke(c, C[INK], LW * (i === 0 ? 2 : 1.5), i === 0 ? 0.9 : 0.35 * (1 - i / 14));
  }
  // own heading and periscope bearing
  const hh = (p.heading - 90) * DEG;
  c.beginPath();
  line(c, cx, cy, cx + Math.cos(hh) * R * 0.25, cy + Math.sin(hh) * R * 0.25);
  stroke(c, C.white, LW * 1.6);
  const ph = (viewHeading(g) - 90) * DEG;
  c.beginPath();
  line(c, cx, cy, cx + Math.cos(ph) * R, cy + Math.sin(ph) * R);
  c.setLineDash([2, 5]);
  stroke(c, C.yellow, LW, 0.6);
  c.setLineDash([]);
  // enemy ASDIC pings: a flash on the rim at the escort's bearing, a ray that fades
  for (const pg of g.asdicPings) {
    const age = g.realTime - pg.t;
    if (age > 3) continue;
    const a = (pg.brg - 90) * DEG, k = 1 - age / 3;
    c.beginPath();
    c.arc(cx, cy, R * (1.02 + age * 0.04), a - 0.12, a + 0.12);
    stroke(c, C.yellow, LW * 2.2, k);
    c.beginPath();
    line(c, cx + Math.cos(a) * R * 0.55, cy + Math.sin(a) * R * 0.55, cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    c.setLineDash([3, 4]);
    stroke(c, C.yellow, LW, k * 0.8);
    c.setLineDash([]);
  }
  // course recommended by the AI captain / first officer
  if (g.ai.mode !== 'off' && g.ai.plan && g.ai.plan.heading !== null) {
    const rh = (g.ai.plan.heading - 90) * DEG;
    c.beginPath();
    line(c, cx + Math.cos(rh) * R * 0.3, cy + Math.sin(rh) * R * 0.3, cx + Math.cos(rh) * R, cy + Math.sin(rh) * R);
    c.setLineDash([8, 6]);
    stroke(c, C.blue, LW * 1.4, 0.8);
    c.setLineDash([]);
  }
  // active ping ring
  if (so.ping) {
    c.beginPath();
    c.arc(cx, cy, so.ping.r * k, 0, TAU);
    stroke(c, C.white, LW * 1.5, 1 - so.ping.r / SONAR_RANGE * 0.7);
  }
  // blips
  const colors = { surface: INK, torpedo: 'red', charge: 'yellow', sub: 'blue', mine: 'orange' };
  for (const b of so.blips) {
    const age = g.realTime - b.t, ttl = b.active ? ACTIVE_TTL : PASSIVE_TTL;
    const a = clamp(1 - age / ttl, 0, 1);
    const [x, y] = toScreen(b.x, b.y);
    const col = colors[b.type];
    const rr = Math.hypot(x - cx, y - cy);
    if (rr > R) {
      const ang = Math.atan2(y - cy, x - cx);
      c.beginPath();
      line(c, cx + Math.cos(ang) * R * 0.9, cy + Math.sin(ang) * R * 0.9, cx + Math.cos(ang) * R, cy + Math.sin(ang) * R);
      stroke(c, C[col], LW * 3, a);
      continue;
    }
    if (b.type === 'torpedo' && b.heading !== undefined) {
      // a little torpedo pointing along its course
      const hd = (b.heading - 90) * DEG, L = Math.max(5, FS * 0.55), dx = Math.cos(hd), dy = Math.sin(hd);
      c.beginPath();
      line(c, x - dx * L, y - dy * L, x + dx * L, y + dy * L);
      line(c, x - dx * L - dy * L * 0.35, y - dy * L + dx * L * 0.35, x - dx * L + dy * L * 0.35, y - dy * L - dx * L * 0.35);
      const tc = b.own ? 'white' : 'red';
      stroke(c, C[tc], LW * 2, a);
      c.beginPath();
      c.arc(x + dx * L, y + dy * L, Math.max(1.5, LW * 1.4), 0, TAU);
      c.fillStyle = rgba(tc, a);
      c.fill();
      continue;
    }
    if (b.type === 'mine') {
      const m = Math.max(2.5, FS * 0.22);
      c.beginPath();
      line(c, x - m, y - m, x + m, y + m);
      line(c, x - m, y + m, x + m, y - m);
      stroke(c, C.orange, LW, a);
      continue;
    }
    const s = b.active ? Math.max(3, FS * 0.3) : Math.max(2.5, FS * 0.25) + b.fuzz * k * 0.5;
    c.beginPath();
    if (b.active) c.rect(x - s / 2, y - s / 2, s, s);
    else c.arc(x, y, s, 0, TAU);
    c.fillStyle = rgba(col, a * (b.active ? 1 : 0.65));
    c.fill();
    if (p.lock && p.lock.id === b.id) {
      c.beginPath();
      c.arc(x, y, s + 5, 0, TAU);
      stroke(c, C.yellow, LW, a);
    }
  }
  c.restore();
  c.beginPath();
  c.arc(cx, cy, 2.5, 0, TAU);
  c.fillStyle = C.white;
  c.fill();
}

function drawRight(c, g, r) {
  const p = g.player;
  c.beginPath();
  c.rect(r.x, r.y, r.w, r.h);
  stroke(c, C[INK], LW, 0.5);
  const pad = FS * 0.7;
  const lh = FS * 1.3;
  let y = r.y + lh * 0.8;
  const pinging = !!g.sonar.ping;
  text(c, `SONAR · ${pinging ? 'ACTIVE PING' : 'PASSIVE'} · ${SONAR_RANGE / 1000} KM`, r.x + r.w / 2, y, pinging ? C.white : C[INK], FS * 0.85, 'center');
  // The sonar scope takes what the other sections leave, so nothing collides at large text sizes.
  const tw0 = (r.w - pad * 2) / 5;
  const fixed = lh * 2.2 + FS * 3                                        // title, bearings, HDG/SCOPE line
    + lh * 3.7 + Math.min(tw0 * 0.56, FS * 1.6) + FS * 2                  // tubes, gyro, deck gun
    + lh * 0.9 + 4 * (FS * 1.45 + 4)                                      // lamps
    + lh * 1.7 + lh * 4.6                                                 // torpedo data computer, at its fullest
    + lh * 5.2 + lh * 0.4;                                                // mission, date and clock, and a gap
  const sr = clamp((r.h - fixed) / 2, FS * 2.2, Math.min(r.w / 2 - pad - FS * 1.6, r.h * 0.19));
  y += lh * 0.6;
  drawSonar(c, g, r.x + r.w / 2, y + sr + FS * 1.5, sr);
  y += sr * 2 + FS * 3;
  text(c, `HDG ${pad3(p.heading)}°`, r.x + pad, y, C.white, FS * 0.8);
  text(c, `SCOPE ${pad3(viewHeading(g))}°`, r.x + r.w - pad, y, C.yellow, FS * 0.8, 'right');
  if (g.ai.mode !== 'off' && g.ai.plan && g.ai.plan.heading !== null) text(c, `→${pad3(g.ai.plan.heading)}°`, r.x + r.w / 2, y, C.blue, FS * 0.8, 'center');
  y += lh * 0.8;

  // torpedo tubes
  c.beginPath(); line(c, r.x + pad, y, r.x + r.w - pad, y); stroke(c, C[INK], LW, 0.3);
  y += lh * 0.7;
  text(c, `TUBES · RESERVE ${p.reserve}`, r.x + pad, y, C[INK], FS * 0.85);
  y += lh;
  const tw = (r.w - pad * 2) / 5;
  p.tubes.forEach((t, i) => {
    const x = r.x + pad + tw * i + tw / 2;
    const rr = Math.min(tw * 0.28, FS * 0.8);
    const color = t.state === 'ready' ? INK : t.state === 'loading' ? 'yellow' : 'red';
    c.beginPath();
    c.arc(x, y + rr, rr, 0, TAU);
    if (t.state === 'ready') { c.fillStyle = rgba(color, 0.5); c.fill(); }
    stroke(c, C[color], LW * 1.4);
    if (t.state === 'loading') {
      c.beginPath();
      c.arc(x, y + rr, rr * 0.6, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - t.t / TORPEDO.reload));
      stroke(c, C.yellow, LW * 2);
    }
    if (i === p.selectedTube) {
      c.beginPath();
      c.rect(x - tw * 0.45, y - 3, tw * 0.9, rr * 2 + FS * 1.6);
      stroke(c, C.white, LW, 0.9);
    }
    text(c, i === 4 ? '5 AFT' : String(i + 1), x, y + rr * 2 + FS * 0.75, rgba(INK, 0.85), FS * 0.7, 'center');
  });
  y += Math.min(tw * 0.56, FS * 1.6) + FS * 2;
  const course = (() => {
    if (g.diff.autoSolution && p.lock) { const sol = firingSolution(g); if (sol) return sol.course; }
    return viewHeading(g);
  })();
  const rel = angleDiff(course, p.heading);
  const stern = p.selectedTube === 4;
  const arcOk = stern ? Math.abs(rel) >= 90 : Math.abs(rel) <= 90;
  const depthOk = p.depth <= TUBE_MAX_DEPTH;
  text(c, `GYRO ${pad3(course)}°`, r.x + pad, y, C[INK], FS * 0.8);
  text(c, arcOk ? 'IN ARC' : 'OUT OF ARC', r.x + r.w / 2 + pad, y, arcOk ? C[INK] : C.red, FS * 0.8);
  text(c, depthOk ? 'DEPTH OK' : 'TOO DEEP', r.x + r.w - pad, y, depthOk ? C[INK] : C.red, FS * 0.8, 'right');
  y += lh;
  {
    const gs = gunState(g);
    text(c, 'DECK GUN 88', r.x + pad, y, C[INK], FS * 0.8);
    const ammo = `${p.gunAmmo} RDS`;
    c.font = font(FS * 0.8, true);
    const room = r.x + r.w - pad - c.measureText(ammo).width - pad * 0.8 - (r.x + r.w / 2 + pad);
    const ws = c.measureText(gs.why).width;
    text(c, gs.why, r.x + r.w / 2 + pad, y, gs.ok ? C[INK] : gs.loading ? C.yellow : rgba(INK, 0.5), ws > room ? FS * 0.8 * room / ws : FS * 0.8);
    text(c, ammo, r.x + r.w - pad, y, p.gunAmmo > 20 ? C[INK] : C.yellow, FS * 0.8, 'right');
    y += lh;
  }

  // status lamps
  c.beginPath(); line(c, r.x + pad, y, r.x + r.w - pad, y); stroke(c, C[INK], LW, 0.3);
  y += lh * 0.4;
  const lamps = [
    ['SURFACED', p.depth <= SURFACED_DEPTH, 'green'],
    ['PERISCOPE', scopeAvailable(g), 'green'],
    ['SILENT', p.silent, 'blue'],
    ['DETECTED', g.detected, 'red', true],
    ['ASDIC', g.realTime - g.asdicNear < 3.5, 'yellow', true],
    ['DIESEL', p.depth <= SURFACED_DEPTH && p.alive, 'yellow'],
    ['BELOW LAYER', p.depth > THERMOCLINE, 'blue'],
    ['CRASH DIVE', p.crashDive, 'red', true],
    ['AIR LOW', p.air < 25, p.air < 10 ? 'red' : 'yellow', p.air < 10],
    ['BATT LOW', p.battery < 25, p.battery < 10 ? 'red' : 'yellow', p.battery < 10],
    ['HULL CRIT', p.hull < 30, 'red', true],
    ['DEPTH CRIT', p.depth > SAFE_DEPTH, 'red', true],
    ['TORPEDO', g.warn.torpedo, 'red', true],
    ['AIRCRAFT', g.warn.aircraft, 'red', true],
    ['MINES', g.warn.mines, 'orange', true],
    ['NIGHT', g.cond.time === 'night', 'blue'],
  ];
  const lw = (r.w - pad * 2 - 3 * 5) / 4, lhh = FS * 1.45;
  lamps.forEach((l, i) => {
    const col = i % 4, row = Math.floor(i / 4);
    lamp(c, r.x + pad + col * (lw + 5), y + row * (lhh + 4), lw, lhh, l[0], l[1], l[2], l[3]);
  });
  y += 4 * (lhh + 4) + lh * 0.5;

  // torpedo data computer
  c.beginPath(); line(c, r.x + pad, y, r.x + r.w - pad, y); stroke(c, C[INK], LW, 0.3);
  y += lh * 0.7;
  text(c, 'TORPEDO DATA COMPUTER', r.x + pad, y, C[INK], FS * 0.85);
  y += lh;
  const lock = p.lock;
  const s = lock && g.ships.find(x => x.id === lock.id);
  const fs = FS * 0.78;
  if (!s || !lock.obs) {
    text(c, 'NO TARGET · AIM AND PRESS T', r.x + pad, y, rgba(INK, 0.5), fs);
    y += lh * 3;
  } else {
    const o = lock.obs, sol = firingSolution(g);
    const unit = s.role === 'escort' ? 'T' : 'GRT';
    text(c, `${s.name.toUpperCase()}`, r.x + pad, y, C.yellow, fs);
    text(c, `${fmtInt(s.grt)} ${unit}`, r.x + r.w - pad, y, C.yellow, fs, 'right');
    y += lh * 0.9;
    const aobSide = o.aob >= 0 ? 'S' : 'P';
    const col2 = r.x + r.w / 2 + pad * 0.5;
    text(c, `RANGE ${fmtInt(o.range)} M`, r.x + pad, y, C[INK], fs);
    text(c, `SPEED ${o.speed.toFixed(1)} KN`, col2, y, C[INK], fs);
    y += lh * 0.9;
    text(c, `COURSE ${pad3(o.course)}°`, r.x + pad, y, C[INK], fs);
    text(c, `AOB ${Math.round(Math.abs(o.aob))}° ${aobSide}`, col2, y, C[INK], fs);
    y += lh * 0.9;
    if (sol) {
      const lead = angleDiff(sol.course, bearingTo(p.x, p.y, s.x, s.y));
      text(c, g.diff.leadMarker ? `LEAD ${pad3(sol.course)}° (${lead >= 0 ? '+' : ''}${lead.toFixed(0)}°)` : 'LEAD --- (HARD)', r.x + pad, y, C[INK], fs);
      text(c, `RUN ${Math.round(sol.time / TIME_SCALE)} S`, col2, y, C[INK], fs);
      y += lh * 0.9;
      text(c, sol.stale ? 'SOLUTION STALE · OBSERVE AGAIN' : g.diff.autoSolution ? 'SOLUTION OK · AUTO GYRO' : 'SOLUTION OK', r.x + pad, y, sol.stale ? C.yellow : C[INK], fs);
    } else {
      text(c, 'NO SOLUTION', r.x + pad, y, C.red, fs);
    }
    y += lh;
  }

  // score
  const sy = r.y + r.h - lh * 1.1;
  c.beginPath(); line(c, r.x + pad, sy - lh * 4.1, r.x + r.w - pad, sy - lh * 4.1); stroke(c, C[INK], LW, 0.3);
  // right: the flap calendar over the clock
  const cR = lh * 1.2, ccx = r.x + r.w - pad - cR, ccy = sy - lh * 1.25;
  const calW = drawFlapCalendar(c, g, r.x + r.w - pad, sy - lh * 3.85, lh * 1.15, r.w * 0.4);
  const fitText = (str, yy, color, size, reserve) => {
    c.font = font(size, true);
    const w = c.measureText(str).width, max = r.w - pad * 3 - reserve;
    text(c, str, r.x + pad, yy, color, w > max ? size * max / w : size);
  };
  fitText(`PATROL ${g.patrol} · ${g.mission.name}`, sy - lh * 3.3, C[INK], FS * 0.85, calW);
  if (g.calendar) {
    // the area and position; when that does not fit at a readable size, the area alone
    const full = `${g.calendar.place} · ${latLonText(g.calendar.lat, g.calendar.lon)}`;
    c.font = font(FS * 0.72, true);
    const room = r.w - pad * 3 - cR * 2;
    fitText(c.measureText(full).width * 0.8 > room ? g.calendar.place : full, sy - lh * 2.25, rgba(INK, 0.8), FS * 0.72, cR * 2);
  }
  fitText(missionStatus(g), sy - lh * 1.1, C.yellow, FS * 0.8, cR * 2);
  fitText(conditionsText(g.cond), sy, rgba(INK, 0.75), FS * 0.72, cR * 2 + FS * 4);
  text(c, `${fmtInt(score(g))}`, ccx - cR - pad * 0.7, sy, C.yellow, FS, 'right');
  drawClock(c, g, ccx, ccy, cR);
}

// Split-flap calendar: day, month, year on three flaps, right-aligned at x. Returns its width.
let flapShown = '', flapT = -10, flapOld = '';
function drawFlapCalendar(c, g, xr, y, h, maxW) {
  if (!g.calendar) return 0;
  // in a narrow panel the flaps get smaller, so the patrol's name keeps room to be read
  c.font = font(h * 0.62, true);
  const est = ['00', 'MAR', '1941'].reduce((a, t) => a + c.measureText(t).width + h * 0.62 * 0.7, 0) + h * 0.18 * 2;
  if (maxW && est > maxW) { const k = maxW / est; y += h * (1 - k) / 2; h *= k; }
  const d = new Date(g.calendar.day + Math.floor(clockMinutes(g) < g.clock.start ? 1 : 0) * DAY_MS);
  const parts = [String(d.getUTCDate()).padStart(2, '0'), MONTHS[d.getUTCMonth()], String(d.getUTCFullYear())];
  const key = parts.join(' ');
  const now = performance.now() / 1000;
  if (key !== flapShown) { flapOld = flapShown; flapShown = key; flapT = now; }
  const old = flapOld ? flapOld.split(' ') : parts;
  const p = clamp((now - flapT) / 0.45, 0, 1);              // flip progress
  const fs = h * 0.62, gap = h * 0.18;
  c.font = font(fs, true);
  const widths = parts.map(t => c.measureText(t.length < 4 ? t.padEnd(t.length) : t).width + fs * 0.7);
  const total = widths.reduce((a, b) => a + b, 0) + gap * (parts.length - 1);
  let x = xr - total;
  parts.forEach((t, i) => {
    const w = widths[i], mid = y + h / 2;
    c.fillStyle = 'rgba(0,0,0,0.6)';
    c.fillRect(x, y, w, h);
    c.beginPath();
    c.rect(x, y, w, h);
    stroke(c, C[INK], LW, 0.7);
    text(c, t, x + w / 2, mid + fs * 0.05, C.white, fs, 'center');
    if (p < 1 && old[i] !== t) {
      // the old leaf falls: its upper half folds down over the new value
      const k = 1 - p;
      c.save();
      c.beginPath(); c.rect(x, y, w, h / 2); c.clip();
      c.fillStyle = '#000';
      c.fillRect(x, mid - (h / 2) * k, w, (h / 2) * k);
      c.translate(x + w / 2, mid);
      c.scale(1, k);
      text(c, old[i], 0, fs * 0.05, C.white, fs, 'center');
      c.restore();
    }
    // the split between the leaves
    c.beginPath();
    line(c, x, mid, x + w, mid);
    stroke(c, '#000', LW, 0.85);
    c.beginPath();
    line(c, x - 1, mid, x + 2, mid); line(c, x + w - 2, mid, x + w + 1, mid);
    stroke(c, C[INK], LW, 0.7);
    x += w + gap;
  });
  return total;
}

// Small analog clock with the sun or the moon on its face.
function drawClock(c, g, x, y, R) {
  const m = clockMinutes(g);
  c.beginPath();
  c.arc(x, y, R, 0, TAU);
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * TAU, k = i % 3 === 0 ? 0.78 : 0.88;
    line(c, x + Math.sin(a) * R * k, y - Math.cos(a) * R * k, x + Math.sin(a) * R * 0.97, y - Math.cos(a) * R * 0.97);
  }
  stroke(c, C[INK], LW, 0.8);
  // the sky icon, in the upper half of the face
  const ix = x, iy = y - R * 0.42, ir = R * 0.17;
  const time = g.cond.time;
  c.beginPath();
  if (time === 'night') {
    c.arc(ix, iy, ir, Math.PI * 0.35, Math.PI * 1.65);
    c.arc(ix + ir * 0.55, iy, ir * 0.85, Math.PI * 1.45, Math.PI * 0.55, true);
    stroke(c, C.white, LW, 0.9);
  } else if (time === 'dusk') {
    c.arc(ix, iy + ir * 0.4, ir, Math.PI, 0);
    line(c, ix - ir * 1.7, iy + ir * 0.4, ix + ir * 1.7, iy + ir * 0.4);
    for (const a of [-2.4, -1.57, -0.75]) line(c, ix + Math.cos(a) * ir * 1.35, iy + ir * 0.4 + Math.sin(a) * ir * 1.35, ix + Math.cos(a) * ir * 1.8, iy + ir * 0.4 + Math.sin(a) * ir * 1.8);
    stroke(c, C.orange, LW, 0.9);
  } else {
    c.arc(ix, iy, ir * 0.75, 0, TAU);
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU;
      line(c, ix + Math.cos(a) * ir * 1.05, iy + Math.sin(a) * ir * 1.05, ix + Math.cos(a) * ir * 1.5, iy + Math.sin(a) * ir * 1.5);
    }
    stroke(c, C.yellow, LW, 0.9);
  }
  // hands
  const ha = ((m / 60) % 12) / 12 * TAU, ma = (m % 60) / 60 * TAU;
  c.beginPath();
  line(c, x, y, x + Math.sin(ha) * R * 0.5, y - Math.cos(ha) * R * 0.5);
  stroke(c, C[INK], LW * 2, 1);
  c.beginPath();
  line(c, x, y, x + Math.sin(ma) * R * 0.82, y - Math.cos(ma) * R * 0.82);
  stroke(c, C[INK], LW * 1.2, 1);
  c.beginPath();
  c.arc(x, y, Math.max(1.5, LW * 1.3), 0, TAU);
  c.fillStyle = C[INK];
  c.fill();
}

// Command line: three sections of two rows. Left: interface options. Middle: the boat's
// commands in three groups (navigation · periscope, aiming, sonar · weapons). Right: AI and info.
// Each entry is [key, description].
const CMD_LEFT = [[['M', 'SOUND'], ['G', 'CRT EFFECTS']], [['+/-', 'TEXT SIZE'], ['ESC', 'PAUSE']]];
const CMD_RIGHT = [[['O', 'GUIDE'], ['K', 'AI CAPTAIN']], [['H', 'HELP'], ['I', 'STATS'], ['N', 'BLUEPRINTS']]];
const CMD_GROUPS = [
  [[['W/S', 'ENGINE'], ['A/D', 'RUDDER'], ['R/F', 'DEPTH']], [['C', 'CRASH DIVE'], ['X', 'SILENT'], ['V', 'STEER TO SCOPE'], ['L', 'CHART']]],
  [[['P', 'PERISCOPE'], ['←/→', 'TRAIN'], ['↑/↓', 'POWER']], [['B', 'TO BOW'], ['T', 'LOCK'], ['TAB', 'PING']]],
  [[['SPACE', 'FIRE'], ['1-5', 'TUBE']], [['E', 'DECK GUN']]],
];
const CMD_DEMO = [[[['', 'THE AI CAPTAIN HAS THE CONN']], [['K', 'TAKE COMMAND'], ['O', 'GUIDANCE INSTEAD'], ['L', 'CHART']]]];
const CMD_SEP = ' · ';

// Width of one row of [key, description] entries at the current font.
function cmdRowWidth(c, row) {
  return c.measureText(row.map(([k, d]) => (k ? k + ' ' : '') + d).join(CMD_SEP)).width;
}

// One row: keys at full brightness, descriptions dimmer so the key bindings stand out.
function cmdRow(c, row, x, y, keyCol, descCol) {
  c.textAlign = 'left';
  c.textBaseline = 'middle';
  row.forEach(([k, d], i) => {
    if (i) { c.fillStyle = descCol; c.fillText(CMD_SEP, x, y); x += c.measureText(CMD_SEP).width; }
    if (k) { c.fillStyle = keyCol; c.fillText(k + ' ', x, y); x += c.measureText(k + ' ').width; }
    c.fillStyle = descCol; c.fillText(d, x, y); x += c.measureText(d).width;
  });
}

function drawCommandLine(c, r) {
  const demo = game && game.ai.mode === 'demo';
  const groups = demo ? CMD_DEMO : CMD_GROUPS;
  let size = Math.min(FS * 0.8, r.h * 0.45);
  c.font = font(size, true);
  const space = c.measureText(' ').width;
  const colW = rows => Math.max(...rows.map(row => cmdRowWidth(c, row)));
  const wl = colW(CMD_LEFT), wr = colW(CMD_RIGHT), wg = groups.map(colW);
  const midW = wg.reduce((a, b) => a + b, 0) + space * 3 * (wg.length - 1);
  // Only on a screen too narrow for the three sections is the text made smaller.
  const need = wl + wr + midW + space * 8;
  if (need > r.w) { size *= r.w / need; c.font = font(size, true); }
  const k = need > r.w ? r.w / need : 1;
  const y1 = r.y + r.h * 0.28, y2 = r.y + r.h * 0.74;
  const keyCol = demo ? C.blue : rgba(INK, 0.75), descCol = demo ? rgba('blue', 0.5) : rgba(INK, 0.42);
  // left section, flush left
  cmdRow(c, CMD_LEFT[0], r.x, y1, keyCol, descCol);
  cmdRow(c, CMD_LEFT[1], r.x, y2, keyCol, descCol);
  // right section, flush right
  const xr = r.x + r.w - wr * k;
  cmdRow(c, CMD_RIGHT[0], xr, y1, keyCol, descCol);
  cmdRow(c, CMD_RIGHT[1], xr, y2, keyCol, descCol);
  // middle: the command groups side by side, centred between the two sections
  const left = r.x + wl * k, right = xr;
  let x = (left + right) / 2 - (midW * k) / 2;
  groups.forEach((rows, i) => {
    if (i) {
      // a space, a faint divider and a space between the groups
      c.beginPath();
      line(c, x + space * 1.5 * k, y1 - size * 0.55, x + space * 1.5 * k, y2 + size * 0.55);
      stroke(c, descCol, LW * 0.8, 0.6);
      x += space * 3 * k;
    }
    cmdRow(c, rows[0], x, y1, keyCol, descCol);
    if (rows[1]) cmdRow(c, rows[1], x, y2, keyCol, descCol);
    x += wg[i] * k;
  });
  // in a narrow screen the sections are tighter; this divides interface | commands | AI & info
  c.beginPath();
  line(c, left + space * k, y1 - size * 0.55, left + space * k, y2 + size * 0.55);
  line(c, right - space * k, y1 - size * 0.55, right - space * k, y2 + size * 0.55);
  stroke(c, descCol, LW, 0.35);
}

// Caption of the AI captain (demo) or of the first officer (guide), under the compass tape.
function drawAiCaption(c, g, r) {
  const ai = g.ai;
  if (ai.mode === 'off' || !ai.plan || !g.player.alive) return;
  const w = Math.min(r.w * 0.82, FS * 46), x = r.x + (r.w - w) / 2, y = r.y + FS * 5.2;
  const fs = FS * 0.9, pad = FS * 0.6;
  const demo = ai.mode === 'demo';
  const lines = [];
  if (demo) {
    lines.push([`AI CAPTAIN · ${ai.plan.phase.toUpperCase()}`, C.blue, fs * 0.8]);
    for (const l of wrapText(c, ai.plan.note || '', w - pad * 2, fs)) lines.push([l, C.white, fs]);
    const k = timeFactor(g);
    if (k > 1) lines.push([`TIME ×${k}`, C.yellow, fs * 0.8]);
  } else {
    const st = ai.step;
    if (!st) return;
    lines.push(['FIRST OFFICER', C.blue, fs * 0.8]);
    for (const l of wrapText(c, st.why || '', w - pad * 2, fs * 0.85)) lines.push([l, rgba('white', 0.8), fs * 0.85]);
    lines.push(['▸ ' + st.text, C.yellow, fs * 1.1]);
    if (st.keys) lines.push([st.keys, C[INK], fs]);
    if (ai.done && g.realTime - ai.doneT < 2.5) lines.push(['✓ ' + ai.done, C.green, fs * 0.8]);
  }
  const h = lines.reduce((a, l) => a + l[2] * 1.35, 0) + pad * 1.4;
  c.fillStyle = 'rgba(0,0,0,0.6)';
  c.fillRect(x, y, w, h);
  c.beginPath();
  c.rect(x, y, w, h);
  stroke(c, C.blue, LW, 0.7);
  let yy = y + pad * 0.7;
  for (const [str, col, size] of lines) {
    text(c, str, x + w / 2, yy + size * 0.65, col, size, 'center');
    yy += size * 1.35;
  }
}

/* ---------- overlays ---------- */
function panel(c, w, h) {
  const x = (W - w) / 2, y = (H - h) / 2;
  c.fillStyle = 'rgba(0,0,0,0.88)';
  c.fillRect(x, y, w, h);
  c.beginPath();
  c.rect(x, y, w, h);
  c.rect(x + 5, y + 5, w - 10, h - 10);
  stroke(c, C[INK], LW * 1.4, 0.9);
  return { x, y, w, h };
}
