function spawnExplosion(g, x, y, size, fire) {
  const rng = g.rng;
  spawnGeyser(g, x, y, 55 * size, 4);
  g.effects.push({ type: 'flash', x, y, h: 10, t: 0, dur: 0.6 * size, big: true });
  const frags = [];
  const n = Math.round(14 * size);
  for (let i = 0; i < n; i++) {
    const pts = [];
    const k = 3 + Math.floor(rng() * 3);
    const r = rng.range(2, 6) * size;
    for (let j = 0; j < k; j++) {
      const a = (j / k) * TAU + rng.range(-0.3, 0.3);
      pts.push([Math.cos(a) * r * rng.range(0.6, 1.2), Math.sin(a) * r * rng.range(0.6, 1.2)]);
    }
    const a = rng() * TAU, sp = rng.range(8, 30) * size;
    frags.push({
      x, y, h: 4,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vh: rng.range(18, 45) * size,
      rot: rng() * TAU, vrot: rng.range(-4, 4), pts,
      fire: fire && rng() < 0.5,
    });
  }
  g.effects.push({ type: 'debris', frags, t: 0, dur: 7 });
}

function updateEffects(g, dt) {
  for (const e of g.effects) {
    e.t += dt;
    if (e.type === 'debris') {
      for (const f of e.frags) {
        if (f.h < -5) continue;
        f.vh -= 9.8 * dt;
        f.x += f.vx * dt; f.y += f.vy * dt; f.h += f.vh * dt;
        f.rot += f.vrot * dt;
      }
    }
  }
  g.effects = g.effects.filter(e => e.t < e.dur);
}

/* =========================================================
   SONAR
   ========================================================= */
function sonarSources(g) {
  const out = [];
  for (const s of g.ships) {
    const cls = SHIP_CLASSES[s.kind];
    const submerged = s.role === 'sub' && s.depth > 2;
    const base = s.role === 'sub' && !submerged ? 0.6 : cls.loud;
    const loud = s.sinking ? 0.7 : base * (0.5 + s.speed / cls.maxSpeed);
    out.push({ id: s.id, x: s.x, y: s.y, type: submerged && !s.sinking ? 'sub' : 'surface', loud });
  }
  for (const t of g.torpedoes) out.push({ id: t.id, x: t.x, y: t.y, type: 'torpedo', loud: 0.5, heading: t.heading, own: t.owner === 'player' });
  for (const c of g.charges) out.push({ id: c.id, x: c.x, y: c.y, type: 'charge', loud: 0.4 });
  for (const m of g.mines) out.push({ id: m.id, x: m.x, y: m.y, type: 'mine', loud: 0.034 }); // silent: heard only very close
  return out;
}

// Sonar contacts go on the plot: ships, submarines and torpedoes as contacts, mines as marks.
function plotBlip(g, b) {
  if (b.type === 'mine') g.plot.mines[b.id] = { x: b.x, y: b.y };
  else if (b.type === 'surface' || b.type === 'sub') plotContact(g, b.id, b.x, b.y, b.type, b.active);
  else if (b.type === 'torpedo' && !b.own) plotContact(g, b.id, b.x, b.y, 'torpedo', b.active);
}

function updateSonar(g, dt) {
  const so = g.sonar, p = g.player;
  const prev = so.sweep;
  so.sweep = wrap360(so.sweep + SONAR_SWEEP * dt);
  const swept = wrap360(so.sweep - prev);
  const sources = sonarSources(g);
  let hearing = 12000 * g.cond.hear;
  if (Math.abs(p.speed) > 6) hearing *= 0.6;
  if (p.depth < SURFACED_DEPTH) hearing *= 0.6;
  for (const src of sources) {
    const b = bearingTo(p.x, p.y, src.x, src.y);
    if (wrap360(b - prev) > swept) continue;
    const r = dist2d(p.x, p.y, src.x, src.y);
    if (r > Math.min(src.loud * hearing, SONAR_RANGE * 1.3)) continue;
    const rErr = 1 + g.rng.gauss() * (0.04 + r / SONAR_RANGE * 0.1);
    const bErr = g.rng.gauss() * 2;
    const bb = (b + bErr) * DEG;
    so.blips = so.blips.filter(x => !(x.id === src.id && !x.active));
    so.blips.push({ id: src.id, x: p.x + Math.sin(bb) * r * rErr, y: p.y + Math.cos(bb) * r * rErr, type: src.type, t: g.realTime, active: false, fuzz: r * 0.08, heading: src.heading, own: src.own });
    plotBlip(g, so.blips[so.blips.length - 1]);
  }
  if (so.ping) {
    const r0 = so.ping.r;
    so.ping.r += (SONAR_RANGE / 1.5) * dt;
    for (const src of sources) {
      const r = dist2d(p.x, p.y, src.x, src.y);
      if (r < r0 || r >= so.ping.r) continue;
      if (src.type === 'mine' && r > 3000) continue;
      so.blips = so.blips.filter(x => x.id !== src.id || !x.active);
      so.blips.push({ id: src.id, x: src.x, y: src.y, type: src.type, t: g.realTime, active: true, fuzz: 0, heading: src.heading, own: src.own });
      plotBlip(g, so.blips[so.blips.length - 1]);
      if (src.type === 'surface') emit(g, 'echo', { dist: r });
    }
    if (so.ping.r > SONAR_RANGE) so.ping = null;
  }
  so.blips = so.blips.filter(b => g.realTime - b.t < (b.active ? ACTIVE_TTL : PASSIVE_TTL));

  // Warning lamps.
  const pv = { x: Math.sin(p.heading * DEG) * p.speed * KN, y: Math.cos(p.heading * DEG) * p.speed * KN };
  g.warn.torpedo = p.alive && g.torpedoes.some(t => {
    if (t.owner !== 'enemy') return false;
    const dx = p.x - t.x, dy = p.y - t.y, d = Math.hypot(dx, dy);
    const vx = Math.sin(t.heading * DEG) - pv.x / 23, vy = Math.cos(t.heading * DEG) - pv.y / 23;
    return d < 3000 && dx * vx + dy * vy > 0;
  });
  g.warn.aircraft = p.alive && p.depth <= PERISCOPE_MAX && g.planes.some(pl => dist2d(p.x, p.y, pl.x, pl.y) < 6000);
  g.warn.mines = p.alive && g.mines.some(m => Math.abs(m.x - p.x) < 600 && Math.abs(m.y - p.y) < 600);

  const was = g.detected;
  g.detected = g.player.alive && g.ships.some(s => s.ai && !s.sinking && s.ai.hasContact);
  if (g.detected && !was) {
    say(g, 'WE HAVE BEEN DETECTED!', 'red');
    emit(g, 'detected');
  }
}

/* =========================================================
   CALENDAR, PLACE AND SKY
   Each patrol has a date and a place; the sun and the moon are where they
   would be there and then (simple almanac formulas, good to a degree or so).
   ========================================================= */
const OCEAN_AREAS = [
  { name: 'WESTERN APPROACHES', lat: 55.5, lon: -15.5 },
  { name: 'ROCKALL BANK', lat: 57.6, lon: -13.8 },
  { name: 'NORTH CHANNEL APPROACHES', lat: 56.2, lon: -9.6 },
  { name: 'SOUTH OF ICELAND', lat: 61.2, lon: -20.5 },
  { name: 'GREENLAND GAP', lat: 57.8, lon: -34.5 },
  { name: 'GRAND BANKS', lat: 45.8, lon: -48.5 },
  { name: 'BAY OF BISCAY', lat: 46.2, lon: -8.5 },
  { name: 'WEST OF THE AZORES', lat: 38.6, lon: -31.5 },
  { name: 'OFF FREETOWN', lat: 7.8, lon: -15.6 },
];
const HARBOURS = [
  { name: 'LOCH EWE', lat: 57.85, lon: -5.65 },
  { name: 'SCAPA FLOW', lat: 58.90, lon: -3.10 },
  { name: 'HVALFJORDUR, ICELAND', lat: 64.38, lon: -21.60 },
  { name: 'FREETOWN ROADS', lat: 8.50, lon: -13.25 },
];
const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const MONTH_NAMES = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
const CAMPAIGN_START = Date.UTC(1941, 2, 3);          // the first patrol sails in early March 1941
const DAY_MS = 86400000;

const latLonText = (lat, lon) => {
  const f = (v, p, n) => { const a = Math.abs(v), d = Math.floor(a), m = Math.round((a - d) * 60); return `${d}°${String(m).padStart(2, '0')}'${v >= 0 ? p : n}`; };
  return `${f(lat, 'N', 'S')} ${f(lon, 'E', 'W')}`;
};

// Days since J2000.0 (2000-01-01 12:00 UTC).
const j2000 = ms => (ms - Date.UTC(2000, 0, 1, 12)) / DAY_MS;
const rev = a => ((a % 360) + 360) % 360;

// Right ascension and declination (degrees) of the sun and the moon, and the moon's phase.
function sunMoon(ms) {
  const d = j2000(ms), eps = 23.439 * DEG;
  const gS = rev(357.529 + 0.98560028 * d) * DEG;
  const lamS = rev(280.459 + 0.98564736 * d + 1.915 * Math.sin(gS) + 0.020 * Math.sin(2 * gS));
  const L = rev(218.316 + 13.176396 * d), M = rev(134.963 + 13.064993 * d) * DEG, F = rev(93.272 + 13.229350 * d) * DEG;
  const lamM = rev(L + 6.289 * Math.sin(M)), betM = 5.128 * Math.sin(F);
  const eq = (lam, bet) => {
    const l = lam * DEG, b = bet * DEG;
    const ra = Math.atan2(Math.sin(l) * Math.cos(eps) - Math.tan(b) * Math.sin(eps), Math.cos(l));
    const dec = Math.asin(Math.sin(b) * Math.cos(eps) + Math.cos(b) * Math.sin(eps) * Math.sin(l));
    return { ra: rev(ra / DEG), dec: dec / DEG };
  };
  const elong = rev(lamM - lamS);
  return { sun: eq(lamS, 0), moon: eq(lamM, betM), frac: (1 - Math.cos(elong * DEG)) / 2, waxing: elong < 180 };
}

// Altitude and azimuth (degrees, azimuth from north through east) of a body seen from lat/lon.
function horizontal(ms, lat, lon, body) {
  const lst = rev(280.46061837 + 360.98564736629 * j2000(ms) + lon);
  const H = (lst - body.ra) * DEG, phi = lat * DEG, dec = body.dec * DEG;
  const alt = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
  const az = Math.atan2(-Math.sin(H) * Math.cos(dec), Math.cos(phi) * Math.sin(dec) - Math.sin(phi) * Math.cos(dec) * Math.cos(H));
  return { alt: alt / DEG, az: rev(az / DEG) };
}

// Ship's time is local mean time; this gives the UTC instant for minute m of the patrol's day.
const patrolInstant = (g, m) => g.calendar.day + (m - (g.calendar.lon / 15) * 60) * 60000;

function skyNow(g) {
  if (!g.calendar) return null;
  const ms = patrolInstant(g, (g.clock.start + (g.time - g.clock.at) / 60));
  const sm = sunMoon(ms), { lat, lon } = g.calendar;
  return { sun: horizontal(ms, lat, lon, sm.sun), moon: horizontal(ms, lat, lon, sm.moon), frac: sm.frac, waxing: sm.waxing, ms };
}

// Date, place and starting time of patrol n. A separate random stream keeps the game's sequence unchanged.
function planCalendar(g, n, type) {
  const r = makeRng((g.seed || 1) * 7919 + n * 104729);
  const dayN = Math.round((n - 1) * 34 + r.range(0, 12));
  const day = CAMPAIGN_START + dayN * DAY_MS;
  const place = type === 'anchorage' ? r.pick(HARBOURS) : r.pick(OCEAN_AREAS);
  const lat = place.lat + (type === 'anchorage' ? 0 : r.range(-1.2, 1.2)), lon = place.lon + (type === 'anchorage' ? 0 : r.range(-1.5, 1.5));
  g.calendar = { day, lat, lon, place: place.name };
  // Pick a time of day at which the sun matches the conditions: high by day, low in the west at dusk, well down at night.
  const want = g.cond.time;
  const sunAt = m => { const ms = patrolInstant(g, m); return horizontal(ms, lat, lon, sunMoon(ms).sun); };
  const fits = [];
  let lowest = { m: 0, alt: 99 };
  for (let m = 0; m < 1440; m += 10) {
    const s = sunAt(m);
    if (s.alt < lowest.alt) lowest = { m, alt: s.alt };
    if (want === 'day' && s.alt > 15) fits.push(m);
    else if (want === 'dusk' && s.alt > -5 && s.alt < 3 && s.az > 180) fits.push(m);
    else if (want === 'night' && s.alt < -12) fits.push(m);
  }
  // At high latitude in summer the night may never get dark enough: take the darkest hour.
  return fits.length ? r.pick(fits) : lowest.m;
}

function dateText(ms, long) {
  const d = new Date(ms);
  return long ? `${d.getUTCDate()} ${MONTH_NAMES[d.getUTCMonth()]} ${d.getUTCFullYear()}` : `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
}
const hhmm = m => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(Math.floor(m % 60)).padStart(2, '0')}`;

/* =========================================================
   DECK GUN (88 mm) AND THE PLOT (what the chart shows)
   ========================================================= */
const GUN = {
  range: 4000,               // m
  reload: 5,                 // game seconds between rounds
  ammo: 120,
  manTime: 30,               // game seconds after surfacing to clear away the gun
  shellSpeed: 750,           // m/s
};

function gunState(g) {
  const p = g.player;
  if (!p.alive) return { ok: false, why: 'NO GUN' };
  if (p.depth > SURFACED_DEPTH) return { ok: false, why: 'SUBMERGED' };
  if (g.cond.sea === 'storm') return { ok: false, why: 'SEA TOO HEAVY' };
  if (p.gunAmmo <= 0) return { ok: false, why: 'NO AMMUNITION' };
  if (p.surfacedT < GUN.manTime) return { ok: false, why: `MANNING ${Math.ceil((GUN.manTime - p.surfacedT) / TIME_SCALE)} S` };
  if (p.gunT > 0) return { ok: false, why: 'LOADING', loading: true };
  return { ok: true, why: 'READY' };
}

// Chance that one round hits ship s at range d.
function gunHitChance(g, s, d) {
  const p = g.player;
  let k = clamp(0.8 - (d - 500) / 3500 * 0.65, 0.12, 0.8);
  k *= clamp(s.length / 100, 0.6, 1.2);
  k *= 1 - clamp(s.speed / 40, 0, 0.5);
  k *= g.cond.sea === 'calm' ? 1 : 0.8;
  k *= g.cond.time === 'night' ? 0.6 : g.cond.time === 'dusk' ? 0.8 : 1;
  k *= g.cond.fog ? 0.7 : 1;
  k *= 1 - clamp(Math.abs(p.speed) / 30, 0, 0.4);          // a steady platform shoots better
  const walk = p.gunWalk && p.gunWalk.id === s.id ? p.gunWalk.n : 0;
  return clamp(k + Math.min(walk, 5) * 0.05, 0.05, 0.9);   // the gun layer walks his fire onto the target
}

function fireGun(g) {
  const p = g.player;
  const st = gunState(g);
  if (!st.ok) { say(g, st.loading ? 'GUN LOADING' : `DECK GUN: ${st.why}`, 'yellow'); return false; }
  const s = p.lock && g.ships.find(x => x.id === p.lock.id);
  if (!s || s.sinking) { say(g, 'DECK GUN: LOCK A TARGET FIRST (T)', 'yellow'); return false; }
  const d = dist2d(p.x, p.y, s.x, s.y);
  if (d > GUN.range) { say(g, `DECK GUN: OUT OF RANGE (${(d / 1000).toFixed(1)} KM, MAX ${GUN.range / 1000})`, 'yellow'); return false; }
  if (s.role === 'sub' && s.depth > SURFACED_DEPTH + 1) { say(g, 'DECK GUN: TARGET SUBMERGED', 'yellow'); return false; }
  const rel = angleDiff(bearingTo(p.x, p.y, s.x, s.y), p.heading);
  if (Math.abs(rel) > 155) { say(g, 'DECK GUN: CONNING TOWER IN THE WAY · TURN THE BOAT', 'yellow'); return false; }
  const hit = g.rng() < gunHitChance(g, s, d);
  p.gunWalk = p.gunWalk && p.gunWalk.id === s.id ? { id: s.id, n: p.gunWalk.n + 1 } : { id: s.id, n: 1 };
  p.gunAmmo--;
  p.gunT = GUN.reload;
  p.noiseSpike += 0.5;
  g.stats.shells++;
  // Where the round lands: on the ship, or a splash short, over or wide.
  const a = g.rng() * TAU, miss = g.rng.range(25, 90);
  g.ownShells.push({ targetId: s.id, hit, t: d / GUN.shellSpeed, dx: hit ? 0 : Math.sin(a) * miss, dy: hit ? 0 : Math.cos(a) * miss });
  emit(g, 'deckGun');
  // The bang is heard for miles: every escort comes to look, the convoy scatters.
  for (const e of g.ships) {
    if (!e.ai || e.sinking || e.role === 'sub') continue;
    if (dist2d(p.x, p.y, e.x, e.y) > 9000) continue;
    setLastKnown(g, e, 150);
    if (e.ai.state === 'escort') e.ai.state = 'hunt';
  }
  alertConvoy(g);
  return true;
}

function stepOwnShells(g, dt) {
  const p = g.player;
  if (p.gunT > 0) p.gunT = Math.max(0, p.gunT - dt);
  p.surfacedT = p.depth <= SURFACED_DEPTH ? p.surfacedT + dt : 0;
  for (const sh of g.ownShells) {
    sh.t -= dt;
    if (sh.t > 0) continue;
    sh.done = true;
    const s = g.ships.find(x => x.id === sh.targetId);
    if (!s) continue;
    const d = dist2d(p.x, p.y, s.x, s.y);
    if (sh.hit && !s.sinking) {
      g.stats.shellHits++;
      const perHit = s.maxHp / clamp(s.grt / 650, 5, 16);
      s.hp -= perHit;
      s.burning = true;
      g.effects.push({ type: 'flash', x: s.x + g.rng.range(-0.3, 0.3) * s.length * Math.sin(s.heading * DEG), y: s.y + g.rng.range(-0.3, 0.3) * s.length * Math.cos(s.heading * DEG), h: 6, t: 0, dur: 0.4 });
      emit(g, 'shellOnTarget', { dist: d });
      if (s.hp <= 0.001) sinkShip(g, s);
    } else {
      spawnGeyser(g, s.x + sh.dx, s.y + sh.dy, 14, 1.6);
      emit(g, 'splash', { dist: d });
    }
  }
  g.ownShells = g.ownShells.filter(sh => !sh.done);
}

// The plot remembers what the boat has seen and heard, so the chart never shows more than that.
function plotInit() {
  return { track: [], trackT: 0, contacts: {}, mines: {}, blasts: [], intel: null, next: 1, lookT: 0 };
}

function plotContact(g, id, x, y, type, exact, name) {
  const pl = g.plot;
  let c = pl.contacts[id];
  if (!c) c = pl.contacts[id] = { id, n: pl.next++, type, pts: [], name: null };
  c.type = type;
  if (name) c.name = name;
  const last = c.pts[c.pts.length - 1];
  // Average reports that come close together, so that a passive blip's wander does not look like speed.
  if (last && g.time - last.t0 < 8) {
    const w = exact ? 0.7 : 0.35;
    last.x = lerp(last.x, x, w); last.y = lerp(last.y, y, w); last.t = g.time;
  } else c.pts.push({ x, y, t: g.time, t0: g.time });
  while (c.pts.length && g.time - c.pts[0].t > 240) c.pts.shift();
  c.lastT = g.time;
}

// Estimated course and speed of a contact from its plotted positions (least squares).
function plotEstimate(c) {
  const pts = c.pts;
  if (pts.length < 3 || pts[pts.length - 1].t - pts[0].t < 40) return null;
  const n = pts.length;
  let st = 0, sx = 0, sy = 0;
  for (const q of pts) { st += q.t; sx += q.x; sy += q.y; }
  st /= n; sx /= n; sy /= n;
  let tt = 0, tx = 0, ty = 0;
  for (const q of pts) { tt += (q.t - st) ** 2; tx += (q.t - st) * (q.x - sx); ty += (q.t - st) * (q.y - sy); }
  if (tt < 1e-6) return null;
  const vx = tx / tt, vy = ty / tt, v = Math.hypot(vx, vy);
  const tl = pts[n - 1].t;
  return { x: sx + vx * (tl - st), y: sy + vy * (tl - st), vx, vy, speed: v / KN, course: wrap360(Math.atan2(vx, vy) / DEG) };
}

// Noise for the plot that does not touch the game's random sequence (so replays stay identical).
const plotNoise = (k, t) => { const v = Math.sin(k * 127.1 + t * 311.7) * 43758.5453; return (v - Math.floor(v) - 0.5) * 2; };

function updatePlot(g, dt) {
  const pl = g.plot, p = g.player;
  pl.trackT -= dt;
  if (pl.trackT <= 0 && p.alive) {
    pl.trackT = 15;
    pl.track.push({ x: p.x, y: p.y, d: p.depth });
    if (pl.track.length > 600) pl.track.shift();
  }
  // Lookouts and the periscope report what they can see.
  pl.lookT -= dt;
  if (pl.lookT <= 0) {
    pl.lookT = 4;
    const eyes = p.alive && (p.depth <= SURFACED_DEPTH || scopeAvailable(g));
    if (eyes) {
      const vr = visualRange(g) * (p.depth <= SURFACED_DEPTH ? 1 : 0.85);
      for (const s of g.ships) {
        if (s.sinking) continue;
        if (s.role === 'sub' && s.depth > PERISCOPE_MAX - 2) continue;
        const d = dist2d(p.x, p.y, s.x, s.y);
        if (d > vr) continue;
        const e = d * 0.03;                                     // eyeball range error
        plotContact(g, s.id, s.x + plotNoise(s.id, g.time) * e, s.y + plotNoise(s.id + 0.5, g.time) * e, s.role === 'sub' ? 'sub' : 'surface', true, SHIP_CLASSES[s.kind].cls);
      }
    }
  }
  for (const id in pl.contacts) if (g.time - pl.contacts[id].lastT > 600) delete pl.contacts[id];
  pl.blasts = pl.blasts.filter(b => g.time - b.t < 240);
}

/* =========================================================
   AI CAPTAIN (demo) AND FIRST OFFICER (guide)
   One planner decides what the boat should be doing. In demo mode the
   AI captain carries it out with the same commands as the player; in
   guide mode the first officer turns it into one instruction at a time.
   ========================================================= */
const AI = {
  tick: 0.25,              // real seconds between decisions
  attackRange: 3300,       // start the attack inside this range
  attackExit: 4300,        // and give it up beyond this one
  fireRange: 2400,
  surfaceClear: 700,       // surface run only with every escort further than its lookouts' range plus this
  evadeRange: 3500,        // an escort with contact closer than this sends us deep
  calm: 120,               // game seconds without threats before coming back up
};
const AI_MODES = ['off', 'demo', 'guide'];

function aiInit(mode) {
  return {
    mode: AI_MODES.includes(mode) ? mode : 'off', used: mode === 'demo', guided: mode === 'guide',
    t: 0, plan: null, step: null, done: null, doneT: -1e9,
    lastThreatT: -1e9, lastShotT: -1e9, lastLockT: -1e9, attacking: false, recharging: false,
    dodgeDepth: 0, dodgeT: -1e9, dodgeCourse: 0, targetId: 0, ducking: false,
  };
}

function setAiMode(g, mode) {
  const ai = g.ai;
  if (!AI_MODES.includes(mode) || ai.mode === mode) return;
  ai.mode = mode;
  ai.t = 0;
  ai.step = null;
  ai.done = null;
  if (mode === 'demo') { ai.used = true; say(g, 'THE AI CAPTAIN HAS THE CONN · K TO TAKE COMMAND', 'blue'); }
  else if (mode === 'guide') { ai.guided = true; say(g, 'FIRST OFFICER: I WILL TALK YOU THROUGH IT, HERR KALEUN', 'blue'); }
  else {
    ai.plan = null;
    g.player.helmOrder = null;
    g.player.scopeTarget = null;
    say(g, 'YOU HAVE THE CONN', 'blue');
  }
}

function aiThreats(g) {
  const p = g.player;
  let escort = null, ed = 1e9, hunting = null, hd = 1e9;
  for (const s of g.ships) {
    if (s.role !== 'escort' || s.sinking) continue;
    const d = dist2d(p.x, p.y, s.x, s.y);
    if (d < ed) { ed = d; escort = s; }
    if ((s.ai.hasContact || s.ai.state === 'attack') && d < hd) { hd = d; hunting = s; }
  }
  const charge = g.charges.find(c => !c.aerial && dist2d(p.x, p.y, c.x, c.y) < 600);
  const plane = g.planes.find(pl => pl.state !== 'leave' && dist2d(p.x, p.y, pl.x, pl.y) < (pl.state === 'attack' ? 9000 : 6000));
  return { escort, ed, hunting, hd, charge, plane, torpedo: g.warn.torpedo };
}

const inFlightAt = (g, s) => g.torpedoes.filter(t => t.owner === 'player' && t.targetId === s.id).length;

function aiTarget(g) {
  const p = g.player, type = g.mission.type;
  if (type === 'hunters' || g.patrolState !== 'active') return null;
  const role = type === 'duel' ? 'sub' : 'merchant';
  const cands = g.ships.filter(s => s.role === role && !s.sinking);
  if (!cands.length) return null;
  const covered = s => inFlightAt(g, s) >= s.hp + 1;   // one spare torpedo in every spread
  if (p.lock) {
    const l = cands.find(s => s.id === p.lock.id);
    if (l && !covered(l)) return l;
  }
  // Stay with the current target unless another one is much better placed.
  const cur = cands.find(s => s.id === g.ai.targetId && !covered(s));
  let best = null, bestV = 1e12;
  for (const s of cands) {
    if (covered(s)) continue;
    let v = dist2d(p.x, p.y, s.x, s.y);
    if (s.hp < s.maxHp) v -= 1500;              // finish off the damaged ones
    if (s.kind === 'tanker') v -= 400;
    if (goingAway(p, s)) v += 4000;            // already past us: poor shot
    if (s === cur) v *= 0.6;
    if (v < bestV) { bestV = v; best = s; }
  }
  best = best || cands[0];
  g.ai.targetId = best.id;
  return best;
}

// Angle on the bow of ship s as seen from the boat (0 = bows-on, 180 = stern-on).
const aobOf = (p, s) => angleDiff(bearingTo(p.x, p.y, s.x, s.y) + 180, s.heading);
const goingAway = (p, s) => s.speed > 1 && Math.abs(aobOf(p, s)) > 135;

const nearestStep = d => DEPTH_STEPS.reduce((a, b) => (Math.abs(b - d) < Math.abs(a - d) ? b : a), 0);
// Of two courses, the one closer to the present heading.
const closerCourse = (h, a, b) => (Math.abs(angleDiff(a, h)) <= Math.abs(angleDiff(b, h)) ? wrap360(a) : wrap360(b));

function aiPlan(g) {
  const plan = aiPlanCore(g), th = g.ai.threats;
  // An aircraft about: whatever else we do, stay below its charges (never surface, no periscope).
  if (th && th.plane && plan.phase !== 'air' && plan.depth < CRASH_DIVE_DEPTH) {
    Object.assign(plan, { depth: CRASH_DIVE_DEPTH, scopeUp: false, fire: false, lock: false });
    plan.note = 'AIRCRAFT ABOUT · STAYING AT 60 M · ' + plan.note;
  }
  return plan;
}

function aiPlanCore(g) {
  const p = g.player, ai = g.ai, th = aiThreats(g);
  ai.threats = th;
  const plan = {
    phase: 'patrol', note: '', heading: null, telegraph: 3, depth: PERISCOPE_DEPTH, silent: false,
    scopeUp: true, scope: null, zoom: 0, crash: false, lock: false, tube: null, fire: false, gun: false, target: null, wait: '', aim: null,
  };
  if (!p.alive) return plan;
  if ((th.hunting && th.hd < AI.evadeRange) || th.charge) ai.lastThreatT = g.time;

  // 1. Aircraft: get below their shallow charges.
  if (th.plane && p.depth < 45) {
    Object.assign(plan, { phase: 'air', crash: p.depth < 25, depth: CRASH_DIVE_DEPTH, telegraph: TELEGRAPH_FULL, scopeUp: false,
      note: 'AIRCRAFT! CRASH DIVE: THEIR CHARGES ARE SET SHALLOW AND CANNOT REACH 60 M' });
    return plan;
  }

  // 2. Torpedoes coming: they run shallow.
  if (th.torpedo && p.depth < ENEMY_TORPEDO.hitDepth + 10) {
    Object.assign(plan, { phase: 'torpedo', depth: 40, telegraph: TELEGRAPH_FULL, scopeUp: false,
      note: `TORPEDOES INBOUND! GO BELOW ${ENEMY_TORPEDO.hitDepth} M: THEY RUN SHALLOW` });
    return plan;
  }
  // 3. Escorts on us, depth charges, or the hunters mission: go deep, slow and quiet.
  const hunters = g.mission.type === 'hunters' && g.patrolState === 'active';
  if (hunters || th.charge || g.time - ai.lastThreatT < AI.calm) {
    const deep = hunters ? 150 : 120;
    Object.assign(plan, { phase: 'evade', depth: deep, telegraph: 4, silent: true, scopeUp: false });
    const s = th.hunting || th.escort;
    if (s) {
      const away = bearingTo(s.x, s.y, p.x, p.y);
      plan.heading = g.time - ai.dodgeT < 240 ? ai.dodgeCourse : closerCourse(p.heading, away + 60, away - 60);
    }
    if (th.charge && g.time - ai.dodgeT > 70) {
      // A pattern is coming down: sprint out sideways from under the escort's track and change depth.
      ai.dodgeT = g.time;
      ai.dodgeDepth = p.depth > 135 ? 100 : 180;
      const esc = th.hunting || th.escort;
      if (esc) {
        const h = esc.heading * DEG, lat = (p.x - esc.x) * Math.cos(h) - (p.y - esc.y) * Math.sin(h);
        ai.dodgeCourse = wrap360(esc.heading + (lat >= 0 ? 90 : -90));
      } else ai.dodgeCourse = p.heading;
    }
    if (g.time - ai.dodgeT < 55) {
      // Keep running while the escort is busy with its run-out: its sonar loses us beyond ~800 m.
      Object.assign(plan, { depth: ai.dodgeDepth, telegraph: TELEGRAPH_FULL, silent: false, heading: ai.dodgeCourse,
        note: th.charge ? 'DEPTH CHARGES! FULL SPEED OUT FROM UNDER THEIR TRACK AND CHANGE DEPTH' : 'SPRINTING WHILE THE CHURNED WATER COVERS OUR NOISE' });
    } else if (hunters) {
      const t = Math.ceil(g.mission.timer / TIME_SCALE);
      plan.note = `HUNTERS ABOVE · STAY BELOW THE LAYER, SLOW AND SILENT FOR ${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
    } else {
      plan.note = th.hunting ? 'ESCORT HAS CONTACT · DEEP BELOW THE LAYER, SLOW AND SILENT' : 'WAITING FOR THE ESCORTS TO LOSE INTEREST';
    }
    return plan;
  }

  // 4. Battery and air: recharge on the surface when nobody is near.
  const ra0 = g.area ? dist2d(p.x, p.y, g.area.x, g.area.y) : 1e9;
  const nearMines = g.mines.length && ra0 > MINE.rings[0] - 450 && ra0 < MINE.rings[1] + 500;
  const clear = 5000 * g.cond.vis + AI.surfaceClear;
  // Air nearly gone: surface even with escorts about (unless they already have us), or the crew suffocates.
  const safe = !nearMines && !g.detected && (th.ed > clear || p.air < 12);
  if (ai.recharging) { if ((p.battery > 75 && p.air > 95) || !safe) ai.recharging = false; }
  else if ((p.battery < 25 || p.air < 25) && safe) ai.recharging = true;

  // 5. The target.
  const tgt = aiTarget(g);
  if (!tgt) {
    plan.phase = 'standby';
    plan.note = g.patrolState === 'active' ? 'SEARCHING' : 'PATROL COMPLETE · STANDING BY FOR NEW ORDERS';
    const c = g.convoy || g.area;
    if (c && g.patrolState === 'active') plan.heading = bearingTo(p.x, p.y, c.x, c.y);
    plan.telegraph = 4;
    if (ai.recharging) Object.assign(plan, { depth: 0, note: 'SURFACED TO RECHARGE BATTERY AND AIR' });
    return plan;
  }
  plan.target = tgt.id;
  const d = dist2d(p.x, p.y, tgt.x, tgt.y);
  const brg = bearingTo(p.x, p.y, tgt.x, tgt.y);
  const visible = d < visualRange(g) && (tgt.role !== 'sub' || tgt.depth <= PERISCOPE_MAX - 2);
  ai.attacking = ai.attacking ? d < AI.attackExit : d < AI.attackRange;
  const ra = g.area ? dist2d(p.x, p.y, g.area.x, g.area.y) : 1e9;
  const inMines = g.mines.length && ra > MINE.rings[0] - 450 && ra < MINE.rings[1] + 500;

  // Deck gun: finish off a damaged merchant, or carry on when the torpedoes are gone, with no escort in sight.
  const torps = p.reserve + p.tubes.filter(t => t.state !== 'empty').length;
  const gunCase = tgt.role === 'merchant' && g.cond.sea !== 'storm' && p.gunAmmo > 0 && th.ed > 7000 && !g.detected && !inMines
    && (tgt.hp < tgt.maxHp || torps === 0) && d < 7000;
  if (gunCase) {
    const rel = angleDiff(brg, p.heading);
    Object.assign(plan, { phase: 'gun', depth: 0, telegraph: d > 2500 ? TELEGRAPH_FULL : 3, scope: brg,
      heading: d > 2500 || Math.abs(rel) > 140 ? brg : null });
    const gs = gunState(g);
    if (!p.lock || p.lock.id !== tgt.id) {
      plan.lock = scopeAvailable(g) && Math.abs(angleDiff(viewHeading(g), brg)) < 1.5 && d < visualRange(g);
      plan.note = `SURFACING TO FINISH ${tgt.name.toUpperCase()} WITH THE DECK GUN`;
    } else if (d > GUN.range) plan.note = `CLOSING TO GUN RANGE · ${fmtKm(d)}`;
    else if (!gs.ok) plan.note = `DECK GUN: ${gs.why}`;
    else {
      plan.gun = Math.abs(rel) <= 150;
      plan.note = `DECK GUN FIRING · ${fmtKm(d)} · ${p.gunAmmo} ROUNDS LEFT`;
    }
    return plan;
  }

  if (!ai.attacking) {
    plan.phase = 'approach';
    if (tgt.speed > 1) {
      // Head for a point ahead of the target and off its track, on our side.
      const c = tgt.heading * DEG, v = tgt.speed * KN;
      const rx = p.x - tgt.x, ry = p.y - tgt.y;
      const side = rx * Math.cos(c) - ry * Math.sin(c) >= 0 ? 1 : -1;
      const along = clamp(d * 0.6, 1200, 4000), off = 1900 * side;     // well off the track, clear of the screen
      const axp = tgt.x + Math.sin(c) * along + Math.cos(c) * off, ayp = tgt.y + Math.cos(c) * along - Math.sin(c) * off;
      const own = (p.depth < SURFACED_DEPTH ? SUB.maxSurface : SUB.maxSubmerged) * 0.8 * KN;
      const sol = interceptCourse(p.x, p.y, axp, ayp, Math.sin(c) * v, Math.cos(c) * v, own);
      plan.heading = sol ? sol.course : bearingTo(p.x, p.y, axp, ayp);
      plan.aim = { x: axp, y: ayp };
    } else plan.heading = brg;
    const surfaceRun = th.ed > clear && !g.detected && d > 6000 && tgt.role !== 'sub' && !(g.mines.length && ra0 < MINE.rings[1] + 1500);
    if (surfaceRun || ai.recharging) {
      Object.assign(plan, { depth: 0, telegraph: TELEGRAPH_FULL,
        note: ai.recharging ? 'SURFACED TO RECHARGE · STILL CLOSING THE TARGET' : `SURFACE RUN ON THE DIESELS TO GET AHEAD OF THE TARGET · ${(d / 1000).toFixed(1)} KM` });
    } else {
      Object.assign(plan, { depth: PERISCOPE_DEPTH, telegraph: p.battery > 60 && d > 5500 ? TELEGRAPH_FULL : 4,
        note: `CLOSING SUBMERGED AT PERISCOPE DEPTH · TARGET ${(d / 1000).toFixed(1)} KM` });
    }
    if (inMines) Object.assign(plan, { depth: CRASH_DIVE_DEPTH, telegraph: 4, scopeUp: false, note: 'PASSING UNDER THE MINEFIELD AT 60 M' });
    plan.scope = visible ? brg : plan.heading;
    return plan;
  }

  // Attack: periscope depth, slow and quiet.
  Object.assign(plan, { phase: 'attack', depth: PERISCOPE_DEPTH, telegraph: 3, silent: true, scope: brg });
  if (inMines) Object.assign(plan, { depth: CRASH_DIVE_DEPTH, scopeUp: false, heading: brg, telegraph: 4, note: 'PASSING UNDER THE MINEFIELD AT 60 M' });
  else if (!visible) {
    plan.heading = brg;
    plan.note = tgt.role === 'sub' ? 'SUBMARINE DEEP · HOLDING AT PERISCOPE DEPTH UNTIL IT COMES UP' : 'WAITING FOR THE TARGET TO SHOW IN THE PERISCOPE';
  } else if (!p.lock || p.lock.id !== tgt.id) {
    plan.lock = scopeAvailable(g) && Math.abs(angleDiff(viewHeading(g), brg)) < 1.5;
    plan.note = `TARGET IN SIGHT: ${tgt.name.toUpperCase()} · LOCK IT FOR A FIRING SOLUTION`;
  } else {
    const sol = firingSolution(g);
    const flying = inFlightAt(g, tgt);
    if (!sol) {
      plan.heading = brg;
      plan.note = 'NO SOLUTION · CLOSING IN';
      plan.telegraph = 4;
    } else if (flying >= tgt.hp + 1) {
      plan.note = `TORPEDOES RUNNING · ABOUT ${Math.max(0, Math.round(sol.time / TIME_SCALE))} S TO IMPACT`;
    } else {
      const rel = angleDiff(sol.course, p.heading);
      const tubes = p.tubes;
      const bow = [0, 1, 2, 3].find(i => tubes[i].state === 'ready');
      let tube = null;
      if (Math.abs(rel) <= 85 && bow !== undefined) tube = bow;
      else if (Math.abs(rel) >= 95 && tubes[4].state === 'ready') tube = 4;
      if (tube === null) {
        if (bow === undefined && tubes[4].state !== 'ready') {
          const t = Math.min(...tubes.filter(x => x.state === 'loading').map(x => x.t), 1e9);
          plan.note = t < 1e9 ? `RELOADING · NEXT TUBE IN ${Math.ceil(t / TIME_SCALE)} S` : 'NO TORPEDOES LEFT';
        } else {
          plan.heading = sol.course;
          plan.note = 'TURNING TO BRING THE TUBES TO BEAR';
        }
      } else {
        // Fan the spread over about a ship's length to cover the errors in speed and course.
        const fan = clamp((tgt.length * 0.55 / Math.max(sol.range, 300)) / DEG, 0.6, 3);
        const spread = [0, fan, -fan][flying] || 0;
        const aim = wrap360(sol.course + spread);
        plan.tube = tube;
        plan.scope = aim;
        const fireRange = th.ed < 2500 ? AI.fireRange + 800 : AI.fireRange;    // shoot early with an escort close
        if (sol.range > fireRange) {
          plan.heading = sol.course;
          plan.telegraph = 4;
          plan.note = `CLOSING TO FIRING RANGE · ${(sol.range / 1000).toFixed(1)} KM`;
        } else if (Math.abs(aobOf(p, tgt)) < 40 || Math.abs(aobOf(p, tgt)) > 145) {
          // Bows-on or going away the target is narrow, and a zigzag spoils a long run: wait for a broad aspect.
          plan.note = `WAITING FOR A BROADER ANGLE ON THE BOW · AOB ${Math.round(Math.abs(aobOf(p, tgt)))}°`;
        } else if (sol.stale) {
          plan.scope = brg;
          plan.note = 'OBSERVING THE TARGET AGAIN';
        } else {
          const aimed = g.diff.autoSolution || Math.abs(angleDiff(viewHeading(g), aim)) < 0.8;
          plan.fire = aimed && p.selectedTube === tube && scopeAvailable(g);
          plan.note = `ON THE LEAD · TUBE ${tube + 1} · GYRO ${brg3(aim)}° · RANGE ${fmtKm(sol.range)}`;
        }
      }
    }
  }
  // An escort coming close would find us with its ASDIC: slip under the layer until it has passed.
  ai.ducking = ai.ducking ? th.ed < 1700 : th.ed < 1550;   // their ASDIC builds contact inside ~1.4 km
  if ((plan.phase === 'attack' || plan.phase === 'approach') && ai.ducking && !plan.fire && plan.depth > 0) {
    Object.assign(plan, { depth: 100, silent: true, telegraph: 3, scopeUp: false, lock: false,
      note: `ESCORT CLOSING (${Math.round(th.ed)} M) · UNDER THE LAYER UNTIL IT HAS PASSED` });
  }
  if (ai.recharging && !g.detected) Object.assign(plan, { depth: 0, note: 'SURFACED TO RECHARGE BATTERY AND AIR' });
  return plan;
}

const fmtKm = m => `${(m / 1000).toFixed(1)} KM`;

// AI captain: carry the plan out with the player's own commands.
function aiApply(g, plan) {
  const p = g.player, ai = g.ai;
  if (plan.crash && !p.crashDive && p.depth < CRASH_DIVE_DEPTH - 5) command(g, 'crashDive');
  if (!p.crashDive) {
    const want = nearestStep(plan.depth);
    for (let i = 0; i < 16 && Math.abs(p.orderedDepth - want) > 0.5; i++) command(g, want < p.orderedDepth ? 'depthUp' : 'depthDown');
    for (let i = 0; i < 8 && p.telegraph !== plan.telegraph; i++) command(g, plan.telegraph > p.telegraph ? 'engineUp' : 'engineDown');
    if (p.silent !== plan.silent) command(g, 'silent');
  }
  if (p.periscopeUp !== plan.scopeUp && !(plan.scopeUp && p.crashDive)) command(g, 'periscope');
  p.helmOrder = plan.heading !== null ? wrap360(plan.heading) : (p.helmOrder !== null ? p.helmOrder : wrap360(p.heading));
  p.scopeTarget = plan.scope !== null ? wrap360(plan.scope) : wrap360(p.heading);
  if (p.zoom !== plan.zoom) command(g, plan.zoom ? 'zoomIn' : 'zoomOut');
  if (plan.tube !== null && p.selectedTube !== plan.tube) command(g, 'tube', plan.tube);
  if (plan.lock && g.realTime - ai.lastLockT > 1) { ai.lastLockT = g.realTime; command(g, 'lock'); }
  if (plan.gun && g.realTime - (ai.lastGunT || -9) > 0.4) { ai.lastGunT = g.realTime; command(g, 'gun'); }
  if (plan.fire && g.realTime - ai.lastShotT > 2.5) {
    if (fireTorpedo(g)) ai.lastShotT = g.realTime;
  }
}

// First officer: the single most useful next instruction, with the keys for it.
function guideStep(g, plan) {
  const p = g.player;
  const why = plan.note;
  if (plan.crash && !p.crashDive && p.depth < CRASH_DIVE_DEPTH - 5) {
    return { id: 'crash', why, text: 'CRASH DIVE!', keys: 'PRESS C', check: () => p.crashDive || p.depth >= CRASH_DIVE_DEPTH - 5 };
  }
  const want = nearestStep(plan.depth);
  if (!p.crashDive && Math.abs(p.orderedDepth - want) > 0.5) {
    const up = want < p.orderedDepth;
    const n = DEPTH_STEPS.filter(d => (up ? d < p.orderedDepth - 0.5 && d >= want - 0.5 : d > p.orderedDepth + 0.5 && d <= want + 0.5)).length;
    return { id: 'depth' + want, why, text: want === 0 ? 'SURFACE' : want === PERISCOPE_DEPTH ? 'COME TO PERISCOPE DEPTH (13 M)' : `ORDER DEPTH ${want} M`,
      keys: `PRESS ${up ? 'R' : 'F'}${n > 1 ? ' ×' + n : ''}`, check: () => Math.abs(p.orderedDepth - want) < 0.5 };
  }
  if (plan.scopeUp && !p.periscopeUp && p.depth <= PERISCOPE_MAX + 4) {
    return { id: 'scopeUp', why, text: 'RAISE THE PERISCOPE', keys: 'PRESS P', check: () => p.periscopeUp };
  }
  if (plan.silent !== p.silent && !p.crashDive) {
    return { id: 'silent' + plan.silent, why, text: plan.silent ? 'RIG FOR SILENT RUNNING' : 'CANCEL SILENT RUNNING', keys: 'PRESS X', check: () => p.silent === plan.silent };
  }
  if (!p.crashDive && Math.abs(p.telegraph - plan.telegraph) > (plan.telegraph >= TELEGRAPH_FULL ? 1 : 0)) {
    const n = Math.abs(plan.telegraph - p.telegraph), t = plan.telegraph;
    return { id: 'eng' + t, why, text: `ENGINES ${TELEGRAPH[t].name}`, keys: `PRESS ${t > p.telegraph ? 'W' : 'S'}${n > 1 ? ' ×' + n : ''}`,
      check: () => Math.abs(p.telegraph - t) <= (t >= TELEGRAPH_FULL ? 1 : 0) };
  }
  if (plan.heading !== null) {
    const hd = wrap360(plan.heading), err = angleDiff(hd, p.heading);
    const helmOk = p.helmOrder !== null && Math.abs(angleDiff(p.helmOrder, hd)) < 8;
    if (Math.abs(err) > 12 && !helmOk) {
      return { id: 'helm' + Math.round(hd / 10), why, text: `COME TO COURSE ${brg3(hd)}°`,
        keys: `HOLD ${err < 0 ? 'A (PORT)' : 'D (STARBOARD)'} · OR SCOPE ON ${brg3(hd)}° AND V`,
        check: () => Math.abs(angleDiff(hd, p.heading)) <= 12 || (p.helmOrder !== null && Math.abs(angleDiff(p.helmOrder, hd)) < 8) };
    }
  }
  if (plan.scopeUp && plan.scope !== null && scopeAvailable(g)) {
    const tight = plan.lock || plan.tube !== null;
    const err = angleDiff(plan.scope, viewHeading(g)), tol = tight ? 0.8 : 5;
    if (Math.abs(err) > tol) {
      const sc = wrap360(plan.scope);
      return { id: 'scope' + (tight ? 't' : Math.round(sc / 10)), why, text: plan.tube !== null ? `TRAIN THE PERISCOPE ON THE LEAD: ${brg3(sc)}°` : `TRAIN THE PERISCOPE TO ${brg3(sc)}°`,
        keys: `HOLD ${err < 0 ? '←' : '→'}${Math.abs(err) > 25 ? ' WITH SHIFT' : ''}`, check: () => Math.abs(angleDiff(sc, viewHeading(g))) <= tol };
    }
  }
  if (plan.tube !== null && p.selectedTube !== plan.tube) {
    const t = plan.tube;
    return { id: 'tube' + t, why, text: `SELECT TUBE ${t + 1}${t === 4 ? ' (STERN)' : ''}`, keys: `PRESS ${t + 1}`, check: () => p.selectedTube === t };
  }
  if (plan.lock) {
    const id = plan.target;
    return { id: 'lock', why, text: 'LOCK THE TARGET IN THE CROSSHAIR', keys: 'PRESS T', check: () => p.lock && p.lock.id === id };
  }
  if (plan.gun) {
    const n = g.stats.shells;
    return { id: 'gun', why, text: 'FIRE THE DECK GUN', keys: 'PRESS E (HOLD FIRE WHEN AN ESCORT SHOWS)', check: () => g.stats.shells > n };
  }
  if (plan.fire) {
    const n = g.stats.fired;
    return { id: 'fire', why, text: 'FIRE!', keys: 'PRESS SPACE', check: () => g.stats.fired > n };
  }
  return { id: 'wait', why, text: plan.phase === 'attack' ? 'STEADY · WATCH THE TARGET' : 'STEADY AS SHE GOES', keys: '', check: () => false };
}

function updateAI(g, dt) {
  const ai = g.ai;
  if (ai.mode === 'off' || g.state !== 'playing') return;
  ai.t -= dt;
  if (ai.t > 0) return;
  ai.t = AI.tick;
  const plan = aiPlan(g);
  ai.plan = plan;
  if (ai.mode === 'demo') {
    aiApply(g, plan);
    return;
  }
  const st = guideStep(g, plan);
  if (ai.step && ai.step.id !== st.id && ai.step.id !== 'wait' && ai.step.check()) {
    ai.done = ai.step.text;
    ai.doneT = g.realTime;
  }
  ai.step = st;
}

/* ---------- drawing helpers ---------- */
function font(size, bold) {

}

function text(c, str, x, y, color, size, align, baseline) {

  c.fillStyle = color || C[INK];

  c.textBaseline = baseline || 'middle';

}

function line(c, x1, y1, x2, y2) {
  c.moveTo(x1, y1);
  c.lineTo(x2, y2);
}

function stroke(c, color, width, alpha) {
  c.globalAlpha = alpha === undefined ? 1 : alpha;
  c.strokeStyle = color;
  c.lineWidth = width || LW;
  c.stroke();
  c.globalAlpha = 1;
}

function hash3(i, j, k) {
  let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(k, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

const pad3 = v => String(Math.round(wrap360(v)) % 360).padStart(3, '0');
const fmtInt = v => Math.round(v).toLocaleString('en-US');

/* ---------- background: coastline, moon, stars ---------- */
const BG = (() => {
  const rng = makeRng(1940);
  // Midpoint displacement: a rough, natural ridgeline between two points (bearing, elevation in degrees).
  const fractal = (pts, levels, rough) => {
    let out = pts;
    for (let l = 0; l < levels; l++) {
      const next = [out[0]];
      const amp = rough * Math.pow(0.55, l);
      for (let i = 0; i < out.length - 1; i++) {
        const a = out[i], b = out[i + 1];
        const mid = [(a[0] + b[0]) / 2 + rng.range(-0.15, 0.15) * (b[0] - a[0]), Math.max(0, (a[1] + b[1]) / 2 + rng.range(-amp, amp))];
        next.push(mid, b);
      }
      out = next;
    }
    return out;
  };
  const ranges = [], far = [], ridges = [];
  for (const center of [18, 92, 158, 233, 301]) {
    const width = rng.range(12, 28);
    // control points: a few peaks, then fractal detail down to about a quarter of a degree
    const ctrl = [[center - width / 2, 0]];
    const n = 3 + Math.floor(rng() * 3);
    for (let i = 1; i <= n; i++) ctrl.push([center - width / 2 + (width * i) / (n + 1) + rng.range(-1, 1), rng.range(0.6, 2.6)]);
    ctrl.push([center + width / 2, 0]);
    const pts = fractal(ctrl, 5, 0.45);
    ranges.push(pts);
    // inner ridges: from a few peaks down the flank, the way vector mountains are drawn
    for (let i = 1; i < ctrl.length - 1; i++) {
      const pk = ctrl[i];
      const dir = rng() < 0.5 ? -1 : 1;
      ridges.push(fractal([[pk[0], pk[1]], [pk[0] + dir * rng.range(1.2, 2.6), pk[1] * rng.range(0.15, 0.45)]], 3, 0.12));
    }
    // a lower, farther range behind
    const fctrl = [[center - width * 0.8, 0], [center - width * 0.3, rng.range(0.5, 1.2)], [center + width * 0.1, rng.range(0.6, 1.4)], [center + width * 0.7, 0]];
    far.push(fractal(fctrl, 4, 0.3));
  }
  const stars = [];
  for (let i = 0; i < 110; i++) stars.push([rng() * 360, rng.range(1.5, 30), rng()]);
  return { ranges, far, ridges, stars, moon: { b: 128, e: 13, r: 1.3 } };
})();

/* ---------- 3D camera ---------- */
const P = { x: 0, y: 0, z: 0 };
function makeCamera(x, y, h, yawDeg, F, cx, cy) {
  const yaw = yawDeg * DEG;
  return { x, y, h, yawDeg, S: Math.sin(yaw), Co: Math.cos(yaw), F, cx, cy };
}

function project(cam, wx, wy, wh) {
  const dx = wx - cam.x, dy = wy - cam.y;
  const z = dx * cam.S + dy * cam.Co;
  if (z < 3) return false;
  const x = dx * cam.Co - dy * cam.S;
  P.x = cam.cx + (x / z) * cam.F;
  P.y = cam.cy - ((wh - cam.h) / z) * cam.F;
  P.z = z;
  return true;
}

function seg3(c, cam, ax, ay, ah, bx, by, bh, seaClip) {
  if (seaClip) {
    if (ah < 0 && bh < 0) return;
    if (ah < 0) {
      const t = ah / (ah - bh);
      ax += (bx - ax) * t; ay += (by - ay) * t; ah = 0;
    } else if (bh < 0) {
      const t = bh / (bh - ah);
      bx += (ax - bx) * t; by += (ay - by) * t; bh = 0;
    }
  }
  let dx = ax - cam.x, dy = ay - cam.y;
  let za = dx * cam.S + dy * cam.Co, xa = dx * cam.Co - dy * cam.S, ya = ah - cam.h;
  dx = bx - cam.x; dy = by - cam.y;
  let zb = dx * cam.S + dy * cam.Co, xb = dx * cam.Co - dy * cam.S, yb = bh - cam.h;
  const NEAR = 3;
  if (za < NEAR && zb < NEAR) return;
  if (za < NEAR) {
    const t = (NEAR - za) / (zb - za);
    xa += (xb - xa) * t; ya += (yb - ya) * t; za = NEAR;
  } else if (zb < NEAR) {
    const t = (NEAR - zb) / (za - zb);
    xb += (xa - xb) * t; yb += (ya - yb) * t; zb = NEAR;
  }
  c.moveTo(cam.cx + (xa / za) * cam.F, cam.cy - (ya / za) * cam.F);
  c.lineTo(cam.cx + (xb / zb) * cam.F, cam.cy - (yb / zb) * cam.F);
}

const TV = [0, 0, 0];
let g_sea = null;                                   // sea state of the game being drawn (ships roll more in a storm)
let g_now = 0;
let g_sky = null;                                   // sun and moon of the game being drawn (null on the title screen)                                      // animation clock (real seconds) for flames, smoke, propellers
const WIND = { to: 70, speed: 5 };                  // smoke drifts towards bearing 070
const SMOKE_COLOR = '#b9c9b0';
function drawShipModel(c, cam, s, color, alpha, width) {
  const model = MODELS[s.kind];
  const h = s.heading * DEG, sh = Math.sin(h), ch = Math.cos(h);
  const k = s.sinking;
  let sinkY = 0, pitch = 0, roll = 0, split = 0, brk = false;
  if (s.role === 'sub') sinkY = s.depth * 0.8;              // at periscope depth only the periscope shows
  else if (s.role === 'plane') { sinkY = -s.alt; roll = clamp(s.turn || 0, -0.6, 0.6); pitch = s.state === 'attack' && s.alt > 60 ? -0.15 : 0; }
  else if (g_sea && !k) roll = Math.sin(performance.now() / 1000 * 0.8 + s.id) * 0.02 * g_sea.wave;
  if (k) {
    const f = clamp(k.t / k.dur, 0, 1), e = f * f;
    if (k.mode === 'break') { brk = true; pitch = e * 0.7 + f * 0.1; sinkY += e * s.length * 0.4 + f * 4; split = f * 8; }
    else if (k.mode === 'bow') { pitch = -(e * 1.0 + f * 0.08); sinkY += e * s.length * 0.45 + f * 3; }
    else if (k.mode === 'stern') { pitch = e * 1.0 + f * 0.08; sinkY += e * s.length * 0.45 + f * 3; }
    else { roll = k.side * (e * 1.6 + f * 0.2); sinkY += e * 25 + f * 3; }
  } else if (s.hp < s.maxHp) roll = 0.07;
  const cp = Math.cos(pitch), sp = Math.sin(pitch), cr = Math.cos(roll), sr = Math.sin(roll);
  const tv = (lx, ly, lz) => {
    let x = lx, y = ly, z = lz;
    if (roll) { const nx = x * cr - y * sr; y = x * sr + y * cr; x = nx; }
    let ps = sp;
    if (brk) { if (z < 0) ps = -sp; z += z >= 0 ? split : -split; }
    if (pitch) { const ny = y * cp + z * ps; z = z * cp - y * ps; y = ny; }
    TV[0] = s.x + z * sh + x * ch;
    TV[1] = s.y + z * ch - x * sh;
    TV[2] = y - sinkY;
  };
  c.beginPath();
  for (let i = 0; i < model.length; i += 6) {
    tv(model[i], model[i + 1], model[i + 2]);
    const ax = TV[0], ay = TV[1], ah = TV[2];
    tv(model[i + 3], model[i + 4], model[i + 5]);
    seg3(c, cam, ax, ay, ah, TV[0], TV[1], TV[2], true);
  }
  stroke(c, color, width || LW * 1.3, alpha);

  if (s.role === 'sub' && !k && s.depth > 2) {             // periscope feather
    if (s.depth < PERISCOPE_MAX && s.speed > 1.5) {
      const wl = clamp(s.speed * 6, 10, 60);
      c.beginPath();
      for (const side of [-1, 1]) {
        tv(0, 0, 8.5); const ax = TV[0], ay = TV[1];
        tv(side * wl * 0.3, 0, 8.5 - wl);
        seg3(c, cam, ax, ay, 0, TV[0], TV[1], 0, false);
      }
      stroke(c, C.white, LW, alpha * 0.6);
    }
    return;
  }
  if (!k && s.speed > 1 && s.role !== 'plane') {             // bow wave and wake
    const L = s.length / 2, B = s.beam / 2, wl = clamp(s.speed * 11, 20, 320);
    c.beginPath();
    for (const side of [-1, 1]) {
      tv(0, 0, -L); const ax = TV[0], ay = TV[1];
      tv(side * (B + wl * 0.3), 0, -L - wl);
      seg3(c, cam, ax, ay, 0, TV[0], TV[1], 0, false);
      tv(0, 0, L - 2); const bx = TV[0], by = TV[1];
      tv(side * (B + 4), 0, L - 14);
      seg3(c, cam, bx, by, 0, TV[0], TV[1], 0, false);
    }
    stroke(c, color, LW, alpha * 0.4);
  }
  const fx = SHIP_FX[s.kind];
  if (!fx || s.role === 'plane') return;
  const now = g_now;
  const vx = Math.sin(h) * s.speed * KN, vy = Math.cos(h) * s.speed * KN;
  const wx = Math.sin(WIND.to * DEG) * WIND.speed, wy = Math.cos(WIND.to * DEG) * WIND.speed;
  const ax = cam.Co, ay = -cam.S;                              // across the line of sight
  const puffs = [];
  // Smoke puffs leave the source at its position at emission time, then rise and drift with the wind.
  const smoke = (bx, by, bh, n, life, rise, r0, r1, a0, seed) => {
    for (let q = 0; q < n; q++) {
      const ph = (now / life + q / n + hash3(s.id, seed, q) * 0.07) % 1;
      const age = ph * life * TIME_SCALE;
      const curl = Math.sin(now * 0.7 + q * 1.9 + seed) * ph * 6;
      puffs.push(bx + (wx - vx) * age + ax * curl, by + (wy - vy) * age + ay * curl, bh + 1 + rise * Math.pow(ph, 0.8),
        r0 + (r1 - r0) * ph, a0 * Math.pow(1 - ph, 1.3) * Math.min(1, ph * 10));
    }
  };
  // funnel smoke while steaming
  if (!k && fx.smoke && s.speed > 1) {
    for (let i = 0; i < fx.funnels.length; i++) {
      const f = fx.funnels[i];
      tv(f[0], f[1], f[2]);
      smoke(TV[0], TV[1], TV[2], 6, 9, 16, 1.2, 9, 0.22 * fx.smoke, i);
    }
  }
  if (s.burning && (!k || k.t < k.dur * 0.9)) {
    const fireOn = !k || k.t < k.dur * 0.75;
    const big = (k ? 1.35 : 1) * (s.kind === 'tanker' ? 1.5 : 1) * (s.role === 'merchant' ? 1 : 0.8);
    const nSrc = s.kind === 'tanker' ? 3 : 2;
    const outer = [], inner = [];
    for (let i = 0; i < nSrc; i++) {
      const lz = (hash3(s.id, i, 7) - 0.5) * s.length * 0.55, lx = (hash3(s.id, i, 8) - 0.5) * s.beam * 0.4;
      tv(lx, fx.deck, lz);
      const bx = TV[0], by = TV[1], bh = TV[2];
      if (bh < -0.5) continue;                                   // gone under
      smoke(bx, by, bh + 10 * big, 10, 13, 90 * big, 4, 30 * big, 0.75, 10 + i);
      if (!fireOn) continue;
      for (let j = 0; j < 3; j++) {                              // flame tongues
        const ph = hash3(s.id, i, j) * 50;
        const fl = 0.68 + 0.22 * Math.sin(now * 8 + ph) + 0.12 * Math.sin(now * 21 + ph * 2) + 0.06 * Math.sin(now * 47 + ph);
        const hh = (11 + 11 * hash3(i, j, s.id)) * fl * big;
        const w = (4 + 3 * hash3(j, i, 3)) * big;
        const off = (j - 1) * w * 0.85;
        const cx0 = bx + ax * off, cy0 = by + ay * off;
        const sway = Math.sin(now * 3.1 + ph) * hh * 0.12;
        for (const [arr, kw, kh] of [[outer, 1, 1], [inner, 0.5, 0.62]]) {
          const ww = w * kw, hgt = hh * kh;
          const tipX = cx0 + wx * hgt * 0.05 + ax * sway, tipY = cy0 + wy * hgt * 0.05 + ay * sway;
          const pts = [
            [cx0 - ax * ww / 2, cy0 - ay * ww / 2, bh],
            [cx0 - ax * ww * 0.42 + ax * sway * 0.3, cy0 - ay * ww * 0.42 + ay * sway * 0.3, bh + hgt * 0.38],
            [cx0 - ax * ww * 0.15 + ax * sway * 0.7, cy0 - ay * ww * 0.15 + ay * sway * 0.7, bh + hgt * 0.75],
            [tipX, tipY, bh + hgt],
            [cx0 + ax * ww * 0.18 + ax * sway * 0.6, cy0 + ay * ww * 0.18 + ay * sway * 0.6, bh + hgt * 0.68],
            [cx0 + ax * ww * 0.45 + ax * sway * 0.25, cy0 + ay * ww * 0.45 + ay * sway * 0.25, bh + hgt * 0.32],
            [cx0 + ax * ww / 2, cy0 + ay * ww / 2, bh],
          ];
          for (let q = 0; q < pts.length - 1; q++) arr.push(pts[q], pts[q + 1]);
        }
      }
    }
    // a sinking tanker leaves burning oil on the water
    if (k && s.kind === 'tanker' && fireOn) {
      const R = s.length * 0.25 + k.t * 0.6;
      for (let i = 0; i < 9; i++) {
        const a = (i / 9) * TAU + s.id;
        const px = s.x + Math.sin(a) * R * (0.6 + 0.4 * hash3(i, s.id, 4)), py = s.y + Math.cos(a) * R * (0.6 + 0.4 * hash3(i, s.id, 5));
        const fl = 0.6 + 0.4 * Math.sin(now * 7 + i * 2.3);
        const hgt = 4 * fl + 2, ww = 4;
        outer.push([px - ax * ww, py - ay * ww, 0], [px, py, hgt], [px, py, hgt], [px + ax * ww, py + ay * ww, 0]);
      }
    }
    for (const [arr, col, wd] of [[outer, C.orange, LW * 1.3], [inner, C.yellow, LW * 1.1]]) {
      if (!arr.length) continue;
      c.beginPath();
      for (let q = 0; q < arr.length; q += 2) seg3(c, cam, arr[q][0], arr[q][1], arr[q][2], arr[q + 1][0], arr[q + 1][1], arr[q + 1][2], true);
