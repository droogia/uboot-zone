function wrapText(c, str, maxW, size) {
  c.font = font(size, true);
  const words = str.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (c.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

function drawHelp(c) {
  const pw = Math.min(W * 0.94, FS * 78), ph = Math.min(H * 0.92, FS * 48);
  const r = panel(c, pw, ph);
  const fs = Math.min(ph / (HELP_KEYS.length * 1.6 + 8), pw / 72, FS * 1.05);
  text(c, 'U-BOOT ZONE · COMMANDER\'S HANDBOOK', r.x + r.w / 2, r.y + fs * 2, C[INK], fs * 1.4, 'center');
  let y = r.y + fs * 4.5;
  const x0 = r.x + fs * 2;
  for (const [k, d] of HELP_KEYS) {
    text(c, k, x0, y, C.yellow, fs);
    text(c, d, x0 + fs * 8, y, C[INK], fs);
    y += fs * 1.6;
  }
  const x1 = r.x + r.w * 0.5, tw = r.w * 0.47;
  // Shrink the tips until they fit above the bottom line.
  const avail = r.h - fs * 7.5;
  let ts = fs * 0.92, wrapped;
  for (;;) {
    wrapped = HELP_TIPS.map(tip => wrapText(c, tip, tw, ts));
    const hgt = wrapped.reduce((a, l) => a + l.length * ts * 1.4 + ts * 0.6, 0);
    if (hgt <= avail || ts < 7) break;
    ts *= 0.94;
  }
  y = r.y + fs * 4.5;
  for (const lines of wrapped) {
    lines.forEach((l, i) => text(c, (i === 0 ? '▸ ' : '  ') + l, x1, y + i * ts * 1.4, C[INK], ts));
    y += lines.length * ts * 1.4 + ts * 0.6;
  }
  text(c, 'PRESS H OR ESC TO RETURN', r.x + r.w / 2, r.y + r.h - fs * 1.5, rgba(INK, 0.7), fs, 'center');
}

function statsLines(g) {
  const st = g.stats, sk = st.sunk;
  const acc = st.fired ? Math.round((st.hits / st.fired) * 100) : 0;
  const ships = sk.freighter + sk.tanker + sk.corvette + sk.destroyer + sk.tclass;
  const sub = Math.round(st.timeSubmerged / 60);
  return [
    ['SCORE', `${fmtInt(score(g))}  (TONNAGE ${fmtInt(st.tonnage)} + BONUS ${fmtInt(st.bonus)})`],
    ['SHIPS SUNK', `${ships}  (FREIGHTERS ${sk.freighter} · TANKERS ${sk.tanker} · CORVETTES ${sk.corvette} · DESTROYERS ${sk.destroyer} · SUBS ${sk.tclass})`],
    ['TORPEDOES', `FIRED ${st.fired} · HITS ${st.hits} · DUDS ${st.duds} · MISSED ${st.misses} · ACCURACY ${acc}%`],
    ['DEPTH CHARGES', `${st.chargesNear} EXPLODED CLOSE · ${st.airAttacks} AIR ATTACKS`],
    ['HITS TAKEN', `${st.torpedoHits} TORPEDOES · ${st.minesHit} MINES · ${st.torpedoesDodged} TORPEDOES DODGED · ${Math.round(st.damageTaken)}% DAMAGE`],
    ['DEEPEST DIVE', `${Math.round(st.maxDepth)} M`],
    ['TIME SUBMERGED', `${Math.floor(sub / 60)} H ${String(sub % 60).padStart(2, '0')} MIN (GAME TIME)`],
    ['ACTIVE PINGS', `${st.pings}`],
    ['PATROLS', `${g.patrol} STARTED · ${st.missionsWon} MISSIONS ACCOMPLISHED`],
    ['DATE · AREA', g.calendar ? `${dateText(g.calendar.day)} · ${g.calendar.place} · ${latLonText(g.calendar.lat, g.calendar.lon)}` : '-'],
    ['DIFFICULTY', g.diff.name + (g.ai.used ? ' · AI CAPTAIN (NOT RECORDED)' : g.ai.guided ? ' · GUIDED' : '')],
  ];
}

function drawScores(c, x, y, fs, highlight) {
  const scores = loadScores();
  text(c, 'HIGH SCORES', x, y, C.yellow, fs);
  y += fs * 1.5;
  if (!scores.length) text(c, 'NONE YET', x, y, rgba(INK, 0.6), fs);
  scores.forEach((s, i) => {
    const col = i === highlight ? C.yellow : C[INK];
    text(c, `${i + 1}. ${fmtInt(s.score !== undefined ? s.score : s.grt).padStart(8, ' ')}  PATROL ${s.patrol}  ${s.diff}  ${s.date}`, x, y, col, fs);

// Model segments with their extent, measured once.
function bpModel(kind) {
  const e = kind === 'torpedo' ? TORPEDO_MODEL : MODELS[kind];
  const lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
  for (let i = 0; i < e.length; i++) { const k = i % 3; lo[k] = Math.min(lo[k], e[i]); hi[k] = Math.max(hi[k], e[i]); }
  return { e, lo, hi };
}

// Orthographic view: axes picks model coordinates for screen x and y (index, sign).
function bpOrtho(c, mdl, box, ax, ay, scale, color, label, dims) {
  const { e, lo, hi } = mdl;
  const cx = box.x + box.w / 2, cy = box.y + box.h / 2;
  const mx = (lo[ax[0]] + hi[ax[0]]) / 2, my = (lo[ay[0]] + hi[ay[0]]) / 2;
  const X = v => cx + (v - mx) * ax[1] * scale, Y = v => cy - (v - my) * ay[1] * scale;
  // grid every 5 m (every 1 m for small objects)
  const step = scale > 25 ? 1 : 5;
  c.beginPath();
  for (let v = Math.ceil((mx - box.w / 2 / scale) / step) * step; v <= mx + box.w / 2 / scale; v += step) line(c, X(v), box.y, X(v), box.y + box.h);
  for (let v = Math.ceil((my - box.h / 2 / scale) / step) * step; v <= my + box.h / 2 / scale; v += step) line(c, box.x, Y(v), box.x + box.w, Y(v));
  stroke(c, C.blue, LW * 0.6, 0.13);
  c.beginPath();
  c.rect(box.x, box.y, box.w, box.h);
  stroke(c, C.blue, LW, 0.45);
  text(c, label, box.x + FS * 0.5, box.y + FS * 0.8, C.blue, FS * 0.7);
  if (ay[0] === 1 && lo[1] < 0.5 && hi[1] > 0.5) {                    // waterline
    c.beginPath();
    line(c, box.x, Y(0), box.x + box.w, Y(0));
    c.setLineDash([6, 6]);
    stroke(c, C.blue, LW, 0.6);
    c.setLineDash([]);
  }
  c.beginPath();
  for (let i = 0; i < e.length; i += 6) line(c, X(e[i + ax[0]]), Y(e[i + ay[0]]), X(e[i + 3 + ax[0]]), Y(e[i + 3 + ay[0]]));
  stroke(c, C[color], LW, 0.95);
  // dimension lines
  for (const d of dims || []) {
    const horiz = d.axis === 'x';
    const a = horiz ? X(lo[ax[0]]) : Y(lo[ay[0]]);
    const b = horiz ? X(hi[ax[0]]) : Y(hi[ay[0]]);
    const k = FS * 0.35;
    c.beginPath();
    if (horiz) {
      const y = box.y + box.h - FS * 0.9;
      line(c, a, y, b, y); line(c, a, y - k, a, y + k); line(c, b, y - k, b, y + k);
      stroke(c, C.yellow, LW, 0.85);
      text(c, d.text, (a + b) / 2, y - FS * 0.55, C.yellow, FS * 0.7, 'center');
    } else {
      const x = box.x + box.w - FS * 1.1;
      line(c, x, a, x, b); line(c, x - k, a, x + k, a); line(c, x - k, b, x + k, b);
      stroke(c, C.yellow, LW, 0.85);
      c.save();
      c.translate(x - FS * 0.55, (a + b) / 2);
      c.rotate(-Math.PI / 2);
      text(c, d.text, 0, 0, C.yellow, FS * 0.7, 'center');
      c.restore();
    }
  }
}

// Slowly turning perspective view.
function bpPersp(c, mdl, box, t, color) {
  const { e, lo, hi } = mdl;
  const size = Math.max(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]);
  const mid = [(lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2];
  const yaw = t * 0.35, tilt = 0.32;
  const cyw = Math.cos(yaw), syw = Math.sin(yaw), ct = Math.cos(tilt), st = Math.sin(tilt);
  const dist = size * 1.5, F = Math.min(box.w * 1.1, box.h * 2.2);
  const cx = box.x + box.w / 2, cy = box.y + box.h / 2;
  const pr = (x, y, z) => {
    x -= mid[0]; y -= mid[1]; z -= mid[2];
    const rx = x * cyw - z * syw, rz = x * syw + z * cyw;
    const ry = y * ct - rz * st, rz2 = y * st + rz * ct + dist;
    return [cx + rx / rz2 * F, cy - ry / rz2 * F];
  };
  c.beginPath();
  c.rect(box.x, box.y, box.w, box.h);
  stroke(c, C.blue, LW, 0.45);
  text(c, '3D', box.x + FS * 0.5, box.y + FS * 0.8, C.blue, FS * 0.7);
  c.beginPath();
  for (let i = 0; i < e.length; i += 6) {
    const a = pr(e[i], e[i + 1], e[i + 2]), b = pr(e[i + 3], e[i + 4], e[i + 5]);
    line(c, a[0], a[1], b[0], b[1]);
  }
  stroke(c, C[color], LW, 0.9);
}

function drawBlueprints(c) {
  const bp = BLUEPRINTS[bpIndex];

  text(c, bp.sub, r.x + r.w / 2, r.y + fs * 4, rgba(INK, 0.8), fs * 0.85, 'center');
  const mdl = bpModel(bp.kind);
  const { lo, hi } = mdl;
  const L = hi[2] - lo[2], B = hi[0] - lo[0], Hh = hi[1] - lo[1];
  const top = r.y + fs * 5, bottom = r.y + r.h - fs * 2.4, gap = fs * 0.6;
  const leftW = r.w * 0.62, x0 = r.x + fs, x1 = x0 + leftW + gap, rightW = r.x + r.w - fs - x1;
  const availH = bottom - top - gap;
  // side and plan share one scale, chosen so both fit
  const scale = Math.min((leftW - fs * 2.5) / L, (availH - fs * 4) / (Hh + B + 4));
  const need = Hh * scale + B * scale + fs * 6, extra = Math.max(0, availH - need) / 2;
  const sideH = Hh * scale + fs * 3 + extra, planH = availH - sideH;
  const real = bp.kind === 'torpedo' ? 1 / 1.8 : 1;                // the torpedo model is drawn twice life size
  const m = v => `${(v * real).toFixed(v * real < 20 ? 1 : 0)} M`;
  bpOrtho(c, mdl, { x: x0, y: top, w: leftW, h: sideH }, [2, 1], [1, 1], scale, color, 'SIDE · BOW TO THE RIGHT',

  bpOrtho(c, mdl, { x: x0, y: top + sideH + gap, w: leftW, h: planH }, [2, 1], [0, -1], scale, color, 'PLAN · FROM ABOVE',
    [{ axis: 'y', text: m(B) }]);
  // right column: 3D, bow view, data
  const vh = Math.min(availH * 0.34, rightW * 0.7);
  bpPersp(c, mdl, { x: x1, y: top, w: rightW, h: vh }, performance.now() / 1000, color);
  const fbox = { x: x1, y: top + vh + gap, w: rightW, h: vh * 0.8 };
  const fscale = Math.min((fbox.w - fs * 3) / B, (fbox.h - fs * 2.5) / Hh);
  bpOrtho(c, mdl, fbox, [0, -1], [1, 1], fscale, color, 'FRONT VIEW', []);
  let y = fbox.y + fbox.h + fs * 1.2;
  const ts = fs * 0.78;
  for (const [k, v] of bp.specs) {
    text(c, k, x1, y, C.yellow, ts * 0.85);
    y += ts * 1.15;
    for (const l of wrapText(c, v, rightW, ts)) { text(c, l, x1, y, C[INK], ts); y += ts * 1.2; }
    y += ts * 0.35;
  }
  for (const l of wrapText(c, bp.notes, rightW, ts * 0.9)) { text(c, l, x1, y, rgba('white', 0.75), ts * 0.9); y += ts * 1.15; }
  text(c, '←/→ OR A/D: PREVIOUS / NEXT  ·  N OR ESC: CLOSE', r.x + r.w / 2, r.y + r.h - fs * 1.2, rgba(INK, 0.7), fs * 0.85, 'center');
}

/* ---------- screen effects ---------- */
function addShake(amp, dur, freq) {
  FX.shakes.push({ amp, dur, freq, t: 0, ph: Math.random() * 10 });
  if (FX.shakes.length > 20) FX.shakes.shift();
}

function flash(color, a) {
  FX.flashColor = color;
  FX.flash = Math.max(FX.flash, a);
}

function updateFX(dt, g) {
  let x = 0, y = 0, rot = 0;
  for (const s of FX.shakes) {
    s.t += dt;
    const env = Math.max(0, 1 - s.t / s.dur);
    const k = s.amp * env * env;
    if (s.freq > 20) {
      x += (Math.random() * 2 - 1) * k;
      y += (Math.random() * 2 - 1) * k;
    } else {
      x += Math.sin((s.t * s.freq) * TAU + s.ph) * k;
      y += Math.cos((s.t * s.freq * 1.3) * TAU + s.ph) * k * 0.8;
      rot += Math.sin((s.t * s.freq * 0.7) * TAU + s.ph) * k * 0.0008;
    }
  }
  FX.shakes = FX.shakes.filter(s => s.t < s.dur);
  if (g && mode !== 'title' && !overlay) {
    const p = g.player;
    const dive = Math.abs(p.vz) > 0.8 ? (Math.abs(p.vz) - 0.8) * 1.2 : 0;   // hull vibration while diving
    x += (Math.random() * 2 - 1) * dive;
    y += (Math.random() * 2 - 1) * dive;
  }
  FX.shakeX = x; FX.shakeY = y; FX.shakeRot = rot;
  FX.flash = Math.max(0, FX.flash - dt * 1.8);
}

function handleEvents(g) {
  const p = g.player;
  for (const e of g.events) {
    switch (e.type) {
      case 'launch':
        Sound.launch();
        addShake(7, 0.45, 40);
        flash('255,255,255', 0.08);
        break;
      case 'explosion': {
        const v = clamp(1 - e.dist / 9000, 0.08, 1);
        Sound.boom(v * (e.big ? 1 : 0.8), e.big);
        if (e.dist < 4000) addShake(4 * v, 1.2, 6);
        break;
      }
      case 'sunk':
        Sound.breakup(clamp(1 - e.dist / 8000, 0.1, 0.7));
        break;
      case 'charge': {
        const v = clamp(1 - e.dist / 1500, 0.05, 1);
        Sound.charge(v, e.dist < 800);
        addShake(clamp(600 / Math.max(e.dist, 20), 0, 30), 1.4, 9);
        if (e.dist < 200) addShake(clamp(300 / Math.max(e.dist, 10), 0, 18), 0.4, 40);
        if (e.damage > 0.5) flash('255,59,48', clamp(e.damage / 40, 0.15, 0.6));
        else if (e.dist < 150) flash('255,255,255', 0.15);
        break;
      }
      case 'shellHit':
        Sound.boom(0.9, false);
        addShake(16, 0.6, 40);
        flash('255,59,48', 0.4);
        break;
      case 'deckGun':
        Sound.deckGun();
        addShake(6, 0.35, 40);
        flash('255,240,200', 0.07);
        break;
      case 'shellOnTarget': Sound.boom(clamp(0.45 * (1 - e.dist / 5000), 0.08, 0.45), false); break;
      case 'splash': Sound.splash(clamp(1 - e.dist / 600, 0.1, 0.8)); if (e.dist < 60) addShake(4, 0.3, 30); break;
      case 'gun': Sound.gun(clamp(1 - e.dist / 7000, 0.1, 0.6)); break;
      case 'dud': Sound.clunk(clamp(1 - e.dist / 6000, 0.15, 0.8)); break;
      case 'ping': Sound.ping(0.5, 1180); break;
      case 'echo': Sound.ping(clamp(0.35 * (1 - e.dist / SONAR_RANGE), 0.05, 0.35), 1180, true); break;
      case 'enemyPing': Sound.ping(clamp(0.45 * (1 - e.dist / 4000), 0.04, 0.45), 880); break;
      case 'klaxon': Sound.klaxon(); addShake(3, 2, 4); break;
      case 'creak': Sound.creak(clamp((e.depth - 150) / 130, 0.1, 1)); addShake(2, 1, 3); break;
      case 'detected': Sound.alarm(); break;
      case 'periscope': Sound.periscope(); break;
      case 'chargesAway': break;
      case 'patrol':
        if (g.patrol > 1) Sound.ping(0.25, 660);
        if (mode === 'play') { overlay = 'briefing'; briefingT = performance.now(); }
        break;
      case 'enemyLaunch': Sound.launch(clamp(1 - e.dist / 5000, 0.15, 0.6)); Sound.alarm(); break;
      case 'torpedoHit':
        Sound.boom(1, true);
        addShake(28, 1.6, 40);
        addShake(14, 2.5, 6);
        flash('255,59,48', 0.7);
        break;
      case 'mine':
        Sound.charge(1);
        addShake(26, 1.5, 40);
        flash('255,154,42', 0.6);
        break;
      case 'aircraft': Sound.alarm(); break;
      case 'planeAttack': break;
      case 'planeDrop': Sound.splash(clamp(1 - e.dist / 2000, 0.1, 0.6)); break;
      case 'patrolEnd': if (e.won) urlRecord(g, true); break;
      case 'destroyed':
        Sound.boom(1, true);
        Sound.breakup(1);
        addShake(30, 3, 7);
        addShake(14, 1, 40);
        flash('255,59,48', 0.8);
        break;
    }
  }
  g.events.length = 0;
  INK = p.alive && p.hull < 30 ? 'red' : 'green';
}

/* ---------- sound (WebAudio, everything synthesized) ---------- */
const Sound = {
  ac: null, master: null, enabled: true, noiseBuf: null, amb: null,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ac = new AC();
    } catch (e) { return; }
    const ac = this.ac;
    this.master = ac.createGain();
    this.master.gain.value = this.enabled ? 0.7 : 0;
    this.master.connect(ac.destination);
    const len = ac.sampleRate * 2;
    this.noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    // ambient: engine and hydrophone propeller churn
    const engSrc = this.noiseSrc(true);
    const engF = ac.createBiquadFilter(); engF.type = 'lowpass'; engF.frequency.value = 120;
    const engG = ac.createGain(); engG.gain.value = 0;
    engSrc.connect(engF).connect(engG).connect(this.master);
    const chSrc = this.noiseSrc(true);
    const chF = ac.createBiquadFilter(); chF.type = 'bandpass'; chF.frequency.value = 320; chF.Q.value = 1.5;
    const chAm = ac.createGain(); chAm.gain.value = 0.5;
    const lfo = ac.createOscillator(); lfo.frequency.value = 5;
    const lfoG = ac.createGain(); lfoG.gain.value = 0.5;
    lfo.connect(lfoG).connect(chAm.gain);
    const chG = ac.createGain(); chG.gain.value = 0;
    chSrc.connect(chF).connect(chAm).connect(chG).connect(this.master);
    lfo.start();
    // aircraft engine drone
    const drone = ac.createOscillator(); drone.type = 'sawtooth'; drone.frequency.value = 85;
    const drone2 = ac.createOscillator(); drone2.type = 'sawtooth'; drone2.frequency.value = 88;
    const dF = ac.createBiquadFilter(); dF.type = 'lowpass'; dF.frequency.value = 400;
    const dG = ac.createGain(); dG.gain.value = 0;
    drone.connect(dF); drone2.connect(dF); dF.connect(dG).connect(this.master);
    drone.start(); drone2.start();
    // enemy torpedo propeller whine
    const whine = ac.createOscillator(); whine.type = 'triangle'; whine.frequency.value = 1900;
    const wG = ac.createGain(); wG.gain.value = 0;
    whine.connect(wG).connect(this.master);
    whine.start();
    // storm wind
    const wind = this.noiseSrc(true);
    const wiF = ac.createBiquadFilter(); wiF.type = 'bandpass'; wiF.frequency.value = 700; wiF.Q.value = 0.6;
    const wiG = ac.createGain(); wiG.gain.value = 0;
    wind.connect(wiF).connect(wiG).connect(this.master);
    // an escort's propellers passing overhead: a beating thrum with a Doppler shift
    const sc1 = ac.createOscillator(); sc1.type = 'sawtooth'; sc1.frequency.value = 62;
    const sc2 = ac.createOscillator(); sc2.type = 'square'; sc2.frequency.value = 31;
    const scN = this.noiseSrc(true);
    const scBP = ac.createBiquadFilter(); scBP.type = 'bandpass'; scBP.frequency.value = 520; scBP.Q.value = 2;
    const scLP = ac.createBiquadFilter(); scLP.type = 'lowpass'; scLP.frequency.value = 700;
    const scAm = ac.createGain(); scAm.gain.value = 0.5;
    const scLfo = ac.createOscillator(); scLfo.type = 'square'; scLfo.frequency.value = 8;
    const scLfoG = ac.createGain(); scLfoG.gain.value = 0.5;
    scLfo.connect(scLfoG).connect(scAm.gain);
    const scG = ac.createGain(); scG.gain.value = 0;
    sc1.connect(scLP); sc2.connect(scLP); scN.connect(scBP).connect(scLP);
    scLP.connect(scAm).connect(scG).connect(this.master);
    sc1.start(); sc2.start(); scLfo.start();
    this.amb = { engF, engG, chG, lfo, dG, drone, wG, whine, wiG, wiF, sc1, sc2, scBP, scLfo, scG };
    this.creakT = 0;
    this.lastUpd = 0;
  },
  toggle() {
    this.enabled = !this.enabled;
    if (this.master) this.master.gain.setTargetAtTime(this.enabled ? 0.7 : 0, this.ac.currentTime, 0.05);
  },
  noiseSrc(loop) {
    const s = this.ac.createBufferSource();
    s.buffer = this.noiseBuf;
    s.loop = !!loop;
    if (loop) s.start(0, Math.random() * 1.5);
    return s;
  },
  env(g, t, attack, peak, decay) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  },
  ok() { return this.ac && this.enabled; },
  ping(vol, freq, short) {
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime;
    const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
    const g = ac.createGain();
    this.env(g, t, 0.006, vol, short ? 0.35 : 1.6);
    const dl = ac.createDelay(); dl.delayTime.value = 0.31;
    const fb = ac.createGain(); fb.gain.value = 0.33;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
    o.connect(g); g.connect(lp).connect(this.master);
    g.connect(dl); dl.connect(fb).connect(dl); dl.connect(lp);
    o.start(t); o.stop(t + 3);
  },
  boom(vol, big) {
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime;
    const n = this.noiseSrc(false);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(big ? 900 : 600, t);
    lp.frequency.exponentialRampToValueAtTime(80, t + (big ? 3 : 1.8));
    const g = ac.createGain();
    this.env(g, t, 0.01, vol * 0.9, big ? 3.2 : 2);
    n.connect(lp).connect(g).connect(this.master);
    n.start(t); n.stop(t + 4);
    const o = ac.createOscillator(); o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(22, t + 1.5);
    const og = ac.createGain(); this.env(og, t, 0.01, vol * 0.8, 1.5);
    o.connect(og).connect(this.master);
    o.start(t); o.stop(t + 2);
  },
  // The click of a depth-charge pistol, heard just before a close one goes off.
  pistol(vol) {
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime;
    for (const [dt, f] of [[0, 2600], [0.035, 1900]]) {
      const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = f;
      const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1200;
      const g = ac.createGain(); this.env(g, t + dt, 0.001, 0.25 * vol, 0.04);
      o.connect(hp).connect(g).connect(this.master);
      o.start(t + dt); o.stop(t + dt + 0.08);
    }
  },
  charge(vol, click) {
    if (!this.ok()) return;
    if (click) { this.pistol(vol); setTimeout(() => this.charge(vol, false), 180); return; }
    const ac = this.ac, t = ac.currentTime;
    const n = this.noiseSrc(false);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 160 + vol * 300;
    const g = ac.createGain(); this.env(g, t, 0.005, vol, 3.5);
    n.connect(lp).connect(g).connect(this.master);
    n.start(t); n.stop(t + 4);
    const o = ac.createOscillator(); o.frequency.setValueAtTime(48, t); o.frequency.exponentialRampToValueAtTime(18, t + 2);
    const og = ac.createGain(); this.env(og, t, 0.005, vol, 2.2);
    o.connect(og).connect(this.master);
    o.start(t); o.stop(t + 2.5);
    if (vol > 0.5) {                                  // the hull rings
      const m = ac.createOscillator(); m.type = 'triangle'; m.frequency.value = 210;
      const mg = ac.createGain(); this.env(mg, t + 0.05, 0.01, 0.12 * vol, 1.2);
      m.connect(mg).connect(this.master);
      m.start(t); m.stop(t + 1.5);
    }
  },
  launch(vol) {
    if (!this.ok()) return;
    vol = vol === undefined ? 1 : vol;
    const ac = this.ac, t = ac.currentTime;
    const o = ac.createOscillator(); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(35, t + 0.35);
    const og = ac.createGain(); this.env(og, t, 0.005, 0.8 * vol, 0.4);
    o.connect(og).connect(this.master);
    o.start(t); o.stop(t + 0.6);
    const n = this.noiseSrc(false);
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(1400, t); bp.frequency.exponentialRampToValueAtTime(200, t + 1.4);
    const g = ac.createGain(); this.env(g, t, 0.02, 0.5 * vol, 1.4);
    n.connect(bp).connect(g).connect(this.master);
    n.start(t); n.stop(t + 2);
  },
  clunk(vol) {
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime;
    for (const f of [310, 467]) {
      const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = f;
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
      const g = ac.createGain(); this.env(g, t, 0.002, vol * 0.2, 0.25);
      o.connect(lp).connect(g).connect(this.master);
      o.start(t); o.stop(t + 0.4);
    }
  },
  klaxon() {
    if (!this.ok()) return;
    const ac = this.ac;
    for (let i = 0; i < 3; i++) {
      const t = ac.currentTime + i * 0.75;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(330, t); o.frequency.linearRampToValueAtTime(520, t + 0.5);
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.18, t + 0.05);
      g.gain.setValueAtTime(0.18, t + 0.5); g.gain.linearRampToValueAtTime(0.0001, t + 0.6);
      o.connect(lp).connect(g).connect(this.master);
      o.start(t); o.stop(t + 0.65);
    }
  },
  alarm() {
    if (!this.ok()) return;
    const ac = this.ac;
    for (let i = 0; i < 6; i++) {
      const t = ac.currentTime + i * 0.16;
      const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = 760;
      const g = ac.createGain(); this.env(g, t, 0.003, 0.08, 0.12);
      o.connect(g).connect(this.master);
      o.start(t); o.stop(t + 0.15);
    }
  },
  creak(vol) {
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime;
    const o = ac.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(55 + Math.random() * 30, t);
    o.frequency.linearRampToValueAtTime(40 + Math.random() * 60, t + 1.6);
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 9;
    bp.frequency.setValueAtTime(250, t); bp.frequency.exponentialRampToValueAtTime(900, t + 1.6);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.35 * vol, t + 0.4); g.gain.linearRampToValueAtTime(0.0001, t + 1.7);
    o.connect(bp).connect(g).connect(this.master);
    o.start(t); o.stop(t + 1.8);
  },
  breakup(vol) {
    if (!this.ok()) return;
    for (let i = 0; i < 3; i++) setTimeout(() => this.creak(vol), i * 700 + Math.random() * 400);
    setTimeout(() => this.boom(vol * 0.5, false), 1800);
  },
  splash(vol) {
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime;
    const n = this.noiseSrc(false);
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
    const g = ac.createGain(); this.env(g, t, 0.01, vol * 0.4, 0.7);
    n.connect(hp).connect(g).connect(this.master);
    n.start(t); n.stop(t + 1);
  },
  gun(vol) {
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime;
    const n = this.noiseSrc(false);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = ac.createGain(); this.env(g, t, 0.005, vol * 0.5, 0.5);
    n.connect(lp).connect(g).connect(this.master);
    n.start(t); n.stop(t + 0.7);
  },
  // 88 mm: a sharp crack, a heavy thump and an echo across the water.
  deckGun() {
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime;
    const n = this.noiseSrc(false);
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 700;
    const g = ac.createGain(); this.env(g, t, 0.002, 0.7, 0.18);
    n.connect(hp).connect(g).connect(this.master);
    n.start(t); n.stop(t + 0.4);
    const n2 = this.noiseSrc(false);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(700, t); lp.frequency.exponentialRampToValueAtTime(90, t + 1.2);
    const g2 = ac.createGain(); this.env(g2, t, 0.004, 0.8, 1.3);
    const dl = ac.createDelay(); dl.delayTime.value = 0.42;
    const fb = ac.createGain(); fb.gain.value = 0.28;
    n2.connect(lp).connect(g2).connect(this.master);
    g2.connect(dl); dl.connect(fb).connect(dl); dl.connect(this.master);
    n2.start(t); n2.stop(t + 2.5);
    const o = ac.createOscillator(); o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.5);
    const og = ac.createGain(); this.env(og, t, 0.003, 0.9, 0.55);
    o.connect(og).connect(this.master);
    o.start(t); o.stop(t + 0.7);
  },
  // A quiet groan of the pressure hull, or a drip: what you hear in silent running.
  hullNoise(depth) {
    if (!this.ok()) return;
    if (Math.random() < 0.35) {
      const ac = this.ac, t = ac.currentTime;
      const o = ac.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(1400 + Math.random() * 600, t); o.frequency.exponentialRampToValueAtTime(700, t + 0.12);
      const g = ac.createGain(); this.env(g, t, 0.002, 0.05, 0.25);
      o.connect(g).connect(this.master);
      o.start(t); o.stop(t + 0.4);
    } else this.creak(clamp(0.12 + depth / 500, 0.12, 0.45));
  },
  periscope() {
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime;
    const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 95;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 300;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.08, t + 0.1); g.gain.linearRampToValueAtTime(0.0001, t + 0.9);
    o.connect(lp).connect(g).connect(this.master);
    o.start(t); o.stop(t + 1);
  },
  update(g) {
    if (!this.ac || !this.amb) return;
    const t = this.ac.currentTime;
    let eng = 0, engF = 120, churn = 0, rate = 5, droneV = 0, whineV = 0, windV = 0, screwV = 0, screwF = 1, screwRate = 8;
    const dtR = this.lastUpd ? Math.min(0.2, t - this.lastUpd) : 0;
    this.lastUpd = t;
    if (g && mode === 'play' && !overlay && g.player.alive) {
      const p = g.player;
      for (const pl of g.planes) {
        const d = dist2d(p.x, p.y, pl.x, pl.y);
        if (d < 5000) droneV = Math.max(droneV, 0.12 * (1 - d / 5000) ** 1.5 * (p.depth > PERISCOPE_MAX ? 0.25 : 1));
      }
      for (const tp of g.torpedoes) {
        if (tp.owner !== 'enemy') continue;
        const d = dist2d(p.x, p.y, tp.x, tp.y);
        if (d < 3000) whineV = Math.max(whineV, 0.05 * (1 - d / 3000) ** 2);
      }
      if (g.cond.sea === 'storm') windV = p.depth <= PERISCOPE_MAX ? (p.depth < SURFACED_DEPTH ? 0.12 : 0.05) : 0.01;
      const surf = p.depth <= SURFACED_DEPTH;
      eng = surf ? 0.08 + Math.abs(p.speed) / 17 * 0.12 : Math.abs(p.speed) / 7.6 * 0.05;
      engF = surf ? 90 + Math.abs(p.speed) * 6 : 300 + Math.abs(p.speed) * 40;
      let best = null, bd = 1e9;
      for (const s of g.ships) {
        if (s.sinking) continue;
        const d = dist2d(p.x, p.y, s.x, s.y);
        if (d < bd) { bd = d; best = s; }
      }
      if (best && bd < 4500) {
        churn = 0.22 * (1 - bd / 4500) ** 1.5 * (p.depth > SURFACED_DEPTH ? 1 : 0.4);
        rate = 2 + best.speed * 0.45;
      }
      // the nearest escort's screws, loud when it runs over the boat, pitch falling as it passes
      if (p.depth > SURFACED_DEPTH) {
        let es = null, ed = 1e9;
        for (const s of g.ships) {
          if (s.role !== 'escort' || s.sinking) continue;
          const d = dist2d(p.x, p.y, s.x, s.y);
          if (d < ed) { ed = d; es = s; }
        }
        if (es && ed < 1600) {
          const vx = Math.sin(es.heading * DEG) * es.speed * KN - Math.sin(p.heading * DEG) * p.speed * KN;
          const vy = Math.cos(es.heading * DEG) * es.speed * KN - Math.cos(p.heading * DEG) * p.speed * KN;
          const vr = ((es.x - p.x) * vx + (es.y - p.y) * vy) / Math.max(ed, 1);   // > 0 going away
          screwF = clamp(1 - vr / 40, 0.7, 1.35);
          screwV = 0.32 * (1 - ed / 1600) ** 2 * (ed < 300 ? 1.4 : 1);
          screwRate = 3 + es.speed * 0.55;
        }
        // silent running: you hear the hull
        if (p.silent && p.depth > 40 && dtR > 0) {
          this.creakT -= dtR;
          if (this.creakT <= 0) { this.creakT = 2.5 + Math.random() * 6; this.hullNoise(p.depth); }
        }
      }
    }
    this.amb.engG.gain.setTargetAtTime(eng, t, 0.3);
    this.amb.engF.frequency.setTargetAtTime(engF, t, 0.3);
    this.amb.chG.gain.setTargetAtTime(churn, t, 0.4);
    this.amb.lfo.frequency.setTargetAtTime(rate, t, 0.5);
    this.amb.dG.gain.setTargetAtTime(droneV, t, 0.3);
    this.amb.wG.gain.setTargetAtTime(whineV, t, 0.2);
    this.amb.whine.frequency.setTargetAtTime(1800 + whineV * 6000, t, 0.2);
    this.amb.wiG.gain.setTargetAtTime(windV, t, 0.8);
    this.amb.wiF.frequency.setTargetAtTime(500 + Math.sin(t * 0.7) * 250, t, 0.5);
    this.amb.scG.gain.setTargetAtTime(screwV, t, 0.25);
    this.amb.sc1.frequency.setTargetAtTime(62 * screwF, t, 0.3);
    this.amb.sc2.frequency.setTargetAtTime(31 * screwF, t, 0.3);
    this.amb.scBP.frequency.setTargetAtTime(520 * screwF, t, 0.3);
    this.amb.scLfo.frequency.setTargetAtTime(screwRate * screwF, t, 0.3);
  },
};

/* ---------- progress in the URL ----------
   The best score and the highest patrol completed live in the address (#best=…&patrol=…), so a
   bookmark or a shared link keeps them. The AI captain's patrols do not count. */
function urlRead() {
  try {
    const q = new URLSearchParams(window.location.hash.slice(1));
    return { best: Math.max(0, parseInt(q.get('best'), 10) || 0), patrol: clamp(parseInt(q.get('patrol'), 10) || 0, 0, 999) };
  } catch (e) { return { best: 0, patrol: 0 }; }
}
let urlProgress = urlRead();
function urlRecord(g, patrolWon) {
  if (g.ai.used) return;
  let changed = false;
  const sc = score(g);
  if (sc > urlProgress.best) { urlProgress.best = sc; changed = true; }
  if (patrolWon && g.patrol > urlProgress.patrol) { urlProgress.patrol = g.patrol; changed = true; }
  if (!changed) return;
  try { window.history.replaceState(null, '', `#best=${urlProgress.best}&patrol=${urlProgress.patrol}`); } catch (e) { /* not available */ }
}
window.addEventListener('hashchange', () => { urlProgress = urlRead(); });

/* ---------- high scores ---------- */
const SCORE_KEY = 'uboot-zone.scores';
function loadScores() {
  try {
    const v = JSON.parse(window.localStorage.getItem(SCORE_KEY) || '[]');
    return Array.isArray(v) ? v : [];
  } catch (e) {
    return [];
  }
}

function saveScore(g) {
  urlRecord(g, false);
  if (g.ai.used) { g.scoreRank = -1; return; }      // the AI captain's patrols do not count
  const list = loadScores();
  const entry = { score: score(g), grt: g.stats.tonnage, patrol: g.patrol, diff: g.diff.name + (g.ai.guided ? ' GUIDED' : ''), date: new Date().toISOString().slice(0, 10), id: Date.now() };
  list.push(entry);
  const val = e => (e.score !== undefined ? e.score : e.grt);
  list.sort((a, b) => val(b) - val(a));
  const top = list.slice(0, 5);
  g.scoreRank = top.findIndex(s => s.id === entry.id);
  try { window.localStorage.setItem(SCORE_KEY, JSON.stringify(top)); } catch (e) { /* storage unavailable */ }
}

/* ---------- input ---------- */
const HOLD_KEYS = { KeyA: 'rudderLeft', KeyD: 'rudderRight', ArrowLeft: 'scopeLeft', ArrowRight: 'scopeRight', ShiftLeft: 'scopeFast', ShiftRight: 'scopeFast' };
const GAME_KEYS = new Set(['Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);

function newGame(ai, firstPatrol) {
  game = createGame({ difficulty: titleDifficulty, ai: ai || 'off', firstPatrol });
  mode = 'play';
  overlay = null;
  FX.shakes = [];
  briefingT = performance.now();
}

function onKeyDown(e) {
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  Sound.init();
  if (HOLD_KEYS[e.code]) input[HOLD_KEYS[e.code]] = true;
  if (e.repeat) return;
  const code = e.code;
  if (code === 'KeyM') { Sound.toggle(); return; }
  if (code === 'KeyG') { effectsLevel = (effectsLevel + 3) % 4; effectsChosen = true; effectsToast = performance.now(); return; }
  if (code === 'Equal' || code === 'NumpadAdd') { setUiScale(uiScale + UI_STEP); return; }
  if (code === 'Minus' || code === 'NumpadSubtract') { setUiScale(uiScale - UI_STEP); return; }

  if (mode === 'title') {
    if (overlay === 'help') { if (code === 'KeyH' || code === 'Escape') overlay = null; return; }
    if (overlay === 'blueprints') { blueprintKey(code); return; }
    if (code === 'KeyN') { overlay = 'blueprints'; return; }
    if (code === 'Digit1') titleDifficulty = 'easy';
    else if (code === 'Digit2') titleDifficulty = 'normal';
    else if (code === 'Digit3') titleDifficulty = 'hard';
    else if (code === 'KeyH') overlay = 'help';
    else if (code === 'Enter' || code === 'Space') newGame();
    else if (code === 'KeyC' && urlProgress.patrol > 0) newGame(null, urlProgress.patrol + 1);
    else if (code === 'KeyK') newGame('demo');
    else if (code === 'KeyO') newGame('guide');
    return;
  }
  if (mode === 'over') {
    if (code === 'Enter') newGame();
    else if (code === 'KeyK') newGame('demo');
    else if (code === 'KeyO') newGame('guide');
    else if (code === 'Escape') { mode = 'title'; game = null; overlay = null; }
    return;
  }
  // playing
  if (overlay) {
    if (overlay === 'blueprints') { blueprintKey(code); return; }
    if (overlay === 'briefing') {
      // ENTER: command yourself · K: the AI captain carries out these orders · O: with the first officer's guidance
      if (code === 'Enter' || code === 'Escape') { if (game.ai.mode === 'demo' && code === 'Enter') setAiMode(game, 'off'); overlay = null; }
      else if (code === 'KeyK') { setAiMode(game, 'demo'); overlay = null; }
      else if (code === 'KeyO') { setAiMode(game, 'guide'); overlay = null; }
      return;
    }
    if (overlay === 'pause' && code === 'KeyQ') {
      game.state = 'lost';
      game.lostReason = 'PATROL ABANDONED';
      saveScore(game);
      mode = 'over';
      overlay = null;
      return;
    }
    if (code === 'Escape' || (overlay === 'help' && code === 'KeyH') || (overlay === 'stats' && code === 'KeyI')) overlay = null;
    return;
  }
  const g = game;
  switch (code) {
    case 'Escape': overlay = 'pause'; return;
    case 'KeyH': overlay = 'help'; return;
    case 'KeyI': overlay = 'stats'; return;
    case 'KeyN': overlay = 'blueprints'; return;
    case 'KeyL': chartOn = !chartOn; return;
  }
  if (chartOn && (code === 'ArrowUp' || code === 'ArrowDown')) {
    chartScale = clamp(chartScale + (code === 'ArrowUp' ? -1 : 1), 0, CHART_SCALES.length - 1);
    return;
  }
  switch (code) {
    case 'KeyK': setAiMode(g, g.ai.mode === 'demo' ? 'off' : 'demo'); return;
    case 'KeyO': setAiMode(g, g.ai.mode === 'guide' ? 'off' : 'guide'); return;
  }
  if (g.ai.mode === 'demo') {
    // The AI captain has the conn: the boat's controls are his until K is pressed.
    if (g.realTime - (g.ai.blockedMsgT || -10) > 3) { say(g, 'THE AI CAPTAIN HAS THE CONN · PRESS K TO TAKE COMMAND', 'blue'); g.ai.blockedMsgT = g.realTime; }
    return;
  }
  switch (code) {
    case 'KeyW': command(g, 'engineUp'); break;
    case 'KeyS': command(g, 'engineDown'); break;
    case 'KeyR': command(g, 'depthUp'); break;
    case 'KeyF': command(g, 'depthDown'); break;
    case 'KeyC': command(g, 'crashDive'); break;
    case 'KeyP': command(g, 'periscope'); break;
    case 'ArrowUp': command(g, 'zoomIn'); break;
    case 'ArrowDown': command(g, 'zoomOut'); break;
    case 'KeyB': command(g, 'scopeToBow'); break;
    case 'KeyV': command(g, 'steerToScope'); break;
    case 'KeyE': command(g, 'gun'); break;
    case 'KeyT': command(g, 'lock'); break;
    case 'Space': command(g, 'fire'); break;
    case 'Tab': command(g, 'ping'); break;
    case 'KeyX': command(g, 'silent'); break;
    case 'Digit1': case 'Digit2': case 'Digit3': case 'Digit4': case 'Digit5':
      command(g, 'tube', Number(code.slice(5)) - 1);
      break;
  }
}

function blueprintKey(code) {
  const n = BLUEPRINTS.length;
  if (code === 'ArrowRight' || code === 'KeyD') bpIndex = (bpIndex + 1) % n;
  else if (code === 'ArrowLeft' || code === 'KeyA') bpIndex = (bpIndex + n - 1) % n;
  else if (code === 'KeyN' || code === 'Escape') overlay = null;
}

function onKeyUp(e) {
  if (HOLD_KEYS[e.code]) input[HOLD_KEYS[e.code]] = false;
}

// Demo mode compresses time while nothing much is happening.
function timeFactor(g) {
  if (!g || g.ai.mode !== 'demo' || !g.ai.plan || g.state !== 'playing') return 1;
  const ph = g.ai.plan.phase, th = g.ai.threats;
  const quiet = !g.detected && !(th && (th.charge || th.torpedo || th.plane));
  if (!quiet) return 1;
  if (ph === 'approach' || ph === 'standby') return 4;
  if (ph === 'evade' && !g.charges.length) return 3;
  return 1;
}

/* ---------- main loop ---------- */
function render(dt) {
  const c = sctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.globalCompositeOperation = 'source-over';
  const fxl = EFFECT_LEVELS[effectsLevel];
  c.fillStyle = fxl ? `rgba(0,0,0,${fxl.wipe})` : '#000';
  c.fillRect(0, 0, W, H);
  c.save();
  c.translate(W / 2 + FX.shakeX, H / 2 + FX.shakeY);
  c.rotate(FX.shakeRot);
  c.translate(-W / 2, -H / 2);
  if (mode === 'title') {
    drawTitle(c, titleTime);
  } else if (game) {
    drawPeriscope(c, game, LAYOUT.view);
    drawBottom(c, game, LAYOUT.bottom);
    drawRight(c, game, LAYOUT.right);
    drawCommandLine(c, LAYOUT.cmd);
  }
  c.restore();
  if (performance.now() - uiToast < 1500) text(c, `TEXT SIZE ${Math.round(uiScale * 100)}%`, W / 2, H * 0.08, C.yellow, FS * 1.3, 'center');
  else if (performance.now() - effectsToast < 1500) text(c, `CRT EFFECTS: ${EFFECT_NAMES[effectsLevel]}`, W / 2, H * 0.08, C.yellow, FS * 1.3, 'center');
  if (overlay === 'briefing' && game) drawBriefing(c, game);
  else if (overlay === 'help') drawHelp(c);
  else if (overlay === 'blueprints') drawBlueprints(c);
  else if (overlay === 'stats' && game) drawStats(c, game, `PATROL REPORT · PATROL ${game.patrol}`);
  else if (overlay === 'pause') drawPause(c);
  if (mode === 'over' && game) drawStats(c, game, `U-BOOT LOST · ${game.lostReason}`, game.ai.used ? 'THE AI CAPTAIN COMMANDED: SCORE NOT RECORDED' : game.scoreRank >= 0 ? `NEW HIGH SCORE: #${game.scoreRank + 1}` : '');

  // present: phosphor glow, scanlines, flashes
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(scene, 0, 0);
  if (fxl) {
    gctx.globalCompositeOperation = 'source-over';
    gctx.clearRect(0, 0, glow.width, glow.height);
    gctx.filter = `blur(${fxl.blur}px)`;
    gctx.drawImage(scene, 0, 0, glow.width, glow.height);
    gctx.filter = 'none';
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = fxl.glow;
    ctx.drawImage(glow, 0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    if (scanPattern) {
      ctx.globalAlpha = fxl.scan;
      ctx.fillStyle = scanPattern;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 1;
    }
  }
  if (FX.flash > 0.01) {
    ctx.fillStyle = `rgba(${FX.flashColor},${FX.flash})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  if (game && mode === 'play' && INK === 'red') {
    ctx.fillStyle = `rgba(255,0,0,${0.05 + 0.04 * Math.sin(performance.now() / 200)})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

function frame(now) {
  const dt = lastFrame ? Math.min(0.1, (now - lastFrame) / 1000) : 1 / 60;
  lastFrame = now;
  titleTime += dt;
  if (overlay === 'briefing' && game && game.ai.mode === 'demo' && performance.now() - briefingT > 6000) overlay = null;
  if (game && (mode === 'play' || mode === 'over') && !overlay) {
    const k = timeFactor(game);
    for (let i = 0; i < k; i++) step(game, dt, mode === 'play' && game.ai.mode !== 'demo' ? input : {});
    handleEvents(game);
    if (mode === 'play' && game.state === 'lost' && game.realTime - game.lostAt > 4) {
      saveScore(game);
      mode = 'over';
    }
  }
  // A slow machine (no GPU canvas) gets the plain look instead of a low frame rate.
  if (mode === 'play' && !overlay && effectsLevel && !effectsChosen) {
    perf.ema += (dt - perf.ema) * 0.05;
    perf.t += dt;
    if (perf.t > 4 && perf.ema > 0.032) {
      effectsLevel = 0;
      effectsChosen = true;
      say(game, 'CRT EFFECTS OFF TO KEEP THE FRAME RATE · G TURNS THEM ON', 'yellow');
    }
  }
  updateFX(dt, game);
  Sound.update(game);
  render(dt);
  window.requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);
window.addEventListener('blur', () => { for (const k in input) input[k] = false; });
resize();
window.requestAnimationFrame(frame);
</script>
</body>
</html>
