      const x = cam.cx + (hash3(i, Math.floor(t * 3), 5) - 0.5) * cam.F * 1.6;
      const y = cam.cy + hash3(i, Math.floor(t * 3), 6) * cam.F * 0.3;
      line(c, x, y, x + 14, y - 3);
    }
    stroke(c, C.white, LW, 0.35);
  }

  // torpedo tracks
  for (const tp of g.torpedoes) {
    c.beginPath();
    for (const pt of tp.trail) {
      if (!project(cam, pt.x, pt.y, 0)) continue;
      const age = (g.time - pt.t) / 60;
      if (age > 1) continue;
      const s = clamp(cam.F / P.z * 1.5, 0.8, 4);
      c.rect(P.x - s / 2, P.y - s / 4, s, s / 2);
    }
    const enemy = tp.owner === 'enemy';
    c.fillStyle = enemy ? rgba('red', 0.8) : rgba('white', 0.55);
    c.fill();
    if (project(cam, tp.x, tp.y, 0)) {
      c.beginPath();
      c.arc(P.x, P.y, clamp(cam.F / P.z * 2, 1, 5), 0, TAU);
      c.fillStyle = enemy ? C.red : C.white;
      c.fill();
    }
  }

  // ships, far to near
  const vr = visualRange(g);
  const ships = g.ships.concat(g.planes)
    .map(s => ({ s, d: dist2d(cam.x, cam.y, s.x, s.y) }))
    .filter(o => o.d < (o.s.role === 'plane' ? Math.max(vr, 3000) : vr) && Math.abs(angleDiff(bearingTo(cam.x, cam.y, o.s.x, o.s.y), cam.yawDeg)) < cam.fov / 2 + Math.atan2(o.s.length, o.d) / DEG + 3)
    .sort((a, b) => b.d - a.d);
  for (const { s, d } of ships) {
    const near = Math.min(3000, vr * 0.4);
    const alpha = d < near ? 1 : lerp(1, 0.25, (d - near) / Math.max(1, vr - near));
    const hostile = s.ai ? s.ai.hasContact && !s.sinking : s.role === 'plane' && s.state === 'attack';
    drawShipModel(c, cam, s, hostile ? C.red : C[INK], alpha);
  }

  // searchlights: escorts that have us, after dark
  if (cond.time !== 'day') {
    for (const s of g.ships) {
      if (s.role !== 'escort' || s.sinking || !s.ai.hasContact) continue;
      const d = dist2d(s.x, s.y, p.x, p.y);
      if (d > 4000) continue;
      const sweep = Math.sin(t * 0.7 + s.id) * 120;
      const b = bearingTo(s.x, s.y, p.x, p.y) * DEG;
      if (!project(cam, s.x, s.y, 10)) continue;
      const sx = P.x, sy = P.y;
      // The beam ends on the water near us; when that point is behind the periscope, end it short.
      let a1 = null, a2 = null;
      for (const f of [1, 0.85, 0.7, 0.5]) {
        const tx = s.x + (p.x + Math.cos(b) * sweep - s.x) * f, ty = s.y + (p.y - Math.sin(b) * sweep - s.y) * f;
        const w = 40 * f, lx = Math.cos(b) * w, ly = -Math.sin(b) * w;
        a1 = project(cam, tx - lx, ty - ly, 0) ? [P.x, P.y] : null;
        a2 = project(cam, tx + lx, ty + ly, 0) ? [P.x, P.y] : null;
        if (a1 && a2) break;
      }
      if (!a1 || !a2) continue;
      c.beginPath();
      c.moveTo(sx, sy); c.lineTo(a1[0], a1[1]); c.lineTo(a2[0], a2[1]); c.closePath();
      c.fillStyle = rgba('yellow', 0.08);
      c.fill();
      stroke(c, C.yellow, LW, 0.5);
    }
  }

  drawEffects(c, g, cam);
  c.restore();

  // lock bracket and lead marker (scope-fixed, not rolled)
  const lock = p.lock;
  if (lock) {
    const s = g.ships.find(x => x.id === lock.id);
    if (s && project(cam, s.x, s.y, 8)) {
      const half = Math.max(14, (s.length / 2) / P.z * cam.F * 0.8);
      const hy = Math.max(10, 14 / P.z * cam.F);
      const x0 = P.x - half, x1 = P.x + half, y0 = P.y - hy, y1 = P.y + hy, k = 8;
      c.beginPath();
      line(c, x0, y0 + k, x0, y0); line(c, x0, y0, x0 + k, y0);
      line(c, x1 - k, y0, x1, y0); line(c, x1, y0, x1, y0 + k);
      line(c, x0, y1 - k, x0, y1); line(c, x0, y1, x0 + k, y1);
      line(c, x1 - k, y1, x1, y1); line(c, x1, y1, x1, y1 - k);
      stroke(c, C.yellow, LW * 1.5);
      text(c, s.name.toUpperCase(), P.x, y0 - FS * 0.8, C.yellow, FS * 0.85, 'center');
    }
    const sol = firingSolution(g);
    if (sol && g.diff.leadMarker) {
      const rb = angleDiff(sol.course, cam.yawDeg);
      if (Math.abs(rb) < cam.fov / 2) {
        const x = cam.cx + Math.tan(rb * DEG) * cam.F, y = cam.cy, k = FS * 0.6;
        c.beginPath();
        c.moveTo(x, y - k); c.lineTo(x + k, y); c.lineTo(x, y + k); c.lineTo(x - k, y); c.closePath();
        line(c, x, y + k, x, y + k * 3);
        stroke(c, C.yellow, LW * 1.6);
        text(c, 'LEAD', x, y + k * 4, C.yellow, FS * 0.8, 'center');
      }
    }
  }

  // periscope dipping under a wave
  if (cam.eye < 0.35) {
    const a = clamp((0.35 - cam.eye) / 0.8, 0, 1);
    c.fillStyle = `rgba(0,25,55,${0.75 * a})`;
    c.fillRect(r.x, r.y, r.w, r.h);
    c.beginPath();
    for (let i = 0; i < 9; i++) {
      const y = r.y + r.h * (1 - a) + i * r.h * 0.11;
      for (let x = r.x; x < r.x + r.w; x += 30) {
        const yy = y + Math.sin(x * 0.02 + t * 6 + i) * 8;
        if (x === r.x) c.moveTo(x, yy); else c.lineTo(x, yy);
      }
    }
    stroke(c, C.blue, LW, 0.6 * a);
  }
}

function drawEffects(c, g, cam) {
  for (const e of g.effects) {
    const f = e.t / e.dur;
    if (e.type === 'geyser') {
      const rise = f < 0.25 ? f / 0.25 : 1 - (f - 0.25) / 0.75 * 0.85;
      const hgt = e.height * rise;
      const rad = 2 + e.height * 0.18 * (0.5 + f);
      c.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * TAU + e.seed;
        const bx = e.x + Math.cos(a) * rad * 0.5, by = e.y + Math.sin(a) * rad * 0.5;
        const top = hgt * (0.65 + 0.35 * Math.sin(e.seed * 3 + i * 1.7));
        seg3(c, cam, bx, by, 0, e.x + Math.cos(a) * rad, e.y + Math.sin(a) * rad, top, true);
      }
      stroke(c, C.white, LW, 0.9 * (1 - f * 0.6));
    } else if (e.type === 'flash') {
      if (!project(cam, e.x, e.y, e.h)) continue;
      const k = (e.big ? 60 : 25) / P.z * cam.F * (0.4 + f);
      const s = clamp(k, 4, 260);
      c.beginPath();
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * TAU + f;
        const r0 = s * 0.2, r1 = s * (0.6 + 0.4 * ((i * 7) % 3) / 2);
        line(c, P.x + Math.cos(a) * r0, P.y + Math.sin(a) * r0, P.x + Math.cos(a) * r1, P.y + Math.sin(a) * r1);
      }
      stroke(c, f < 0.4 ? C.white : C.orange, LW * 1.6, 1 - f);
    } else if (e.type === 'debris') {
      for (const fr of e.frags) {
        if (fr.h < 0) continue;
        if (!project(cam, fr.x, fr.y, fr.h)) continue;
        const sc = cam.F / P.z;
        const cs = Math.cos(fr.rot), sn = Math.sin(fr.rot);
        c.beginPath();
        fr.pts.forEach((pt, i) => {
          const x = P.x + (pt[0] * cs - pt[1] * sn) * sc, y = P.y + (pt[0] * sn + pt[1] * cs) * sc;
          if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
        });
        c.closePath();
        stroke(c, fr.fire ? C.orange : C[INK], LW * 1.2, 1 - f * 0.7);
      }
    }
  }
}

function drawUnderwater(c, g, r, cam) {
  const p = g.player, t = g.realTime;
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  c.fillStyle = 'rgba(0,18,40,0.55)';
  c.fillRect(r.x, r.y, r.w, r.h);
  // light from the surface
  if (p.depth < 60) {
    const k = 1 - (p.depth - 10) / 50;
    const ys = r.y + r.h * 0.42 * k;
    c.beginPath();
    for (let x = r.x; x <= r.x + r.w; x += 24) {
      const y = ys + Math.sin(x * 0.015 + t * 1.5) * 6 + Math.sin(x * 0.041 - t) * 3;
      if (x === r.x) c.moveTo(x, y); else c.lineTo(x, y);
    }
    stroke(c, C.blue, LW * 1.4, 0.8 * k);
    c.beginPath();
    for (let i = 0; i < 14; i++) {
      const x = r.x + ((i * 137 + t * 12) % r.w);
      line(c, x, ys, x - r.h * 0.15, ys + r.h * (0.25 + 0.2 * Math.sin(i + t * 0.7)));
    }
    stroke(c, C.blue, LW, 0.18 * k);
  }
  // thermocline layer
  if (Math.abs(p.depth - THERMOCLINE) < 45) {
    const y = cy + (THERMOCLINE - p.depth) * (r.h / 90);
    c.beginPath();
    for (let x = r.x; x <= r.x + r.w; x += 20) {
      const yy = y + Math.sin(x * 0.01 + t * 0.5) * 5;
      if (x === r.x) c.moveTo(x, yy); else c.lineTo(x, yy);
    }
    c.setLineDash([10, 8]);
    stroke(c, C.blue, LW * 1.2, 0.8);
    c.setLineDash([]);
    text(c, 'THERMOCLINE', cx + r.w * 0.25, y - FS, C.blue, FS * 0.85, 'center');
  }
  // marine snow, world-anchored
  const cam2 = makeCamera(p.x, p.y, -p.depth, cam.yawDeg, cam.F, cx, cy);
  c.beginPath();
  for (let i = 0; i < 180; i++) {
    const box = 120;
    const px = p.x + ((((hash3(i, 1, 9) * box - p.x) % box) + box) % box) - box / 2;
    const py = p.y + ((((hash3(i, 2, 9) * box - p.y) % box) + box) % box) - box / 2;
    const ph = -p.depth + ((((hash3(i, 3, 9) * 60 + p.depth + t * 0.3) % 60) + 60) % 60) - 30;
    if (!project(cam2, px, py, ph)) continue;
    const s = clamp(cam.F / P.z * 0.25, 0.6, 3);
    c.rect(P.x, P.y, s, s);
  }
  c.fillStyle = rgba('green', 0.5);
  c.fill();
  // moored mines: a sphere with horns on a cable
  for (const m of g.mines) {
    if (Math.abs(m.x - p.x) > 300 || Math.abs(m.y - p.y) > 300) continue;
    if (!project(cam2, m.x, m.y, -m.depth)) continue;
    const s = clamp(cam.F / P.z * 1.2, 2, 40);
    c.beginPath();
    c.arc(P.x, P.y, s, 0, TAU);
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU;
      line(c, P.x + Math.cos(a) * s, P.y + Math.sin(a) * s, P.x + Math.cos(a) * s * 1.45, P.y + Math.sin(a) * s * 1.45);
    }
    const mx = P.x, my = P.y;
    if (project(cam2, m.x, m.y, -m.depth - 60)) line(c, mx, my + s, P.x, P.y);
    stroke(c, C.orange, LW * 1.3, clamp(1.3 - P.z / 300, 0.2, 1));
  }
  // enemy torpedoes running shallow overhead
  for (const tp of g.torpedoes) {
    if (tp.owner !== 'enemy' || !project(cam2, tp.x, tp.y, -4)) continue;
    if (P.z > 500) continue;
    const s = clamp(cam.F / P.z * 1.2, 3, 50);
    c.beginPath();
    line(c, P.x - s, P.y, P.x + s, P.y);
    line(c, P.x - s, P.y - s * 0.15, P.x - s, P.y + s * 0.15);
    stroke(c, C.red, LW * 2);
  }
  // depth charges sinking nearby: a very bad sign
  for (const ch of g.charges) {
    if (!project(cam2, ch.x, ch.y, -ch.depth)) continue;
    if (P.z > 400) continue;
    const s = clamp(cam.F / P.z * 0.8, 3, 30);
    c.beginPath();
    c.rect(P.x - s / 2, P.y - s * 0.7, s, s * 1.4);
    line(c, P.x - s / 2, P.y - s * 0.3, P.x + s / 2, P.y - s * 0.3);
    line(c, P.x - s / 2, P.y + s * 0.3, P.x + s / 2, P.y + s * 0.3);
    stroke(c, C.yellow, LW * 1.4);
  }
  const why = !p.alive ? 'NO SIGNAL' : p.depth > PERISCOPE_MAX ? 'TOO DEEP FOR THE PERISCOPE' : 'PERISCOPE DOWN';
  text(c, why, cx, cy - FS * 1.2, rgba(INK, 0.55), FS * 1.8, 'center');
  if (p.alive) text(c, `DEPTH ${Math.round(p.depth)} M  ·  USE THE SONAR`, cx, cy + FS * 1.2, rgba(INK, 0.45), FS, 'center');
}

function drawReticle(c, g, r, cam) {
  const cx = r.x + r.w / 2, cy = cam.cy;
  const gap = FS * 1.2;
  const p = g.player;
  c.beginPath();
  line(c, r.x, cy, cx - gap, cy);
  line(c, cx + gap, cy, r.x + r.w, cy);
  line(c, cx, r.y + FS * 4.2, cx, cy - gap);
  line(c, cx, cy + gap, cx, r.y + r.h);
  const stepDeg = p.zoom ? 1 : 5;
  const half = cam.fov / 2;
  for (let d = stepDeg; d < half; d += stepDeg) {
    const dx = Math.tan(d * DEG) * cam.F;
    const big = p.zoom ? d % 5 === 0 : d % 10 === 0;
    const k = big ? FS * 0.9 : FS * 0.45;
    line(c, cx + dx, cy - k, cx + dx, cy);
    line(c, cx - dx, cy - k, cx - dx, cy);
  }
  // stadimeter ticks on the vertical line
  const sd = p.zoom ? 0.5 : 2;
  for (let i = 1; i <= 4; i++) {
    const dy = Math.tan(i * sd * DEG) * cam.F;
    line(c, cx - FS * 0.4, cy + dy, cx + FS * 0.4, cy + dy);
  }
  c.moveTo(cx + 3, cy);
  c.arc(cx, cy, 3, 0, TAU);
  stroke(c, C[INK], LW, 0.75);

  // compass tape
  const ty = r.y + FS * 2.4;
  c.beginPath();
  const tapeHalf = Math.min(r.w * 0.36, Math.tan(half * DEG) * cam.F);
  line(c, cx - tapeHalf, ty, cx + tapeHalf, ty);
  const tick = p.zoom ? 1 : 5, labelEvery = p.zoom ? 5 : 15;
  const start = Math.ceil((cam.yawDeg - half) / tick) * tick;
  for (let b = start; b <= cam.yawDeg + half; b += tick) {
    const x = cx + Math.tan(angleDiff(b, cam.yawDeg) * DEG) * cam.F;
    if (Math.abs(x - cx) > tapeHalf) continue;
    const major = wrap360(b) % labelEvery === 0;
    line(c, x, ty, x, ty - (major ? FS * 0.7 : FS * 0.35));
    if (major) text(c, pad3(b), x, ty - FS * 1.3, rgba(INK, 0.9), FS * 0.8, 'center');
  }
  c.moveTo(cx, ty + 2); c.lineTo(cx - 6, ty + 10); c.lineTo(cx + 6, ty + 10); c.closePath();
  stroke(c, C[INK], LW, 0.9);
  text(c, `TRUE ${pad3(cam.yawDeg)}°   REL ${p.scopeBearing >= 0 ? '+' : '-'}${String(Math.round(Math.abs(p.scopeBearing))).padStart(3, '0')}°   ${p.zoom ? 'HIGH POWER 6×' : 'LOW POWER 1.5×'}`,
    cx, ty + FS * 1.6, rgba(INK, 0.85), FS * 0.85, 'center');
}

function drawPeriscope(c, g, r) {
  const p = g.player;
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  const R = Math.max(r.w, r.h) / 2;
  const cam = periscopeCamera(g, r);
  c.save();
  c.beginPath(); c.rect(r.x, r.y, r.w, r.h); c.clip();
  c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.clip();
  const seeing = scopeAvailable(g) && cam.eye > -0.6;
  if (seeing) drawSea(c, g, r, cam);
  else drawUnderwater(c, g, r, cam);
  if (!p.alive) {                                   // dead periscope: static
    c.beginPath();
    for (let i = 0; i < 60; i++) {
      const y = r.y + Math.random() * r.h;
      line(c, r.x, y, r.x + r.w, y + (Math.random() - 0.5) * 6);
    }
    stroke(c, C.red, LW, 0.25);
  }
  // cracks in the glass
  if (p.cracks.length) {
    c.beginPath();
    for (const crack of p.cracks) {
      crack.forEach((pt, i) => {
        const x = cx + pt[0] * r.w / 2, y = cy + pt[1] * r.h / 2;
        if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
      });
    }
    stroke(c, C.white, LW * 1.2, 0.6);
  }
  if (seeing) drawReticle(c, g, r, cam);
  drawMessages(c, g, r);
  c.restore();

  // periscope frame
  c.save();
  c.beginPath(); c.rect(r.x - 2, r.y - 2, r.w + 4, r.h + 4); c.clip();
  c.beginPath(); c.arc(cx, cy, R, 0, TAU);
  stroke(c, C[INK], LW * 2.5, 0.9);
  c.restore();
  c.save();
  c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.clip();
  c.beginPath();
  line(c, r.x, r.y, r.x + r.w, r.y);
  line(c, r.x, r.y + r.h, r.x + r.w, r.y + r.h);
  stroke(c, C[INK], LW * 2.5, 0.9);
  c.restore();
}

function drawMessages(c, g, r) {
  const cx = r.x + r.w / 2;
  const msgs = g.messages.filter(m => g.realTime - m.t < 6).slice(-4);
  let y = r.y + r.h - FS * 1.6;
  for (let i = msgs.length - 1; i >= 0; i--) {
    const m = msgs[i];
    const age = g.realTime - m.t;
    const a = age > 5 ? 6 - age : 1;
    text(c, m.text, cx, y, rgba(m.color === 'green' ? INK : m.color, a), FS * 1.05, 'center');
    y -= FS * 1.5;
  }
  if (g.patrolState === 'ending' && g.state === 'playing') {
    text(c, `PATROL ${g.patrol} COMPLETE · NEXT CONVOY SOON`, cx, r.y + r.h * 0.3, rgba('yellow', 0.6 + 0.4 * Math.sin(g.realTime * 4)), FS * 1.4, 'center');
  }
}

/* ---------- instruments ---------- */
function dial(c, cx, cy, R, o) {
  const ang = v => ((o.a0 + (clamp(v, o.min, o.max) - o.min) / (o.max - o.min) * (o.a1 - o.a0)) - 90) * DEG;
  c.beginPath();
  c.arc(cx, cy, R, ang(o.min), ang(o.max));
  stroke(c, C[INK], LW * 1.3);
  for (const z of o.zones || []) {
    c.beginPath();
    c.arc(cx, cy, R * 0.9, ang(z.from), ang(z.to));
    stroke(c, C[z.color], LW * 4, 0.85);
  }
  c.beginPath();
  for (let v = o.min; v <= o.max + 1e-6; v += o.minor) {
    const a = ang(v), major = Math.abs(v / o.major - Math.round(v / o.major)) < 1e-6;
    const r0 = major ? R * 0.78 : R * 0.87;
    line(c, cx + Math.cos(a) * r0, cy + Math.sin(a) * r0, cx + Math.cos(a) * R, cy + Math.sin(a) * R);
  }
  stroke(c, C[INK], LW, 0.8);
  for (let v = o.min; v <= o.max + 1e-6; v += o.labelEvery) {
    const a = ang(v);
    text(c, String(v), cx + Math.cos(a) * R * 0.6, cy + Math.sin(a) * R * 0.6, rgba(INK, 0.75), FS * 0.65, 'center');
  }
  for (const n of o.needles) {
    const a = ang(n.v);
    c.beginPath();
    line(c, cx - Math.cos(a) * R * 0.12, cy - Math.sin(a) * R * 0.12, cx + Math.cos(a) * R * n.len, cy + Math.sin(a) * R * n.len);
    stroke(c, C[n.color], n.width || LW * 2);
  }
  c.beginPath();
  c.arc(cx, cy, Math.max(2, R * 0.05), 0, TAU);
  c.fillStyle = C[INK];
  c.fill();
}

function slotTitle(c, s, title, value, valueColor) {
  text(c, title, s.x + s.w / 2, s.y + FS * 0.7, rgba(INK, 0.8), FS * 0.8, 'center');
  if (value !== undefined) text(c, value, s.x + s.w / 2, s.y + s.h - FS * 0.7, valueColor || C[INK], FS, 'center');
}

function hbar(c, x, y, w, v, min, max, color, marker) {
  c.beginPath();
  c.rect(x, y - FS * 0.35, w, FS * 0.7);
  line(c, x + w * (0 - min) / (max - min), y - FS * 0.55, x + w * (0 - min) / (max - min), y + FS * 0.55);
  stroke(c, C[INK], LW, 0.7);
  const px = x + w * (clamp(v, min, max) - min) / (max - min);
  const zx = x + w * (clamp(0, min, max) - min) / (max - min);
  c.fillStyle = rgba(color, 0.6);
  c.fillRect(Math.min(zx, px), y - FS * 0.3, Math.abs(px - zx), FS * 0.6);
  if (marker !== undefined) {
    const mx = x + w * (clamp(marker, min, max) - min) / (max - min);
    c.beginPath();
    line(c, mx, y - FS * 0.6, mx, y + FS * 0.6);
    stroke(c, C.yellow, LW * 1.6);
  }
}

function vbar(c, x, y, w, h, frac, label) {
  const color = frac < 0.2 ? 'red' : frac < 0.4 ? 'yellow' : INK;
  c.beginPath();
  c.rect(x, y, w, h);
  stroke(c, C[INK], LW, 0.8);
  c.fillStyle = rgba(color, 0.65);
  c.fillRect(x + 2, y + h - (h - 4) * clamp(frac, 0, 1) - 2, w - 4, (h - 4) * clamp(frac, 0, 1));
  c.beginPath();
  for (let i = 1; i < 10; i++) line(c, x, y + h * i / 10, x + w * 0.25, y + h * i / 10);
  stroke(c, C[INK], LW, 0.5);
  text(c, label, x + w / 2, y - FS * 0.55, rgba(INK, 0.8), FS * 0.72, 'center');
  text(c, `${Math.round(frac * 100)}`, x + w / 2, y + h + FS * 0.6, C[color], FS * 0.8, 'center');
}

function drawBottom(c, g, r) {
  const p = g.player;
  c.beginPath();
  c.rect(r.x, r.y, r.w, r.h);
  stroke(c, C[INK], LW, 0.5);
  const weights = [1, 1, 1.15, 1, 1.2, 1.25];
  const total = weights.reduce((a, b) => a + b, 0);
  let x = r.x;
  const slots = weights.map(wt => {
    const s = { x, y: r.y, w: (r.w * wt) / total, h: r.h };
    x += s.w;
    return s;
  });
  c.beginPath();
  for (let i = 1; i < slots.length; i++) line(c, slots[i].x, r.y + 6, slots[i].x, r.y + r.h - 6);
  stroke(c, C[INK], LW, 0.25);
  const dialR = s => Math.min(s.w * 0.4, (s.h - FS * 3.2) / 2);
  const dcy = s => s.y + FS * 1.4 + dialR(s) + (s.h - FS * 2.8 - 2 * dialR(s)) / 2;

  // depth
  let s = slots[0];
  dial(c, s.x + s.w / 2, dcy(s), dialR(s), {
    min: 0, max: 300, a0: -135, a1: 135, major: 50, minor: 10, labelEvery: 100,
    zones: [{ from: SAFE_DEPTH, to: CRUSH_DEPTH, color: 'red' }, { from: CRUSH_DEPTH, to: 300, color: 'red' }, { from: THERMOCLINE - 3, to: THERMOCLINE + 3, color: 'blue' }],
    needles: [{ v: p.orderedDepth, color: 'yellow', len: 0.95, width: LW * 1.2 }, { v: p.depth, color: p.depth > SAFE_DEPTH ? 'red' : INK, len: 0.85 }],
  });
  slotTitle(c, s, 'DEPTH M', `${Math.round(p.depth)} / ${Math.round(p.orderedDepth)}`, p.depth > SAFE_DEPTH ? C.red : undefined);

  // speed
  s = slots[1];
  dial(c, s.x + s.w / 2, dcy(s), dialR(s), {
    min: -8, max: 20, a0: -135, a1: 135, major: 4, minor: 1, labelEvery: 4,
    zones: [{ from: -8, to: 0, color: 'yellow' }],
    needles: [{ v: p.speed, color: INK, len: 0.85 }],
  });
  slotTitle(c, s, 'SPEED KN', `${p.speed.toFixed(1)}`);

  // engine telegraph
  s = slots[2];
  {
    const R = Math.min(s.w * 0.44, s.h - FS * 3.4);
    const cx = s.x + s.w / 2, cy = s.y + FS * 1.6 + R;
    const n = TELEGRAPH.length;
    for (let i = 0; i < n; i++) {
      const a0 = Math.PI + (i / n) * Math.PI, a1 = Math.PI + ((i + 1) / n) * Math.PI;
      const on = i === p.telegraph;
      c.beginPath();
      c.moveTo(cx + Math.cos(a0) * R * 0.35, cy + Math.sin(a0) * R * 0.35);
      c.arc(cx, cy, R, a0, a1);
      c.lineTo(cx + Math.cos(a1) * R * 0.35, cy + Math.sin(a1) * R * 0.35);
      c.arc(cx, cy, R * 0.35, a1, a0, true);
      if (on) { c.fillStyle = rgba(i < TELEGRAPH_STOP ? 'yellow' : INK, 0.35); c.fill(); }
      stroke(c, on ? C[i < TELEGRAPH_STOP ? 'yellow' : INK] : C[INK], on ? LW * 1.8 : LW, on ? 1 : 0.45);
      const am = (a0 + a1) / 2;
      c.save();
      c.translate(cx + Math.cos(am) * R * 0.68, cy + Math.sin(am) * R * 0.68);
      c.rotate(am + Math.PI / 2);
      text(c, TELEGRAPH[i].short, 0, 0, on ? C.white : rgba(INK, 0.7), FS * 0.55, 'center');
      c.restore();
    }
    const maxKn = p.depth > SURFACED_DEPTH ? SUB.maxSubmerged : SUB.maxSurface;
    const frac = clamp(p.speed / maxKn, -0.5, 1);
    const idx = frac < 0 ? 2 + frac / 0.25 : frac <= 0.5 ? 2 + frac / 0.25 : frac <= 0.8 ? 4 + (frac - 0.5) / 0.3 : 5 + (frac - 0.8) / 0.2;
    const a = Math.PI + ((idx + 0.5) / n) * Math.PI;
    c.beginPath();
    line(c, cx, cy, cx + Math.cos(a) * R * 1.02, cy + Math.sin(a) * R * 1.02);
    stroke(c, C.white, LW * 1.4, 0.8);
  }
  slotTitle(c, s, 'ENGINE TELEGRAPH', `${TELEGRAPH[p.telegraph].name}${p.depth > SURFACED_DEPTH ? ' · E-MOTOR' : ' · DIESEL'}`, p.telegraph < TELEGRAPH_STOP ? C.yellow : undefined);

  // compass
  s = slots[3];
  {
    const R = dialR(s), cx = s.x + s.w / 2, cy = dcy(s);
    c.beginPath();
    c.arc(cx, cy, R, 0, TAU);
    for (let b = 0; b < 360; b += 10) {
      const a = (b - 90) * DEG, r0 = b % 30 === 0 ? R * 0.82 : R * 0.9;
      line(c, cx + Math.cos(a) * r0, cy + Math.sin(a) * r0, cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    }
    stroke(c, C[INK], LW, 0.8);
    for (const [lbl, b] of [['N', 0], ['E', 90], ['S', 180], ['W', 270]]) {
      const a = (b - 90) * DEG;
      text(c, lbl, cx + Math.cos(a) * R * 0.66, cy + Math.sin(a) * R * 0.66, lbl === 'N' ? C.red : rgba(INK, 0.8), FS * 0.75, 'center');
    }
    const ph = (viewHeading(g) - 90) * DEG;
    c.beginPath();
    line(c, cx, cy, cx + Math.cos(ph) * R * 0.95, cy + Math.sin(ph) * R * 0.95);
    c.setLineDash([3, 3]);
    stroke(c, C.yellow, LW * 1.3);
    c.setLineDash([]);
    const hh = (p.heading - 90) * DEG;
    const tip = [cx + Math.cos(hh) * R * 0.85, cy + Math.sin(hh) * R * 0.85];
    c.beginPath();
    c.moveTo(tip[0], tip[1]);
    c.lineTo(cx + Math.cos(hh + 2.8) * R * 0.3, cy + Math.sin(hh + 2.8) * R * 0.3);
    c.lineTo(cx + Math.cos(hh - 2.8) * R * 0.3, cy + Math.sin(hh - 2.8) * R * 0.3);
    c.closePath();
    stroke(c, C[INK], LW * 1.6);
  }
  slotTitle(c, s, 'HEADING', `${pad3(p.heading)}°`);

  // helm: rudder and planes
  s = slots[4];
  {
    const bx = s.x + s.w * 0.12, bw = s.w * 0.76;
    const y1 = s.y + s.h * 0.36, y2 = s.y + s.h * 0.66;
    text(c, `RUDDER ${p.rudder < -0.5 ? 'PORT' : p.rudder > 0.5 ? 'STBD' : 'MIDSHIPS'} ${Math.abs(Math.round(p.rudder))}°`, s.x + s.w / 2, y1 - FS * 1.05, rgba(INK, 0.85), FS * 0.72, 'center');
    hbar(c, bx, y1, bw, p.rudder, -SUB.rudderMax, SUB.rudderMax, INK);
    const vzText = Math.abs(p.vz) < 0.08 ? 'LEVEL' : p.vz > 0 ? `DIVING ${p.vz.toFixed(1)}` : `RISING ${(-p.vz).toFixed(1)}`;
    text(c, `PLANES ${vzText} M/S`, s.x + s.w / 2, y2 - FS * 1.05, p.crashDive ? C.red : rgba(INK, 0.85), FS * 0.72, 'center');
    hbar(c, bx, y2, bw, p.vz, -3, 3, p.vz > 0 ? 'blue' : INK);
  }
  slotTitle(c, s, 'HELM', `TURN ${p.turnRate >= 0 ? '+' : ''}${p.turnRate.toFixed(1)}°/S`);

  // power: battery, air, hull
  s = slots[5];
  {
    const bw = Math.min(s.w * 0.16, FS * 2.2), gapW = (s.w - 3 * bw) / 4;
    const by = s.y + FS * 2.2, bh = s.h - FS * 3.8;
    vbar(c, s.x + gapW, by, bw, bh, p.battery / 100, 'BATT');
    vbar(c, s.x + gapW * 2 + bw, by, bw, bh, p.air / 100, 'AIR');
    vbar(c, s.x + gapW * 3 + bw * 2, by, bw, bh, p.hull / 100, 'HULL');
  }
}

function lamp(c, x, y, w, h, label, on, color, blink) {
  const lit = on && (!blink || Math.sin(performance.now() / 120) > -0.2);
  c.beginPath();
  c.rect(x, y, w, h);
  if (lit) { c.fillStyle = rgba(color, 0.8); c.fill(); }
  stroke(c, lit ? C[color] : C[INK], lit ? LW * 1.5 : LW, lit ? 1 : 0.3);
  c.font = font(FS * 0.68, true);
  const tw = c.measureText(label).width;
  const size = tw > w - 4 ? FS * 0.68 * (w - 4) / tw : FS * 0.68;
  text(c, label, x + w / 2, y + h / 2 + 1, lit ? '#000' : rgba(INK, 0.3), size, 'center');
}

function drawSonar(c, g, cx, cy, R) {
  const p = g.player, so = g.sonar;
  const k = R / SONAR_RANGE;
  const toScreen = (x, y) => [cx + (x - p.x) * k, cy - (y - p.y) * k];
  c.beginPath();
  c.arc(cx, cy, R, 0, TAU);
  stroke(c, C[INK], LW * 1.6);
  c.beginPath();
  for (let i = 1; i < 6; i++) { c.moveTo(cx + R * i / 6, cy); c.arc(cx, cy, R * i / 6, 0, TAU); }
  line(c, cx - R, cy, cx + R, cy);
  line(c, cx, cy - R, cx, cy + R);
  stroke(c, C[INK], LW, 0.2);
  for (let b = 0; b < 360; b += 10) {
    const a = (b - 90) * DEG, r0 = b % 30 === 0 ? R * 0.93 : R * 0.965;
    c.beginPath();
    line(c, cx + Math.cos(a) * r0, cy + Math.sin(a) * r0, cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    stroke(c, C[INK], LW, 0.6);
  }
  text(c, 'N', cx, cy - R - FS * 0.6, C.red, FS * 0.75, 'center');
  c.save();
  c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.clip();
  // sweep beam with a fading trail
  for (let i = 0; i < 14; i++) {
    const a = (so.sweep - i * 2.2 - 90) * DEG;
    c.beginPath();
    line(c, cx, cy, cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    stroke(c, C[INK], LW * (i === 0 ? 2 : 1.5), i === 0 ? 0.9 : 0.35 * (1 - i / 14));
  }
  // own heading and periscope bearing
  const hh = (p.heading - 90) * DEG;
  c.beginPath();
  line(c, cx, cy, cx + Math.cos(hh) * R * 0.25, cy + Math.sin(hh) * R * 0.25);
  stroke(c, C.white, LW * 1.6);
  const ph = (viewHeading(g) - 90) * DEG;
  c.beginPath();
  line(c, cx, cy, cx + Math.cos(ph) * R, cy + Math.sin(ph) * R);
  c.setLineDash([2, 5]);
  stroke(c, C.yellow, LW, 0.6);
  c.setLineDash([]);
  // active ping ring
  if (so.ping) {
    c.beginPath();
    c.arc(cx, cy, so.ping.r * k, 0, TAU);
    stroke(c, C.white, LW * 1.5, 1 - so.ping.r / SONAR_RANGE * 0.7);
  }
  // blips
  const colors = { surface: INK, torpedo: 'red', charge: 'yellow', sub: 'blue', mine: 'orange' };
  for (const b of so.blips) {
    const age = g.realTime - b.t, ttl = b.active ? ACTIVE_TTL : PASSIVE_TTL;
    const a = clamp(1 - age / ttl, 0, 1);
    const [x, y] = toScreen(b.x, b.y);
    const col = colors[b.type];
    const rr = Math.hypot(x - cx, y - cy);
    if (rr > R) {
      const ang = Math.atan2(y - cy, x - cx);
      c.beginPath();
      line(c, cx + Math.cos(ang) * R * 0.9, cy + Math.sin(ang) * R * 0.9, cx + Math.cos(ang) * R, cy + Math.sin(ang) * R);
      stroke(c, C[col], LW * 3, a);
      continue;
    }
    if (b.type === 'mine') {
      const m = Math.max(2.5, FS * 0.22);
      c.beginPath();
      line(c, x - m, y - m, x + m, y + m);
      line(c, x - m, y + m, x + m, y - m);
      stroke(c, C.orange, LW, a);
      continue;
    }
    const s = b.active ? Math.max(3, FS * 0.3) : Math.max(2.5, FS * 0.25) + b.fuzz * k * 0.5;
    c.beginPath();
    if (b.active) c.rect(x - s / 2, y - s / 2, s, s);
    else c.arc(x, y, s, 0, TAU);
    c.fillStyle = rgba(col, a * (b.active ? 1 : 0.65));
    c.fill();
    if (p.lock && p.lock.id === b.id) {
      c.beginPath();
      c.arc(x, y, s + 5, 0, TAU);
      stroke(c, C.yellow, LW, a);
    }
  }
  c.restore();
  c.beginPath();
  c.arc(cx, cy, 2.5, 0, TAU);
  c.fillStyle = C.white;
  c.fill();
}

function drawRight(c, g, r) {
  const p = g.player;
  c.beginPath();
  c.rect(r.x, r.y, r.w, r.h);
  stroke(c, C[INK], LW, 0.5);
  const pad = FS * 0.7;
  const lh = FS * 1.3;
  let y = r.y + lh * 0.8;
  const pinging = !!g.sonar.ping;
  text(c, `SONAR · ${pinging ? 'ACTIVE PING' : 'PASSIVE'} · ${SONAR_RANGE / 1000} KM`, r.x + r.w / 2, y, pinging ? C.white : C[INK], FS * 0.85, 'center');
  const sr = Math.min(r.w / 2 - pad * 1.5, r.h * 0.2);
  y += lh * 0.6;
  drawSonar(c, g, r.x + r.w / 2, y + sr + FS * 0.6, sr);
  y += sr * 2 + FS * 1.6;

  // torpedo tubes
  c.beginPath(); line(c, r.x + pad, y, r.x + r.w - pad, y); stroke(c, C[INK], LW, 0.3);
  y += lh * 0.7;
  text(c, `TUBES · RESERVE ${p.reserve}`, r.x + pad, y, C[INK], FS * 0.85);
  y += lh;
  const tw = (r.w - pad * 2) / 5;
  p.tubes.forEach((t, i) => {
    const x = r.x + pad + tw * i + tw / 2;
    const rr = Math.min(tw * 0.28, FS * 0.8);
    const color = t.state === 'ready' ? INK : t.state === 'loading' ? 'yellow' : 'red';
    c.beginPath();
    c.arc(x, y + rr, rr, 0, TAU);
    if (t.state === 'ready') { c.fillStyle = rgba(color, 0.5); c.fill(); }
    stroke(c, C[color], LW * 1.4);
    if (t.state === 'loading') {
      c.beginPath();
      c.arc(x, y + rr, rr * 0.6, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - t.t / TORPEDO.reload));
      stroke(c, C.yellow, LW * 2);
    }
    if (i === p.selectedTube) {
      c.beginPath();
      c.rect(x - tw * 0.45, y - 3, tw * 0.9, rr * 2 + FS * 1.6);
      stroke(c, C.white, LW, 0.9);
    }
    text(c, i === 4 ? '5 AFT' : String(i + 1), x, y + rr * 2 + FS * 0.75, rgba(INK, 0.85), FS * 0.7, 'center');
  });
  y += Math.min(tw * 0.56, FS * 1.6) + FS * 2;
  const course = (() => {
    if (g.diff.autoSolution && p.lock) { const sol = firingSolution(g); if (sol) return sol.course; }
    return viewHeading(g);
  })();
  const rel = angleDiff(course, p.heading);
  const stern = p.selectedTube === 4;
  const arcOk = stern ? Math.abs(rel) >= 90 : Math.abs(rel) <= 90;
  const depthOk = p.depth <= TUBE_MAX_DEPTH;
  text(c, `GYRO ${pad3(course)}°`, r.x + pad, y, C[INK], FS * 0.8);
  text(c, arcOk ? 'IN ARC' : 'OUT OF ARC', r.x + r.w / 2 + pad, y, arcOk ? C[INK] : C.red, FS * 0.8);
  text(c, depthOk ? 'DEPTH OK' : 'TOO DEEP', r.x + r.w - pad, y, depthOk ? C[INK] : C.red, FS * 0.8, 'right');
  y += lh;

  // status lamps
  c.beginPath(); line(c, r.x + pad, y, r.x + r.w - pad, y); stroke(c, C[INK], LW, 0.3);
  y += lh * 0.4;
  const lamps = [
    ['SURFACED', p.depth <= SURFACED_DEPTH, 'green'],
    ['PERISCOPE', scopeAvailable(g), 'green'],
    ['SILENT', p.silent, 'blue'],
    ['DETECTED', g.detected, 'red', true],
    ['ASDIC', g.realTime - g.asdicNear < 1.2, 'yellow', true],
    ['DIESEL', p.depth <= SURFACED_DEPTH && p.alive, 'yellow'],
    ['BELOW LAYER', p.depth > THERMOCLINE, 'blue'],
    ['CRASH DIVE', p.crashDive, 'red', true],
    ['AIR LOW', p.air < 25, p.air < 10 ? 'red' : 'yellow', p.air < 10],
    ['BATT LOW', p.battery < 25, p.battery < 10 ? 'red' : 'yellow', p.battery < 10],
    ['HULL CRIT', p.hull < 30, 'red', true],
    ['DEPTH CRIT', p.depth > SAFE_DEPTH, 'red', true],
    ['TORPEDO', g.warn.torpedo, 'red', true],
    ['AIRCRAFT', g.warn.aircraft, 'red', true],
    ['MINES', g.warn.mines, 'orange', true],
    ['NIGHT', g.cond.time === 'night', 'blue'],
  ];
  const lw = (r.w - pad * 2 - 3 * 5) / 4, lhh = FS * 1.45;
  lamps.forEach((l, i) => {
    const col = i % 4, row = Math.floor(i / 4);
    lamp(c, r.x + pad + col * (lw + 5), y + row * (lhh + 4), lw, lhh, l[0], l[1], l[2], l[3]);
  });
  y += 4 * (lhh + 4) + lh * 0.5;

  // torpedo data computer
  c.beginPath(); line(c, r.x + pad, y, r.x + r.w - pad, y); stroke(c, C[INK], LW, 0.3);
  y += lh * 0.7;
  text(c, 'TORPEDO DATA COMPUTER', r.x + pad, y, C[INK], FS * 0.85);
  y += lh;
  const lock = p.lock;
  const s = lock && g.ships.find(x => x.id === lock.id);
  const fs = FS * 0.78;
  if (!s || !lock.obs) {
    text(c, 'NO TARGET · AIM AND PRESS T', r.x + pad, y, rgba(INK, 0.5), fs);
    y += lh * 3;
  } else {
    const o = lock.obs, sol = firingSolution(g);
    const unit = s.role === 'escort' ? 'T' : 'GRT';
    text(c, `${s.name.toUpperCase()}`, r.x + pad, y, C.yellow, fs);
    text(c, `${fmtInt(s.grt)} ${unit}`, r.x + r.w - pad, y, C.yellow, fs, 'right');
    y += lh * 0.9;
    const aobSide = o.aob >= 0 ? 'S' : 'P';
    const col2 = r.x + r.w / 2 + pad * 0.5;
    text(c, `RANGE ${fmtInt(o.range)} M`, r.x + pad, y, C[INK], fs);
    text(c, `SPEED ${o.speed.toFixed(1)} KN`, col2, y, C[INK], fs);
    y += lh * 0.9;
    text(c, `COURSE ${pad3(o.course)}°`, r.x + pad, y, C[INK], fs);
    text(c, `AOB ${Math.round(Math.abs(o.aob))}° ${aobSide}`, col2, y, C[INK], fs);
    y += lh * 0.9;
    if (sol) {
      const lead = angleDiff(sol.course, bearingTo(p.x, p.y, s.x, s.y));
      text(c, g.diff.leadMarker ? `LEAD ${pad3(sol.course)}° (${lead >= 0 ? '+' : ''}${lead.toFixed(0)}°)` : 'LEAD --- (HARD)', r.x + pad, y, C[INK], fs);
      text(c, `RUN ${Math.round(sol.time / TIME_SCALE)} S`, col2, y, C[INK], fs);
      y += lh * 0.9;
      text(c, sol.stale ? 'SOLUTION STALE · OBSERVE AGAIN' : g.diff.autoSolution ? 'SOLUTION OK · AUTO GYRO' : 'SOLUTION OK', r.x + pad, y, sol.stale ? C.yellow : C[INK], fs);
    } else {
      text(c, 'NO SOLUTION', r.x + pad, y, C.red, fs);
    }
    y += lh;
  }

  // score
  const sy = r.y + r.h - lh * 1.1;
  c.beginPath(); line(c, r.x + pad, sy - lh * 2.9, r.x + r.w - pad, sy - lh * 2.9); stroke(c, C[INK], LW, 0.3);
  const fitText = (str, yy, color, size) => {
    c.font = font(size, true);
    const w = c.measureText(str).width, max = r.w - pad * 2;
    text(c, str, r.x + pad, yy, color, w > max ? size * max / w : size);
  };
  fitText(`PATROL ${g.patrol} · ${g.mission.name}`, sy - lh * 2.1, C[INK], FS * 0.85);
  fitText(missionStatus(g), sy - lh * 1.05, C.yellow, FS * 0.8);
  text(c, conditionsText(g.cond), r.x + pad, sy, rgba(INK, 0.75), FS * 0.72);
  text(c, `${fmtInt(score(g))}`, r.x + r.w - pad, sy, C.yellow, FS, 'right');
}

const COMMAND_LINE = 'W/S ENGINE · A/D RUDDER · R/F DEPTH · C CRASH DIVE · P SCOPE · ←/→ TRAIN · ↑/↓ POWER · T LOCK · SPACE FIRE · 1-5 TUBE · TAB PING · X SILENT · H HELP · I STATS · ESC PAUSE';
function drawCommandLine(c, r) {
  let size = FS * 0.85;
  c.font = font(size, true);
  const w = c.measureText(COMMAND_LINE).width;
  if (w > r.w) size *= r.w / w;
  text(c, COMMAND_LINE, r.x + r.w / 2, r.y + r.h / 2, rgba(INK, 0.75), size, 'center');
}

/* ---------- overlays ---------- */
function panel(c, w, h) {
  const x = (W - w) / 2, y = (H - h) / 2;
  c.fillStyle = 'rgba(0,0,0,0.88)';
  c.fillRect(x, y, w, h);
  c.beginPath();
  c.rect(x, y, w, h);
  c.rect(x + 5, y + 5, w - 10, h - 10);
  stroke(c, C[INK], LW * 1.4, 0.9);
  return { x, y, w, h };
}

];

function wrapText(c, str, maxW, size) {
  c.font = font(size, true);
  const words = str.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (c.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

function drawHelp(c) {
  const pw = Math.min(W * 0.9, 1250), ph = Math.min(H * 0.88, 760);
  const r = panel(c, pw, ph);
  const fs = clamp(Math.min(ph / 34, pw / 70), 9, 17);
  text(c, 'U-BOOT ZONE · COMMANDER\'S HANDBOOK', r.x + r.w / 2, r.y + fs * 2, C[INK], fs * 1.4, 'center');
  let y = r.y + fs * 4.5;
  const x0 = r.x + fs * 2;
  for (const [k, d] of HELP_KEYS) {
    text(c, k, x0, y, C.yellow, fs);
    text(c, d, x0 + fs * 7, y, C[INK], fs);
    y += fs * 1.6;
  }
  const x1 = r.x + r.w * 0.5, tw = r.w * 0.47;
  // Shrink the tips until they fit above the bottom line.
  const avail = r.h - fs * 7.5;
  let ts = fs * 0.92, wrapped;
  for (;;) {
    wrapped = HELP_TIPS.map(tip => wrapText(c, tip, tw, ts));
    const hgt = wrapped.reduce((a, l) => a + l.length * ts * 1.4 + ts * 0.6, 0);
    if (hgt <= avail || ts < 7) break;
    ts *= 0.94;
  }
  y = r.y + fs * 4.5;
  for (const lines of wrapped) {
    lines.forEach((l, i) => text(c, (i === 0 ? '▸ ' : '  ') + l, x1, y + i * ts * 1.4, C[INK], ts));
    y += lines.length * ts * 1.4 + ts * 0.6;
  }
  text(c, 'PRESS H OR ESC TO RETURN', r.x + r.w / 2, r.y + r.h - fs * 1.5, rgba(INK, 0.7), fs, 'center');
}

function statsLines(g) {
  const st = g.stats, sk = st.sunk;
  const acc = st.fired ? Math.round((st.hits / st.fired) * 100) : 0;
  const ships = sk.freighter + sk.tanker + sk.corvette + sk.destroyer + sk.tclass;
  const sub = Math.round(st.timeSubmerged / 60);
  return [
    ['SCORE', `${fmtInt(score(g))}  (TONNAGE ${fmtInt(st.tonnage)} + BONUS ${fmtInt(st.bonus)})`],
    ['SHIPS SUNK', `${ships}  (FREIGHTERS ${sk.freighter} · TANKERS ${sk.tanker} · CORVETTES ${sk.corvette} · DESTROYERS ${sk.destroyer} · SUBS ${sk.tclass})`],
    ['TORPEDOES', `FIRED ${st.fired} · HITS ${st.hits} · DUDS ${st.duds} · MISSED ${st.misses} · ACCURACY ${acc}%`],
    ['DEPTH CHARGES', `${st.chargesNear} EXPLODED CLOSE · ${st.airAttacks} AIR ATTACKS`],
    ['HITS TAKEN', `${st.torpedoHits} TORPEDOES · ${st.minesHit} MINES · ${st.torpedoesDodged} TORPEDOES DODGED · ${Math.round(st.damageTaken)}% DAMAGE`],
    ['DEEPEST DIVE', `${Math.round(st.maxDepth)} M`],
    ['TIME SUBMERGED', `${Math.floor(sub / 60)} H ${String(sub % 60).padStart(2, '0')} MIN (GAME TIME)`],
    ['ACTIVE PINGS', `${st.pings}`],
    ['PATROLS', `${g.patrol} STARTED · ${st.missionsWon} MISSIONS ACCOMPLISHED`],
    ['DIFFICULTY', g.diff.name],
  ];
}

/* ---------- screen effects ---------- */
function addShake(amp, dur, freq) {
  FX.shakes.push({ amp, dur, freq, t: 0, ph: Math.random() * 10 });
  if (FX.shakes.length > 20) FX.shakes.shift();
}

function flash(color, a) {
  FX.flashColor = color;
  FX.flash = Math.max(FX.flash, a);
}

function updateFX(dt, g) {
  let x = 0, y = 0, rot = 0;
  for (const s of FX.shakes) {
    s.t += dt;
    const env = Math.max(0, 1 - s.t / s.dur);
    const k = s.amp * env * env;
    if (s.freq > 20) {
      x += (Math.random() * 2 - 1) * k;
      y += (Math.random() * 2 - 1) * k;
    } else {
      x += Math.sin((s.t * s.freq) * TAU + s.ph) * k;
      y += Math.cos((s.t * s.freq * 1.3) * TAU + s.ph) * k * 0.8;
      rot += Math.sin((s.t * s.freq * 0.7) * TAU + s.ph) * k * 0.0008;
    }
  }
  FX.shakes = FX.shakes.filter(s => s.t < s.dur);
  if (g && mode !== 'title' && !overlay) {
    const p = g.player;
    const dive = Math.abs(p.vz) > 0.8 ? (Math.abs(p.vz) - 0.8) * 1.2 : 0;   // hull vibration while diving
    x += (Math.random() * 2 - 1) * dive;
    y += (Math.random() * 2 - 1) * dive;
  }
  FX.shakeX = x; FX.shakeY = y; FX.shakeRot = rot;
  FX.flash = Math.max(0, FX.flash - dt * 1.8);
}

function handleEvents(g) {
  const p = g.player;
  for (const e of g.events) {
    switch (e.type) {
      case 'launch':
        Sound.launch();
        addShake(7, 0.45, 40);
        flash('255,255,255', 0.08);
        break;
      case 'explosion': {
        const v = clamp(1 - e.dist / 9000, 0.08, 1);
        Sound.boom(v * (e.big ? 1 : 0.8), e.big);
        if (e.dist < 4000) addShake(4 * v, 1.2, 6);
        break;
      }
      case 'sunk':
        Sound.breakup(clamp(1 - e.dist / 8000, 0.1, 0.7));
        break;
      case 'charge': {
        const v = clamp(1 - e.dist / 1500, 0.05, 1);
        Sound.charge(v);
        addShake(clamp(600 / Math.max(e.dist, 20), 0, 30), 1.4, 9);
        if (e.dist < 200) addShake(clamp(300 / Math.max(e.dist, 10), 0, 18), 0.4, 40);
        if (e.damage > 0.5) flash('255,59,48', clamp(e.damage / 40, 0.15, 0.6));
        else if (e.dist < 150) flash('255,255,255', 0.15);
        break;
      }
      case 'shellHit':
        Sound.boom(0.9, false);
        addShake(16, 0.6, 40);
        flash('255,59,48', 0.4);
        break;
      case 'splash': Sound.splash(clamp(1 - e.dist / 600, 0.1, 0.8)); if (e.dist < 60) addShake(4, 0.3, 30); break;
      case 'gun': Sound.gun(clamp(1 - e.dist / 7000, 0.1, 0.6)); break;
      case 'dud': Sound.clunk(clamp(1 - e.dist / 6000, 0.15, 0.8)); break;
      case 'ping': Sound.ping(0.5, 1180); break;
      case 'echo': Sound.ping(clamp(0.35 * (1 - e.dist / SONAR_RANGE), 0.05, 0.35), 1180, true); break;
      case 'enemyPing': Sound.ping(clamp(0.45 * (1 - e.dist / 4000), 0.04, 0.45), 880); break;
      case 'klaxon': Sound.klaxon(); addShake(3, 2, 4); break;
      case 'creak': Sound.creak(clamp((e.depth - 150) / 130, 0.1, 1)); addShake(2, 1, 3); break;
      case 'detected': Sound.alarm(); break;
      case 'periscope': Sound.periscope(); break;
      case 'chargesAway': break;
      case 'patrol':
        if (g.patrol > 1) Sound.ping(0.25, 660);
        if (mode === 'play') overlay = 'briefing';
        break;
      case 'enemyLaunch': Sound.launch(clamp(1 - e.dist / 5000, 0.15, 0.6)); Sound.alarm(); break;
      case 'torpedoHit':
        Sound.boom(1, true);
        addShake(28, 1.6, 40);
        addShake(14, 2.5, 6);
        flash('255,59,48', 0.7);
        break;
      case 'mine':
        Sound.charge(1);
        addShake(26, 1.5, 40);
        flash('255,154,42', 0.6);
        break;
      case 'aircraft': Sound.alarm(); break;
      case 'planeAttack': break;
      case 'planeDrop': Sound.splash(clamp(1 - e.dist / 2000, 0.1, 0.6)); break;
      case 'patrolEnd': break;
      case 'destroyed':
        Sound.boom(1, true);
        Sound.breakup(1);
        addShake(30, 3, 7);
        addShake(14, 1, 40);
        flash('255,59,48', 0.8);
        break;
    }
  }
  g.events.length = 0;
  INK = p.alive && p.hull < 30 ? 'red' : 'green';
}

/* ---------- sound (WebAudio, everything synthesized) ---------- */
const Sound = {
  ac: null, master: null, enabled: true, noiseBuf: null, amb: null,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ac = new AC();
    } catch (e) { return; }
    const ac = this.ac;
    this.master = ac.createGain();
    this.master.gain.value = this.enabled ? 0.7 : 0;
    this.master.connect(ac.destination);
    const len = ac.sampleRate * 2;
    this.noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    // ambient: engine and hydrophone propeller churn
    const engSrc = this.noiseSrc(true);
    const engF = ac.createBiquadFilter(); engF.type = 'lowpass'; engF.frequency.value = 120;
    const engG = ac.createGain(); engG.gain.value = 0;
    engSrc.connect(engF).connect(engG).connect(this.master);
    const chSrc = this.noiseSrc(true);
    const chF = ac.createBiquadFilter(); chF.type = 'bandpass'; chF.frequency.value = 320; chF.Q.value = 1.5;
    const chAm = ac.createGain(); chAm.gain.value = 0.5;
    const lfo = ac.createOscillator(); lfo.frequency.value = 5;
    const lfoG = ac.createGain(); lfoG.gain.value = 0.5;
    lfo.connect(lfoG).connect(chAm.gain);
    const chG = ac.createGain(); chG.gain.value = 0;
    chSrc.connect(chF).connect(chAm).connect(chG).connect(this.master);
    lfo.start();
    // aircraft engine drone
    const drone = ac.createOscillator(); drone.type = 'sawtooth'; drone.frequency.value = 85;
    const drone2 = ac.createOscillator(); drone2.type = 'sawtooth'; drone2.frequency.value = 88;
    const dF = ac.createBiquadFilter(); dF.type = 'lowpass'; dF.frequency.value = 400;
    const dG = ac.createGain(); dG.gain.value = 0;
    drone.connect(dF); drone2.connect(dF); dF.connect(dG).connect(this.master);
    drone.start(); drone2.start();
    // enemy torpedo propeller whine
    const whine = ac.createOscillator(); whine.type = 'triangle'; whine.frequency.value = 1900;
    const wG = ac.createGain(); wG.gain.value = 0;
    whine.connect(wG).connect(this.master);
    whine.start();
    // storm wind
    const wind = this.noiseSrc(true);
    const wiF = ac.createBiquadFilter(); wiF.type = 'bandpass'; wiF.frequency.value = 700; wiF.Q.value = 0.6;
    const wiG = ac.createGain(); wiG.gain.value = 0;
    wind.connect(wiF).connect(wiG).connect(this.master);
    this.amb = { engF, engG, chG, lfo, dG, drone, wG, whine, wiG, wiF };
  },
  toggle() {
    this.enabled = !this.enabled;
    if (this.master) this.master.gain.setTargetAtTime(this.enabled ? 0.7 : 0, this.ac.currentTime, 0.05);
  },
  noiseSrc(loop) {
    const s = this.ac.createBufferSource();
    s.buffer = this.noiseBuf;
    s.loop = !!loop;
    if (loop) s.start(0, Math.random() * 1.5);
    return s;
  },
  env(g, t, attack, peak, decay) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  },
  ok() { return this.ac && this.enabled; },
  ping(vol, freq, short) {
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime;
    const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
    const g = ac.createGain();
    this.env(g, t, 0.006, vol, short ? 0.35 : 1.6);
    const dl = ac.createDelay(); dl.delayTime.value = 0.31;
    const fb = ac.createGain(); fb.gain.value = 0.33;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
    o.connect(g); g.connect(lp).connect(this.master);
    g.connect(dl); dl.connect(fb).connect(dl); dl.connect(lp);
    o.start(t); o.stop(t + 3);
  },
  boom(vol, big) {
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime;
    const n = this.noiseSrc(false);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(big ? 900 : 600, t);
    lp.frequency.exponentialRampToValueAtTime(80, t + (big ? 3 : 1.8));
    const g = ac.createGain();
    this.env(g, t, 0.01, vol * 0.9, big ? 3.2 : 2);
    n.connect(lp).connect(g).connect(this.master);
    n.start(t); n.stop(t + 4);
    const o = ac.createOscillator(); o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(22, t + 1.5);
    const og = ac.createGain(); this.env(og, t, 0.01, vol * 0.8, 1.5);
    o.connect(og).connect(this.master);
    o.start(t); o.stop(t + 2);
  },
  charge(vol) {
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime;
    const n = this.noiseSrc(false);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 160 + vol * 300;
    const g = ac.createGain(); this.env(g, t, 0.005, vol, 3.5);
    n.connect(lp).connect(g).connect(this.master);
    n.start(t); n.stop(t + 4);
    const o = ac.createOscillator(); o.frequency.setValueAtTime(48, t); o.frequency.exponentialRampToValueAtTime(18, t + 2);
    const og = ac.createGain(); this.env(og, t, 0.005, vol, 2.2);
    o.connect(og).connect(this.master);
    o.start(t); o.stop(t + 2.5);
    if (vol > 0.5) {                                  // the hull rings
      const m = ac.createOscillator(); m.type = 'triangle'; m.frequency.value = 210;
      const mg = ac.createGain(); this.env(mg, t + 0.05, 0.01, 0.12 * vol, 1.2);
      m.connect(mg).connect(this.master);
      m.start(t); m.stop(t + 1.5);
    }
  },
  launch(vol) {
    if (!this.ok()) return;
    vol = vol === undefined ? 1 : vol;
    const ac = this.ac, t = ac.currentTime;
    const o = ac.createOscillator(); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(35, t + 0.35);
    const og = ac.createGain(); this.env(og, t, 0.005, 0.8 * vol, 0.4);
    o.connect(og).connect(this.master);
    o.start(t); o.stop(t + 0.6);
    const n = this.noiseSrc(false);
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(1400, t); bp.frequency.exponentialRampToValueAtTime(200, t + 1.4);
    const g = ac.createGain(); this.env(g, t, 0.02, 0.5 * vol, 1.4);
    n.connect(bp).connect(g).connect(this.master);
    n.start(t); n.stop(t + 2);
  },
  clunk(vol) {
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime;
    for (const f of [310, 467]) {
      const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = f;
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
      const g = ac.createGain(); this.env(g, t, 0.002, vol * 0.2, 0.25);
      o.connect(lp).connect(g).connect(this.master);
      o.start(t); o.stop(t + 0.4);
    }
  },
  klaxon() {
    if (!this.ok()) return;
    const ac = this.ac;
    for (let i = 0; i < 3; i++) {
      const t = ac.currentTime + i * 0.75;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(330, t); o.frequency.linearRampToValueAtTime(520, t + 0.5);
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.18, t + 0.05);
      g.gain.setValueAtTime(0.18, t + 0.5); g.gain.linearRampToValueAtTime(0.0001, t + 0.6);
      o.connect(lp).connect(g).connect(this.master);
      o.start(t); o.stop(t + 0.65);
    }
  },
  alarm() {
    if (!this.ok()) return;
    const ac = this.ac;
    for (let i = 0; i < 6; i++) {
      const t = ac.currentTime + i * 0.16;
      const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = 760;
      const g = ac.createGain(); this.env(g, t, 0.003, 0.08, 0.12);
      o.connect(g).connect(this.master);
      o.start(t); o.stop(t + 0.15);
    }
  },
  creak(vol) {
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime;
    const o = ac.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(55 + Math.random() * 30, t);
    o.frequency.linearRampToValueAtTime(40 + Math.random() * 60, t + 1.6);
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 9;
    bp.frequency.setValueAtTime(250, t); bp.frequency.exponentialRampToValueAtTime(900, t + 1.6);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.35 * vol, t + 0.4); g.gain.linearRampToValueAtTime(0.0001, t + 1.7);
    o.connect(bp).connect(g).connect(this.master);
    o.start(t); o.stop(t + 1.8);
  },
  breakup(vol) {
    if (!this.ok()) return;
    for (let i = 0; i < 3; i++) setTimeout(() => this.creak(vol), i * 700 + Math.random() * 400);
    setTimeout(() => this.boom(vol * 0.5, false), 1800);
  },
  splash(vol) {
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime;
    const n = this.noiseSrc(false);
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
    const g = ac.createGain(); this.env(g, t, 0.01, vol * 0.4, 0.7);
    n.connect(hp).connect(g).connect(this.master);
    n.start(t); n.stop(t + 1);
  },
  gun(vol) {
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime;
    const n = this.noiseSrc(false);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    const g = ac.createGain(); this.env(g, t, 0.005, vol * 0.5, 0.5);
    n.connect(lp).connect(g).connect(this.master);
    n.start(t); n.stop(t + 0.7);
  },
  periscope() {
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime;
    const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 95;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 300;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.08, t + 0.1); g.gain.linearRampToValueAtTime(0.0001, t + 0.9);
    o.connect(lp).connect(g).connect(this.master);
    o.start(t); o.stop(t + 1);
  },
  update(g) {
    if (!this.ac || !this.amb) return;
    const t = this.ac.currentTime;
    let eng = 0, engF = 120, churn = 0, rate = 5, droneV = 0, whineV = 0, windV = 0;
    if (g && mode === 'play' && !overlay && g.player.alive) {
      const p = g.player;
      for (const pl of g.planes) {
        const d = dist2d(p.x, p.y, pl.x, pl.y);
        if (d < 5000) droneV = Math.max(droneV, 0.12 * (1 - d / 5000) ** 1.5 * (p.depth > PERISCOPE_MAX ? 0.25 : 1));
      }
      for (const tp of g.torpedoes) {
        if (tp.owner !== 'enemy') continue;
        const d = dist2d(p.x, p.y, tp.x, tp.y);
        if (d < 3000) whineV = Math.max(whineV, 0.05 * (1 - d / 3000) ** 2);
      }
      if (g.cond.sea === 'storm') windV = p.depth <= PERISCOPE_MAX ? (p.depth < SURFACED_DEPTH ? 0.12 : 0.05) : 0.01;
      const surf = p.depth <= SURFACED_DEPTH;
      eng = surf ? 0.08 + Math.abs(p.speed) / 17 * 0.12 : Math.abs(p.speed) / 7.6 * 0.05;
      engF = surf ? 90 + Math.abs(p.speed) * 6 : 300 + Math.abs(p.speed) * 40;
      let best = null, bd = 1e9;
      for (const s of g.ships) {
        if (s.sinking) continue;
        const d = dist2d(p.x, p.y, s.x, s.y);
        if (d < bd) { bd = d; best = s; }
      }
      if (best && bd < 4500) {
        churn = 0.22 * (1 - bd / 4500) ** 1.5 * (p.depth > SURFACED_DEPTH ? 1 : 0.4);
        rate = 2 + best.speed * 0.45;
      }
    }
    this.amb.engG.gain.setTargetAtTime(eng, t, 0.3);
    this.amb.engF.frequency.setTargetAtTime(engF, t, 0.3);
    this.amb.chG.gain.setTargetAtTime(churn, t, 0.4);
    this.amb.lfo.frequency.setTargetAtTime(rate, t, 0.5);
    this.amb.dG.gain.setTargetAtTime(droneV, t, 0.3);
    this.amb.wG.gain.setTargetAtTime(whineV, t, 0.2);
    this.amb.whine.frequency.setTargetAtTime(1800 + whineV * 6000, t, 0.2);
    this.amb.wiG.gain.setTargetAtTime(windV, t, 0.8);
    this.amb.wiF.frequency.setTargetAtTime(500 + Math.sin(t * 0.7) * 250, t, 0.5);
  },
};

/* ---------- high scores ---------- */
const SCORE_KEY = 'uboot-zone.scores';
function loadScores() {
  try {
    const v = JSON.parse(window.localStorage.getItem(SCORE_KEY) || '[]');
    return Array.isArray(v) ? v : [];
  } catch (e) {
    return [];
  }
}

function saveScore(g) {
  const list = loadScores();
  const entry = { score: score(g), grt: g.stats.tonnage, patrol: g.patrol, diff: g.diff.name, date: new Date().toISOString().slice(0, 10), id: Date.now() };
  list.push(entry);
  const val = e => (e.score !== undefined ? e.score : e.grt);
  list.sort((a, b) => val(b) - val(a));
  const top = list.slice(0, 5);
  g.scoreRank = top.findIndex(s => s.id === entry.id);
  try { window.localStorage.setItem(SCORE_KEY, JSON.stringify(top)); } catch (e) { /* storage unavailable */ }
}

/* ---------- input ---------- */
const HOLD_KEYS = { KeyA: 'rudderLeft', KeyD: 'rudderRight', ArrowLeft: 'scopeLeft', ArrowRight: 'scopeRight', ShiftLeft: 'scopeFast', ShiftRight: 'scopeFast' };
const GAME_KEYS = new Set(['Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);

function newGame() {
  game = createGame({ difficulty: titleDifficulty });
  mode = 'play';
  overlay = null;
  FX.shakes = [];
}

function onKeyDown(e) {
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  Sound.init();
  if (HOLD_KEYS[e.code]) input[HOLD_KEYS[e.code]] = true;
  if (e.repeat) return;
  const code = e.code;
  if (code === 'KeyM') { Sound.toggle(); return; }
  if (code === 'KeyG') { effectsOn = !effectsOn; effectsChosen = true; return; }

  if (mode === 'title') {
    if (overlay === 'help') { if (code === 'KeyH' || code === 'Escape') overlay = null; return; }
    if (code === 'Digit1') titleDifficulty = 'easy';
    else if (code === 'Digit2') titleDifficulty = 'normal';
    else if (code === 'Digit3') titleDifficulty = 'hard';
    else if (code === 'KeyH') overlay = 'help';
    else if (code === 'Enter' || code === 'Space') newGame();
    return;
  }
  if (mode === 'over') {
    if (code === 'Enter') newGame();
    else if (code === 'Escape') { mode = 'title'; game = null; overlay = null; }
    return;
  }
  // playing
  if (overlay) {
    if (overlay === 'briefing') {
      if (code === 'Enter' || code === 'Escape') overlay = null;
      return;
    }
    if (overlay === 'pause' && code === 'KeyQ') {
      game.state = 'lost';
      game.lostReason = 'PATROL ABANDONED';
      saveScore(game);
      mode = 'over';
      overlay = null;
      return;
    }
    if (code === 'Escape' || (overlay === 'help' && code === 'KeyH') || (overlay === 'stats' && code === 'KeyI')) overlay = null;
    return;
  }
  const g = game;
  switch (code) {
    case 'Escape': overlay = 'pause'; break;
    case 'KeyH': overlay = 'help'; break;
    case 'KeyI': overlay = 'stats'; break;
    case 'KeyW': command(g, 'engineUp'); break;
    case 'KeyS': command(g, 'engineDown'); break;
    case 'KeyR': command(g, 'depthUp'); break;
    case 'KeyF': command(g, 'depthDown'); break;
    case 'KeyC': command(g, 'crashDive'); break;
    case 'KeyP': command(g, 'periscope'); break;
    case 'ArrowUp': command(g, 'zoomIn'); break;
    case 'ArrowDown': command(g, 'zoomOut'); break;
    case 'KeyB': command(g, 'scopeToBow'); break;
    case 'KeyT': command(g, 'lock'); break;
    case 'Space': command(g, 'fire'); break;
    case 'Tab': command(g, 'ping'); break;
    case 'KeyX': command(g, 'silent'); break;
    case 'Digit1': case 'Digit2': case 'Digit3': case 'Digit4': case 'Digit5':
      command(g, 'tube', Number(code.slice(5)) - 1);
      break;
  }
}

function onKeyUp(e) {
  if (HOLD_KEYS[e.code]) input[HOLD_KEYS[e.code]] = false;
}

/* ---------- main loop ---------- */
function render(dt) {
  const c = sctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.globalCompositeOperation = 'source-over';
  c.fillStyle = effectsOn ? 'rgba(0,0,0,0.55)' : '#000';
  c.fillRect(0, 0, W, H);
  c.save();
  c.translate(W / 2 + FX.shakeX, H / 2 + FX.shakeY);
  c.rotate(FX.shakeRot);
  c.translate(-W / 2, -H / 2);
  if (mode === 'title') {
    drawTitle(c, titleTime);
  } else if (game) {
    drawPeriscope(c, game, LAYOUT.view);
    drawBottom(c, game, LAYOUT.bottom);
    drawRight(c, game, LAYOUT.right);
    drawCommandLine(c, LAYOUT.cmd);
  }
  c.restore();
  if (overlay === 'briefing' && game) drawBriefing(c, game);
  else if (overlay === 'help') drawHelp(c);
  else if (overlay === 'stats' && game) drawStats(c, game, `PATROL REPORT · PATROL ${game.patrol}`);
  else if (overlay === 'pause') drawPause(c);
  if (mode === 'over' && game) drawStats(c, game, `U-BOOT LOST · ${game.lostReason}`, game.scoreRank >= 0 ? `NEW HIGH SCORE: #${game.scoreRank + 1}` : '');

  // present: phosphor glow, scanlines, flashes
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(scene, 0, 0);
  if (effectsOn) {
    gctx.globalCompositeOperation = 'source-over';
    gctx.clearRect(0, 0, glow.width, glow.height);
    gctx.filter = 'blur(1.5px)';
    gctx.drawImage(scene, 0, 0, glow.width, glow.height);
    gctx.filter = 'none';
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.9;
    ctx.drawImage(glow, 0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    if (scanPattern) {
      ctx.fillStyle = scanPattern;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  }
  if (FX.flash > 0.01) {
    ctx.fillStyle = `rgba(${FX.flashColor},${FX.flash})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  if (game && mode === 'play' && INK === 'red') {
    ctx.fillStyle = `rgba(255,0,0,${0.05 + 0.04 * Math.sin(performance.now() / 200)})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

function frame(now) {
  const dt = lastFrame ? Math.min(0.1, (now - lastFrame) / 1000) : 1 / 60;
  lastFrame = now;
  titleTime += dt;
  if (game && (mode === 'play' || mode === 'over') && !overlay) {
    step(game, dt, mode === 'play' ? input : {});
    handleEvents(game);
    if (mode === 'play' && game.state === 'lost' && game.realTime - game.lostAt > 4) {
      saveScore(game);
      mode = 'over';
    }
  }
  // A slow machine (no GPU canvas) gets the plain look instead of a low frame rate.
  if (mode === 'play' && !overlay && effectsOn && !effectsChosen) {
    perf.ema += (dt - perf.ema) * 0.05;
    perf.t += dt;
    if (perf.t > 4 && perf.ema > 0.032) {
      effectsOn = false;
      effectsChosen = true;
      say(game, 'CRT EFFECTS OFF TO KEEP THE FRAME RATE · G TURNS THEM ON', 'yellow');
    }
  }
  updateFX(dt, game);
  Sound.update(game);
  render(dt);
  window.requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);
window.addEventListener('blur', () => { for (const k in input) input[k] = false; });
resize();
window.requestAnimationFrame(frame);
</script>
</body>
</html>
